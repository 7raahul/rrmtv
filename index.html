<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineStream - Ultra Modern UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Glassmorphism Styles */
        .glass-header {
            background: rgba(10, 15, 30, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(20, 27, 45, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glass-card:active {
            transform: scale(0.97);
        }
        .glass-modal {
            background: rgba(7, 11, 22, 0.92);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
    </style>
</head>
<body class="bg-[#070a13] text-slate-100 font-sans antialiased min-h-screen pb-24 select-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/30 via-[#070a13] to-[#070a13]">

    <!-- Fixed Glass Header -->
    <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="resetToHome()">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-red-500/25 border border-white/20">
                <i class="fa-solid fa-play text-white text-xs"></i>
            </div>
            <div>
                <span class="text-lg font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent block leading-none">CineStream</span>
                <span class="text-[9px] text-red-500 font-bold uppercase tracking-widest">Premium</span>
            </div>
        </div>
        
        <!-- Right Top Action Icon -->
        <button onclick="switchTab('search')" class="w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-slate-300 hover:text-white border border-white/10 active:bg-white/10 transition">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="p-4 max-w-7xl mx-auto space-y-6">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-5">
            <!-- OTT Filters -->
            <div class="flex gap-2.5 overflow-x-auto no-scrollbar py-1">
                <button onclick="changeOTTFilter('trending', this)" class="ott-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 whitespace-nowrap border border-red-400/30">Trending</button>
                <button onclick="changeOTTFilter(8, this)" class="ott-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">Netflix</button>
                <button onclick="changeOTTFilter(119, this)" class="ott-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">Prime Video</button>
                <button onclick="changeOTTFilter(122, this)" class="ott-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">JioHotstar</button>
                <button onclick="changeOTTFilter(237, this)" class="ott-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">SonyLIV</button>
            </div>

            <div class="flex justify-between items-center">
                <h2 id="section-title" class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    Trending Today
                </h2>
            </div>

            <!-- Media Grid -->
            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>

            <!-- Scroll Loader -->
            <div id="infinite-loader" class="py-6 text-center text-slate-500 text-xs hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-lg text-red-500 mb-1"></i>
                <p>Loading more titles...</p>
            </div>
        </section>

        <!-- SEARCH TAB -->
        <section id="tab-search" class="hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search Movies, TV Shows, Cast..." class="w-full glass-card rounded-2xl pl-11 pr-4 py-3.5 text-sm text-slate-100 focus:outline-none focus:border-red-500/60 transition">
            </div>
            <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
                <p class="col-span-full text-center text-slate-500 py-12 text-xs">Search anything on TMDB...</p>
            </div>
        </section>

        <!-- UPCOMING TAB -->
        <section id="tab-upcoming" class="hidden space-y-4">
            <h2 class="text-base font-bold text-white">Upcoming Releases</h2>
            <div id="upcoming-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
        </section>

    </main>

    <!-- Details Modal (Popstate Back Support) -->
    <div id="details-modal" class="fixed inset-0 z-50 glass-modal hidden overflow-y-auto">
        <button onclick="closeModalManual()" class="fixed top-4 right-4 z-50 w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-white border border-white/20 active:scale-95 transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content" class="max-w-2xl mx-auto pb-12"></div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-header px-6 py-2.5 flex justify-around items-center border-t border-white/10">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-red-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('search')" id="nav-search" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] font-semibold">Explore</span>
        </button>
        <button onclick="switchTab('upcoming')" id="nav-upcoming" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-calendar-days text-lg"></i>
            <span class="text-[10px] font-semibold">Upcoming</span>
        </button>
    </nav>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        // Infinite Scroll & Filter State
        let currentTab = 'home';
        let currentFilter = 'trending';
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let searchTimeout = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadHomeTitles(true);
            setupHistoryState();
            setupInfiniteScroll();
        });

        // Browser Back Button Management (Prevents Exiting Site)
        function setupHistoryState() {
            window.history.replaceState({ modalOpen: false, tab: 'home' }, '');
            window.addEventListener('popstate', (e) => {
                const modal = document.getElementById('details-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModalDOM();
                } else if (e.state && e.state.tab) {
                    switchTabDOM(e.state.tab);
                }
            });
        }

        function resetToHome() {
            if (currentTab !== 'home') switchTab('home');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchTab(tabName) {
            if (currentTab === tabName) return;
            window.history.pushState({ modalOpen: false, tab: tabName }, '');
            switchTabDOM(tabName);
        }

        function switchTabDOM(tabName) {
            currentTab = tabName;
            ['home', 'search', 'upcoming'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.replace('text-red-500', 'text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.replace('text-slate-400', 'text-red-500');

            if (tabName === 'upcoming' && document.getElementById('upcoming-grid').children.length === 0) {
                loadUpcoming();
            }
        }

        async function fetchTMDB(endpoint, params = '') {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&region=IN${params}`);
                return await res.json();
            } catch (err) {
                console.error("API Fetch Error:", err);
                return null;
            }
        }

        // OTT Filter Change
        function changeOTTFilter(filterVal, btnEl) {
            document.querySelectorAll('.ott-btn').forEach(b => {
                b.className = "ott-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10";
            });
            if (btnEl) btnEl.className = "ott-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 whitespace-nowrap border border-red-400/30";

            currentFilter = filterVal;
            const ottNames = { 8: 'Netflix', 119: 'Prime Video', 122: 'JioHotstar', 237: 'SonyLIV' };
            document.getElementById('section-title').innerHTML = filterVal === 'trending' 
                ? `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Trending Today`
                : `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> Popular on ${ottNames[filterVal]}`;

            loadHomeTitles(true);
        }

        // Infinite Scroll Handler
        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (currentTab !== 'home' || isFetching || !hasMore) return;
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                    loadHomeTitles(false);
                }
            });
        }

        async function loadHomeTitles(reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                showGridSkeleton('home-grid');
            } else {
                document.getElementById('infinite-loader').classList.remove('hidden');
            }

            let endpoint = currentFilter === 'trending' ? '/trending/all/day' : '/discover/movie';
            let params = `&page=${currentPage}`;
            if (currentFilter !== 'trending') {
                params += `&with_watch_providers=${currentFilter}&watch_region=IN&sort_by=popularity.desc`;
            }

            const data = await fetchTMDB(endpoint, params);
            document.getElementById('infinite-loader').classList.add('hidden');

            if (data && data.results && data.results.length > 0) {
                renderGrid(data.results, 'home-grid', !reset);
                currentPage++;
                if (currentPage > data.total_pages) hasMore = false;
            } else {
                hasMore = false;
            }

            isFetching = false;
        }

        async function loadUpcoming() {
            showGridSkeleton('upcoming-grid');
            const data = await fetchTMDB('/movie/upcoming', '&page=1');
            renderGrid(data.results, 'upcoming-grid');
        }

        function handleSearch(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.getElementById('search-grid').innerHTML = '<p class="col-span-full text-center text-slate-500 py-12 text-xs">Search anything on TMDB...</p>';
                return;
            }
            searchTimeout = setTimeout(async () => {
                showGridSkeleton('search-grid');
                const data = await fetchTMDB('/search/multi', `&query=${encodeURIComponent(query)}`);
                const filtered = data.results ? data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv') : [];
                renderGrid(filtered, 'search-grid');
            }, 400);
        }

        function renderGrid(items, targetId, append = false) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                if (!append) container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12 text-xs">No results found.</p>`;
                return;
            }

            const html = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const type = item.media_type || (item.title ? 'movie' : 'tv');

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="glass-card rounded-2xl overflow-hidden transition duration-300 cursor-pointer flex flex-col group">
                        <div class="relative aspect-[2/3] bg-slate-900/60 overflow-hidden">
                            <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1 border border-white/10 shadow-md">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="p-2.5 flex flex-col justify-between flex-grow">
                            <h3 class="text-xs font-semibold text-slate-100 line-clamp-1">${title}</h3>
                            <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5">
                                <span>${year}</span>
                                <span class="uppercase tracking-wider font-bold text-[8px] bg-white/5 border border-white/10 px-1.5 py-0.5 rounded-md text-slate-300">${type}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (append) {
                container.innerHTML += html;
            } else {
                container.innerHTML = html;
            }
        }

        // Modal Open Logic (with History Push State)
        async function openDetails(type, id) {
            window.history.pushState({ modalOpen: true, tab: currentTab }, '');
            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `<div class="p-16 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500 mb-3"></i><p class="text-xs">Loading details...</p></div>`;

            const data = await fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers');

            if (!data) {
                content.innerHTML = `<p class="p-12 text-center text-red-400 text-xs">Failed to load content.</p>`;
                return;
            }

            const title = data.title || data.name;
            const backdrop = data.backdrop_path ? `${BACKDROP_URL}${data.backdrop_path}` : `${IMG_URL}${data.poster_path}`;
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const releaseDate = data.release_date || data.first_air_date || 'N/A';
            const cast = data.credits?.cast?.slice(0, 10) || [];
            const providers = data['watch/providers']?.results?.IN?.flatrate || [];

            content.innerHTML = `
                <div class="relative aspect-video w-full bg-slate-900">
                    <img src="${backdrop}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#070a13] via-[#070a13]/50 to-transparent"></div>
                </div>
                
                <div class="px-5 -mt-20 relative z-10 space-y-5">
                    <div class="flex items-end gap-4">
                        <img src="${IMG_URL}${data.poster_path}" class="w-28 h-40 rounded-2xl border border-white/20 shadow-2xl object-cover flex-shrink-0">
                        <div class="space-y-1.5">
                            <span class="text-[10px] font-bold text-red-500 uppercase tracking-widest bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded-md">${type === 'movie' ? 'Movie' : 'TV Show'}</span>
                            <h1 class="text-xl font-bold text-white leading-tight">${title}</h1>
                            <div class="flex items-center gap-3 text-xs text-slate-300">
                                <span class="text-amber-400 font-bold flex items-center gap-1"><i class="fa-solid fa-star"></i> ${rating}</span>
                                <span>•</span>
                                <span>${releaseDate}</span>
                            </div>
                        </div>
                    </div>

                    <!-- OTT Platforms (ONLY LOGOS - NO OVERLAP & NO TEXT) -->
                    ${providers.length > 0 ? `
                        <div class="glass-card p-3.5 rounded-2xl">
                            <p class="text-xs font-semibold text-slate-300 mb-2.5">Available On (India):</p>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                                ${providers.map(p => `
                                    <div class="flex-none w-11 h-11 rounded-2xl overflow-hidden bg-slate-900 border border-white/15 p-1 flex items-center justify-center shadow-lg">
                                        <img src="${IMG_URL}${p.logo_path}" title="${p.provider_name}" class="w-full h-full object-cover rounded-xl">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass-card p-4 rounded-2xl">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Overview</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">${data.overview || 'No overview available.'}</p>
                    </div>

                    <!-- Cast with Photos -->
                    ${cast.length > 0 ? `
                        <div>
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Top Cast</h3>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                                ${cast.map(c => {
                                    const photo = c.profile_path ? `${IMG_URL}${c.profile_path}` : 'https://via.placeholder.com/150?text=No+Photo';
                                    return `
                                        <div class="flex-none w-24 glass-card p-2 rounded-2xl text-center flex flex-col items-center">
                                            <img src="${photo}" class="w-14 h-14 rounded-full object-cover border border-white/20 mb-2 shadow-md">
                                            <p class="text-[11px] font-semibold text-slate-100 truncate w-full">${c.name}</p>
                                            <p class="text-[9px] text-slate-400 truncate w-full mt-0.5">${c.character || ''}</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${data.seasons ? `
                        <div class="glass-card p-4 rounded-2xl">
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Seasons (${data.number_of_seasons})</h3>
                            <div class="space-y-2">
                                ${data.seasons.slice(0, 5).map(s => `
                                    <div class="flex items-center justify-between bg-white/5 border border-white/10 p-3 rounded-xl">
                                        <span class="text-xs font-medium text-slate-200">${s.name}</span>
                                        <span class="text-[10px] text-slate-400 bg-white/5 px-2 py-1 rounded-md border border-white/5">${s.episode_count} Episodes</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function closeModalManual() {
            window.history.back();
        }

        function closeModalDOM() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="glass-card rounded-2xl aspect-[2/3] animate-pulse"></div>
            `).join('');
        }
    </script>
</body>
</html>
