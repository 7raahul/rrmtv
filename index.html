                const logoTargets = content.querySelectorAll('.detail-title-logo-target');
                logoTargets.forEach(el => {
                    el.outerHTML = `<img src="${url}" alt="${title}" class="detail-title-logo-target max-h-9 lg:max-h-12 max-w-[80%] object-contain object-left drop-shadow-2xl my-1" onerror="this.outerHTML='<h1 class=\"text-lg lg:text-2xl font-bold text-white leading-tight drop-shadow-lg\">${title.replace(/'/g, '&#39;')}</h1>'">`;
                });
            }).catch(() => {});

            if (hasEpisodesTab) {
                loadSeasonEpisodes(id, validSeasons[0].season_number, document.querySelector('.season-btn'));
            }
            if (hasMedia) setMediaKind(mediaKinds[0]);
            if (collection) {
                fetchTMDB(`/collection/${collection.id}`).then(col => {
                    const wrap = document.getElementById('collection-wrap');
                    if (!wrap || wrap.dataset.cid != col?.id) return;
                    const parts = (col.parts || [])
                        .filter(pt => pt.id !== id)
                        .sort((a, b) => (a.release_date || '9999').localeCompare(b.release_date || '9999'))
                        .map(pt => ({ ...pt, media_type: 'movie' }));
                    if (!parts.length) { wrap.remove(); return; }
                    renderGrid(parts, 'collection-grid');
                });
            }

            startDetailBackdropRotation(backdropList);
        }

        // Rotates the details-modal backdrop through a title's TMDB 16:9 backdrops
        // every 3.5s, crossfading between two stacked <img> layers.
        let detailBackdropTimer = null;
        function stopDetailBackdropRotation() {
            if (detailBackdropTimer) {
                clearInterval(detailBackdropTimer);
                detailBackdropTimer = null;
            }
        }
        function startDetailBackdropRotation(urls) {
            stopDetailBackdropRotation();
            if (!urls || urls.length <= 1) return;

            let idx = 0;
            let showingA = true;
            detailBackdropTimer = setInterval(() => {
                // Two image pairs: mobile left column ('') and desktop header ('-d')
                const pairs = ['', '-d'].map(sfx => [
                    document.getElementById('detail-backdrop-a' + sfx),
                    document.getElementById('detail-backdrop-b' + sfx)
                ]).filter(([a, b]) => a && b);
                if (!pairs.length) { stopDetailBackdropRotation(); return; }

                idx = (idx + 1) % urls.length;
                const nextUrl = urls[idx];
                pairs.forEach(([imgA, imgB]) => {
                    const incoming = showingA ? imgB : imgA;
                    const outgoing = showingA ? imgA : imgB;
                    incoming.src = nextUrl;
                    incoming.classList.remove('opacity-0');
                    incoming.classList.add('opacity-100');
                    outgoing.classList.remove('opacity-100');
                    outgoing.classList.add('opacity-0');
                });
                showingA = !showingA;
            }, 3500);
        }

        function switchDetailTab(tab) {
            ['overview', 'episodes', 'more', 'media'].forEach(t => {
                const panel = document.getElementById(`dpanel-${t}`);
                const btn = document.getElementById(`dtab-${t}`);
                if (panel) panel.classList.toggle('hidden', t !== tab);
                if (btn) btn.className = `detail-tab-btn pb-2 text-xs lg:text-sm font-bold whitespace-nowrap transition border-b-2 ${t === tab ? 'text-white border-amber-400' : 'text-slate-400 border-transparent'}`;
            });
        }

        // ---- Desktop details helpers: overview, cast, media gallery, lightbox ----
        function toggleHdrOverview(btn) {
            const p = document.getElementById('hdr-overview');
            const clamped = p.classList.toggle('line-clamp-3');
            btn.textContent = clamped ? 'Read more' : 'Show less';
        }

        function copyDetailLink() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(window.location.href)
                    .then(() => showToast('Link copied'))
                    .catch(() => showToast('Could not copy link'));
            } else {
                showToast('Could not copy link');
            }
        }

        function toggleCastAll(btn) {
            const row = document.getElementById('cast-desktop-row');
            const open = row.dataset.open === '1';
            row.dataset.open = open ? '0' : '1';
            row.className = open ? 'flex gap-4 overflow-x-auto no-scrollbar pb-2' : 'grid grid-cols-4 xl:grid-cols-5 gap-4';
            row.querySelectorAll('.cast-extra').forEach(e => e.classList.toggle('hidden', open));
            row.querySelectorAll('.cast-card').forEach(c => {
                c.classList.toggle('w-36', open);
                c.classList.toggle('w-full', !open);
            });
            btn.textContent = open ? `View all (${Math.min(parseInt(btn.dataset.total), 60)})` : 'Show less';
        }

        let currentMediaSets = {};
        let currentMediaKind = 'backdrops';
        let lightboxIndex = 0;

        function setMediaKind(kind) {
            currentMediaKind = kind;
            document.querySelectorAll('.media-kind-btn').forEach(b => {
                const on = b.id === `mkind-${kind}`;
                b.className = `media-kind-btn ${on ? 'bg-white text-black border-white font-bold' : 'bg-slate-800/80 text-slate-300 border-white/10'} px-3.5 py-1.5 rounded-xl text-xs font-semibold border whitespace-nowrap transition capitalize`;
            });
            const grid = document.getElementById('media-grid');
            if (!grid) return;
            if (kind === 'videos') {
                grid.className = 'grid grid-cols-2 xl:grid-cols-3 gap-4';
                grid.innerHTML = (currentMediaSets.videos || []).map(v => `
                    <a href="https://www.youtube.com/watch?v=${v.key}" target="_blank" rel="noopener noreferrer" class="card-solid rounded-xl overflow-hidden group block">
                        <div class="relative aspect-video bg-[#060608] overflow-hidden">
                            <img src="https://img.youtube.com/vi/${v.key}/hqdefault.jpg" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <div class="absolute inset-0 flex items-center justify-center bg-black/25 group-hover:bg-black/10 transition">
                                <span class="w-12 h-12 rounded-full bg-white/90 text-black flex items-center justify-center"><i class="fa-solid fa-play text-sm ml-0.5"></i></span>
                            </div>
                            <span class="absolute top-2 left-2 bg-black/70 text-[10px] font-bold text-amber-400 border border-white/15 px-2 py-0.5 rounded-md">${v.type}</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-100 line-clamp-2 p-2.5">${v.name}</p>
                    </a>
                `).join('');
                return;
            }
            const cfg = {
                backdrops: { cols: 'grid-cols-2 xl:grid-cols-3', ratio: 'aspect-video', fit: 'object-cover', size: 'w780' },
                posters: { cols: 'grid-cols-3 xl:grid-cols-4', ratio: 'aspect-[2/3]', fit: 'object-cover', size: 'w500' },
                logos: { cols: 'grid-cols-2 xl:grid-cols-3', ratio: 'aspect-video', fit: 'object-contain p-5', size: 'w500' }
            }[kind];
            grid.className = `grid ${cfg.cols} gap-3`;
            grid.innerHTML = (currentMediaSets[kind] || []).map((im, i) => `
                <div onclick="openLightbox(${i})" class="card-solid rounded-xl overflow-hidden cursor-pointer group ${kind === 'logos' ? 'bg-white/[0.04]' : 'bg-[#060608]'}">
                    <div class="${cfg.ratio} overflow-hidden">
                        <img src="https://image.tmdb.org/t/p/${cfg.size}${im.file_path}" class="w-full h-full ${cfg.fit} group-hover:scale-105 transition duration-500" loading="lazy">
                    </div>
                </div>
            `).join('');
        }

        function openLightbox(idx) {
            lightboxIndex = idx;
            const box = document.getElementById('media-lightbox');
            box.classList.remove('hidden');
            box.classList.add('flex');
            renderLightbox();
        }
        function renderLightbox() {
            const list = currentMediaSets[currentMediaKind] || [];
            if (!list.length) return;
            document.getElementById('lightbox-img').src = `https://image.tmdb.org/t/p/original${list[lightboxIndex].file_path}`;
            document.getElementById('lightbox-count').textContent = `${lightboxIndex + 1} / ${list.length}`;
        }
        function lightboxNav(dir) {
            const list = currentMediaSets[currentMediaKind] || [];
            if (!list.length) return;
            lightboxIndex = (lightboxIndex + dir + list.length) % list.length;
            renderLightbox();
        }
        function closeLightbox() {
            const box = document.getElementById('media-lightbox');
            box.classList.add('hidden');
            box.classList.remove('flex');
            document.getElementById('lightbox-img').src = '';
        }
        document.addEventListener('keydown', (e) => {
            const box = document.getElementById('media-lightbox');
            if (!box || box.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowRight') lightboxNav(1);
            else if (e.key === 'ArrowLeft') lightboxNav(-1);
        });

        async function openActorModal(personId) {
            const modal = document.getElementById('actor-modal');
            const content = document.getElementById('actor-modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `<div class="p-8 text-center text-indigo-300/60"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i><p class="text-xs">Loading Actor Profile...</p></div>`;

            const data = await fetchTMDB(`/person/${personId}`, '&append_to_response=combined_credits');
            if (!data) return;

            const photo = data.profile_path ? `${IMG_URL}${data.profile_path}` : 'https://via.placeholder.com/300?text=No+Photo';
            const credCast = data.combined_credits?.cast || [];
            const seenWorks = new Set();
            const crewWorks = (data.combined_credits?.crew || []).filter(w => {
                const k = `${w.media_type}_${w.id}`;
                if (seenWorks.has(k)) return false;
                seenWorks.add(k);
                return true;
            });
            const topWorks = credCast.length ? credCast.slice(0, 6) : crewWorks.slice(0, 6);

            content.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <img src="${photo}" class="w-20 h-20 rounded-full object-cover border border-indigo-500/30 shadow-lg">
                    <div>
                        <h2 class="text-base font-bold text-white">${data.name}</h2>
                        <p class="text-[11px] text-indigo-400">${data.known_for_department || 'Acting'}</p>
                        <p class="text-[10px] text-slate-400 mt-1"><i class="fa-solid fa-cake-candles mr-1"></i>${data.birthday || 'N/A'}</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Biography</h3>
                    <p class="text-xs text-slate-300 leading-relaxed max-h-32 overflow-y-auto no-scrollbar">${data.biography || 'No biography available.'}</p>
                    
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider pt-2">Known For</h3>
                    <div class="grid grid-cols-3 gap-2">
                        ${topWorks.map(w => `
                            <div onclick="closeActorModal(); openDetails('${w.media_type}', ${w.id})" class="card-solid p-1.5 rounded-xl cursor-pointer text-center">
                                <img src="${w.poster_path ? IMG_URL + w.poster_path : 'https://via.placeholder.com/150'}" class="w-full aspect-[2/3] object-cover rounded-lg mb-1">
                                <p class="text-[10px] font-semibold text-white truncate">${w.title || w.name}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function closeActorModal() {
            document.getElementById('actor-modal').classList.add('hidden');
        }

        async function loadSeasonEpisodes(tvId, seasonNumber, btnEl) {
            if (btnEl) {
                document.querySelectorAll('.season-btn').forEach(b => {
                    b.className = "season-btn bg-slate-800/80 text-slate-300 border border-white/10 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition";
                });
                btnEl.className = "season-btn bg-white text-black border border-white font-bold px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap transition";
            }

            const container = document.getElementById('episodes-container');
            container.innerHTML = `<div class="py-6 text-center text-slate-400 text-xs"><i class="fa-solid fa-circle-notch fa-spin text-lg text-white mb-1"></i><p>Loading episodes...</p></div>`;

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}`);

            if (!data || !data.episodes || data.episodes.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-4 text-xs">No episodes found.</p>`;
                return;
            }

            const epToday = new Date().toISOString().split('T')[0];
            container.className = "grid grid-cols-1 lg:grid-cols-2 gap-4 pt-2";
            container.innerHTML = data.episodes.map(ep => {
                const thumbnail = ep.still_path ? `${IMG_URL}${ep.still_path}` : 'https://via.placeholder.com/400x225?text=No+Thumbnail';
                const rating = ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A';
                const airDate = ep.air_date || 'TBA';
                const runtime = ep.runtime ? `${ep.runtime} min` : null;
                const overview = ep.overview ? ep.overview : 'No description available.';
                const isUpcomingEp = ep.air_date && ep.air_date > epToday;

                const epCastId = `ep-cast-${tvId}-${seasonNumber}-${ep.episode_number}`;

                return `
                    <div class="card-solid rounded-2xl overflow-hidden border border-white/10 flex flex-col lg:flex-row transition hover:border-white/30">
                        <!-- Thumbnail (Left Side) -->
                        <div class="relative aspect-video bg-[#060608] overflow-hidden flex-shrink-0 lg:w-56 lg:self-start">
                            <img src="${thumbnail}" class="w-full h-full object-cover" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent"></div>

                            <!-- Episode Number Badge (Top-Left) -->
                            <span class="absolute top-3 left-3 lg:top-2 lg:left-2 bg-white text-black font-black text-sm lg:text-xs px-3 lg:px-2 py-1.5 lg:py-1 rounded-lg shadow-lg">
                                ${String(ep.episode_number).padStart(2, '0')}
                            </span>

                            ${isUpcomingEp ? `<span class="flex absolute bottom-2 left-2 bg-amber-400/15 text-amber-300 border border-amber-400/40 text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm">UPCOMING</span>` : ''}

                            <!-- Rating Badge (Top-Right) -->
                            <span class="absolute top-3 right-3 lg:top-2 lg:right-2 bg-amber-400 text-black font-bold text-[11px] lg:text-[10px] px-2.5 lg:px-2 py-1 lg:py-0.5 rounded-lg flex items-center gap-1 shadow-lg">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>

                        <!-- Details (Right Side / Below on mobile) -->
                        <div class="p-4 flex-grow flex flex-col justify-between space-y-2.5">
                            <!-- Title -->
                            <h4 class="text-sm font-bold text-white line-clamp-2">${ep.name}</h4>

                            <!-- Meta Info: Date + Runtime -->
                            <div class="flex items-center gap-3 text-xs text-slate-400">
                                <span class="flex items-center gap-1">
                                    <i class="fa-regular fa-calendar text-[10px]"></i> ${airDate}
                                </span>
                                ${runtime ? `<span class="text-slate-500">•</span><span class="flex items-center gap-1"><i class="fa-regular fa-clock text-[10px]"></i> ${runtime}</span>` : ''}
                            </div>

                            <!-- Overview -->
                            <p class="text-[13px] text-slate-300 leading-relaxed line-clamp-2 flex-grow">${overview}</p>

                            <!-- Cast toggle -->
                            <button onclick="toggleEpisodeCast(${tvId}, ${seasonNumber}, ${ep.episode_number}, '${epCastId}', this)" class="ep-cast-btn self-start flex items-center gap-1.5 text-[11px] font-semibold text-slate-300 border border-white/15 rounded-lg px-2.5 py-1 hover:border-white/40 hover:text-white transition">
                                <i class="fa-solid fa-users text-[10px]"></i> Cast <i class="fa-solid fa-chevron-down text-[9px] ep-cast-chevron transition-transform"></i>
                            </button>
                            <div id="${epCastId}" class="hidden pt-1"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Fetches and toggles the cast list for a single episode inline.
        async function toggleEpisodeCast(tvId, seasonNumber, episodeNumber, containerId, btnEl) {
            const container = document.getElementById(containerId);
            const chevron = btnEl.querySelector('.ep-cast-chevron');

            if (!container.classList.contains('hidden')) {
                container.classList.add('hidden');
                chevron.classList.remove('rotate-180');
                return;
            }

            container.classList.remove('hidden');
            chevron.classList.add('rotate-180');

            if (container.dataset.loaded === 'true') return;

            container.innerHTML = `<div class="text-[11px] text-slate-400 py-1"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading cast...</div>`;

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}/episode/${episodeNumber}/credits`);
            const people = [...(data?.cast || []), ...(data?.guest_stars || [])];

            if (!people.length) {
                container.innerHTML = `<p class="text-[11px] text-slate-500 py-1">No cast info available for this episode.</p>`;
                container.dataset.loaded = 'true';
                return;
            }

            container.innerHTML = `
                <div class="flex gap-2.5 overflow-x-auto no-scrollbar py-1">
                    ${people.map(c => {
                        const photo = c.profile_path ? `${IMG_URL}${c.profile_path}` : 'https://via.placeholder.com/150?text=No+Photo';
                        return `
                            <div onclick="openActorModal(${c.id})" class="flex-none w-16 text-center flex flex-col items-center cursor-pointer">
                                <img src="${photo}" class="w-11 h-11 rounded-full object-cover border border-white/20 mb-1 shadow-md" loading="lazy">
                                <p class="text-[9px] font-semibold text-slate-100 truncate w-full">${c.name}</p>
                                <p class="text-[8px] text-slate-400 truncate w-full">${c.character || ''}</p>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
            container.dataset.loaded = 'true';
        }

        function closeModalManual() {
            window.history.back();
        }

        function closeModalDOM() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            document.title = 'MtDv';
            stopDetailBackdropRotation();

            sessionStorage.setItem('mtdv_active_tab', currentTab);
            sessionStorage.setItem('mtdv_active_category', currentCategory);

            window.history.replaceState(
                { modalOpen: false, tab: currentTab, category: currentCategory },
                '',
                currentTab === 'search' ? `${window.location.pathname}?tab=search` : window.location.pathname
            );
        }

        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="skeleton rounded-2xl aspect-[2/3] border border-indigo-500/10"></div>
            `).join('');
        }
    </script>
</body>
</html>
