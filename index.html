<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse - Ultimate Streaming Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#050505',
                            card: '#0f1015',
                            border: '#1f222e',
                            gold: '#fbbf24',
                            goldBorder: '#855316',
                            goldBg: '#1e160a',
                            navBg: '#1c1d24'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .glass-pill {
            background: rgba(28, 29, 36, 0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.8);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- 1. MAIN APP VIEW (HOME, MOVIES, TV SHOWS) -->
    <div id="app-view" class="max-w-md w-full mx-auto min-h-screen">
        
        <!-- FULL-WIDTH HERO BANNER SECTION (No Gap, Bottom Fade, Dots Right) -->
        <div id="hero-section" class="relative w-full aspect-video overflow-hidden cursor-pointer">
            <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-1000"></div>
            
            <!-- Bottom Dark Gradient Overlay Fade -->
            <div class="absolute inset-0 bg-gradient-to-t from-brand-bg via-black/30 to-transparent"></div>

            <!-- Top Header Logo Branding -->
            <div class="absolute top-4 left-4 z-20 flex items-center gap-2">
                <i class="fa-solid fa-play-circle text-amber-500 text-xl"></i>
                <span class="text-base font-extrabold text-white tracking-wide">StreamPulse</span>
            </div>
            
            <div class="absolute bottom-4 left-4 right-4 z-20 flex items-end justify-between">
                <div class="space-y-1 max-w-[70%]">
                    <span id="hero-type" class="text-[9px] font-black uppercase tracking-widest text-amber-400 bg-black/60 backdrop-blur-md px-2 py-0.5 rounded inline-block">FEATURED</span>
                    <div id="hero-title-container" class="h-8 flex items-center">
                        <h2 id="hero-title" class="text-lg font-extrabold text-white truncate drop-shadow-md">Loading...</h2>
                    </div>
                </div>

                <!-- Slider Indicator Dots (Positioned Right Side) -->
                <div id="hero-dots" class="flex items-center gap-1.5 pb-1"></div>
            </div>
        </div>

        <!-- Main Content Area with Padding -->
        <div class="px-4 pt-5 space-y-4">
            <!-- Category Title -->
            <h2 id="grid-title" class="text-xs font-black text-gray-400 uppercase tracking-wider">Trending Now</h2>

            <!-- Movie/TV Cards Grid -->
            <div id="content-grid" class="grid grid-cols-2 gap-3"></div>

            <!-- Infinite Scroll Loader -->
            <div id="infinite-loader" class="py-6 flex justify-center hidden">
                <div class="w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <!-- 2. SEPARATE DEDICATED SEARCH VIEW -->
    <div id="search-view" class="hidden max-w-md w-full mx-auto px-4 pt-5 min-h-screen space-y-5">
        <!-- Search Header -->
        <div class="flex items-center gap-3">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="dedicated-search-input" onkeyup="handleDedicatedSearch(event)" placeholder="Search movies, TV shows, actors..." 
                       class="w-full bg-brand-card border border-brand-border text-xs pl-9 pr-8 py-3 rounded-2xl outline-none focus:border-amber-500 text-white">
                <button onclick="clearSearchInput()" id="search-clear-btn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i class="fa-solid fa-circle-xmark text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Default Trending Tags (Shown before search) -->
        <div id="search-suggestions" class="space-y-2">
            <span class="text-[10px] font-black uppercase text-gray-500 tracking-wider">Popular Searches</span>
            <div class="flex flex-wrap gap-2">
                <button onclick="triggerSearchTag('Marvel')" class="bg-brand-card border border-brand-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300 hover:text-amber-400">Marvel</button>
                <button onclick="triggerSearchTag('Anime')" class="bg-brand-card border border-brand-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300 hover:text-amber-400">Anime</button>
                <button onclick="triggerSearchTag('Batman')" class="bg-brand-card border border-brand-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300 hover:text-amber-400">Batman</button>
                <button onclick="triggerSearchTag('Avengers')" class="bg-brand-card border border-brand-border px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-300 hover:text-amber-400">Avengers</button>
            </div>
        </div>

        <!-- Search Results Grid -->
        <div id="search-results-grid" class="grid grid-cols-2 gap-3"></div>
        
        <div id="search-loader" class="py-6 flex justify-center hidden">
            <div class="w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>

    <!-- 3. DETAILS VIEW -->
    <div id="details-view" class="hidden max-w-md w-full mx-auto relative min-h-screen">
        
        <!-- TOP 16:9 BACKDROP SECTION -->
        <section class="relative aspect-video w-full overflow-hidden">
            <div id="details-backdrop" class="absolute inset-0 bg-cover bg-center transition-all duration-1000"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-bg via-transparent to-transparent"></div>

            <!-- Rating Badge -->
            <div class="absolute top-4 right-4 z-10">
                <div class="bg-black/60 backdrop-blur-md border border-amber-500/30 text-amber-400 font-extrabold text-xs px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-star text-[11px] text-amber-400"></i>
                    <span id="rating-val">0.0</span>
                </div>
            </div>

            <!-- Title Overlay (Logo OR Text) & Original Name -->
            <div class="absolute bottom-3 left-4 right-4 z-10 space-y-1">
                <div class="flex items-center gap-2">
                    <span id="media-type" class="text-[10px] font-black uppercase tracking-widest text-amber-400">MOVIE</span>
                    <span id="original-title-badge" class="text-[10px] font-medium text-gray-300 bg-black/50 backdrop-blur-md px-2 py-0.5 rounded truncate max-w-[200px]"></span>
                </div>
                <div id="details-title-container" class="min-h-[40px] flex items-center">
                    <h1 id="media-title" class="text-2xl font-black text-white leading-tight drop-shadow-md">Loading...</h1>
                </div>
            </div>
        </section>

        <!-- GENRE CHIPS -->
        <section class="px-4 py-2">
            <div id="genre-container" class="flex items-center gap-2 overflow-x-auto hide-scrollbar"></div>
        </section>

        <!-- METADATA CARDS GRID -->
        <section class="px-4 py-3 grid grid-cols-2 gap-2.5">
            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">RELEASE</span>
                <span id="meta-release" class="text-xs font-extrabold text-white block">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span id="meta-runtime-label" class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">RUNTIME</span>
                <span id="meta-runtime" class="text-xs font-extrabold text-white block">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">DIRECTOR / CREATOR</span>
                <span id="meta-director" class="text-xs font-extrabold text-white block truncate">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">AVAILABLE ON</span>
                <div id="meta-ott" class="flex items-center gap-1.5 pt-0.5 min-h-[20px]">
                    <span class="text-xs font-extrabold text-gray-400">Loading...</span>
                </div>
            </div>
        </section>

        <!-- NAVIGATION TABS -->
        <section class="px-4 pt-2">
            <div class="flex items-center gap-6 border-b border-brand-border/60 text-xs font-bold pb-2">
                <button onclick="switchTab('overview')" id="tab-overview-btn" class="text-white relative pb-2 transition">
                    Overview
                    <span id="tab-indicator" class="absolute bottom-0 left-0 right-0 h-0.5 bg-amber-500 rounded-full"></span>
                </button>
                <button onclick="switchTab('cast')" id="tab-cast-btn" class="text-gray-400 hover:text-white transition pb-2">
                    Cast
                </button>
                <button onclick="switchTab('media')" id="tab-media-btn" class="text-gray-400 hover:text-white transition pb-2">
                    Media
                </button>
            </div>
        </section>

        <!-- TAB CONTENT AREAS -->
        <section class="px-4 py-4 space-y-4">
            
            <!-- OVERVIEW TAB -->
            <div id="tab-overview" class="space-y-4">
                <div class="bg-brand-card/90 border border-brand-border/80 p-4 rounded-3xl space-y-2">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">OVERVIEW</h3>
                    <p id="overview-text" class="text-xs text-gray-300 leading-relaxed font-normal"></p>
                </div>

                <!-- BUDGET & REVENUE SECTION -->
                <div class="bg-brand-card/90 border border-brand-border/80 p-4 rounded-3xl space-y-3">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">FINANCIALS</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-brand-bg/60 p-3 rounded-2xl border border-brand-border">
                            <span class="text-[9px] font-bold text-gray-500 uppercase block">BUDGET</span>
                            <span id="financial-budget" class="text-xs font-extrabold text-amber-400 block mt-0.5">N/A</span>
                        </div>
                        <div class="bg-brand-bg/60 p-3 rounded-2xl border border-brand-border">
                            <span class="text-[9px] font-bold text-gray-500 uppercase block">BOX OFFICE / REVENUE</span>
                            <span id="financial-revenue" class="text-xs font-extrabold text-green-400 block mt-0.5">N/A</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CAST TAB (Modern Big Cards UI + Season Selector) -->
            <div id="tab-cast" class="hidden space-y-4">
                <!-- TV Season Selector Dropdown Container -->
                <div id="tv-season-selector-container" class="hidden space-y-2">
                    <label class="text-[10px] font-extrabold text-amber-400 uppercase tracking-wider">Select Season Cast:</label>
                    <select id="season-select" onchange="handleSeasonCastChange(this.value)" 
                            class="w-full bg-brand-card border border-brand-border text-xs px-3 py-2.5 rounded-xl text-white outline-none focus:border-amber-500">
                    </select>
                </div>

                <div id="cast-loader" class="py-4 text-center hidden">
                    <div class="w-5 h-5 border-2 border-amber-500 border-t-transparent rounded-full animate-spin inline-block"></div>
                </div>

                <!-- Big Modern Cast Grid -->
                <div id="cast-grid" class="grid grid-cols-2 gap-3.5"></div>
            </div>

            <!-- MEDIA TAB (With 3 Sub-Tabs: Backdrops, Posters, Logos) -->
            <div id="tab-media" class="hidden space-y-4">
                <!-- Sub Navigation Buttons -->
                <div class="flex items-center gap-2 bg-brand-card p-1 rounded-2xl border border-brand-border">
                    <button onclick="switchMediaSubTab('backdrops')" id="subtab-backdrops-btn" class="flex-1 py-1.5 rounded-xl text-xs font-extrabold bg-white/10 text-white transition">Backdrops</button>
                    <button onclick="switchMediaSubTab('posters')" id="subtab-posters-btn" class="flex-1 py-1.5 rounded-xl text-xs font-extrabold text-gray-400 hover:text-white transition">Posters</button>
                    <button onclick="switchMediaSubTab('logos')" id="subtab-logos-btn" class="flex-1 py-1.5 rounded-xl text-xs font-extrabold text-gray-400 hover:text-white transition">Logos</button>
                </div>

                <!-- Sub Tab Display Containers -->
                <div id="media-backdrops-container" class="space-y-3">
                    <div id="media-backdrops-grid" class="grid grid-cols-1 gap-3"></div>
                </div>

                <div id="media-posters-container" class="hidden space-y-3">
                    <div id="media-posters-grid" class="grid grid-cols-2 gap-3"></div>
                </div>

                <div id="media-logos-container" class="hidden space-y-3">
                    <div id="media-logos-grid" class="grid grid-cols-2 gap-3"></div>
                </div>
            </div>

        </section>
    </div>

    <!-- FLOATING PILL BOTTOM NAVIGATION -->
    <div class="fixed bottom-4 left-0 right-0 z-50 flex justify-center px-4">
        <div class="glass-pill rounded-full p-1.5 flex items-center justify-between w-full max-w-xs transition-all duration-300">
            <button onclick="navigateToTab('home')" id="nav-home" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-white bg-white/10 transition">
                <i class="fa-solid fa-house text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Home</span>
            </button>

            <button onclick="navigateToTab('movie')" id="nav-movie" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-clapperboard text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Movies</span>
            </button>

            <button onclick="navigateToTab('tv')" id="nav-tv" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-tv text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">TV Shows</span>
            </button>

            <button onclick="navigateToTab('search')" id="nav-search" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Search</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        const TMDB_API_KEY = '0d516ae53b334d92b86cfc7c958d192f';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const ORIGINAL_IMG = 'https://image.tmdb.org/t/p/original';

        let currentTab = 'home';
        let currentPage = 1;
        let isLoading = false;
        let hasMorePages = true;
        let currentDetailsId = null;
        let currentDetailsType = 'movie';

        const loadedMediaIds = new Set();

        let heroSliderInterval = null;
        let detailsSliderInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            handleHashChange();
            setupInfiniteScroll();
        });

        window.addEventListener('hashchange', handleHashChange);

        function handleHashChange() {
            clearInterval(detailsSliderInterval);

            const hash = window.location.hash.replace('#', '');
            
            if (hash.startsWith('details?')) {
                const params = new URLSearchParams(hash.split('?')[1]);
                const id = params.get('id');
                const type = params.get('type') || 'movie';
                if (id) renderDetailsPage(id, type);
            } else if (hash === 'search') {
                openSearchView();
            } else {
                const targetTab = ['home', 'movie', 'tv'].includes(hash) ? hash : 'home';
                switchMainTab(targetTab);
            }
        }

        function navigateToTab(tab) {
            window.location.hash = tab;
        }

        function updateNavState(activeNav) {
            ['home', 'movie', 'tv', 'search'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === activeNav) {
                    btn.className = "flex-1 py-2 rounded-full flex flex-col items-center justify-center text-white bg-white/10 transition";
                } else {
                    btn.className = "flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition";
                }
            });
        }

        function switchMainTab(tab) {
            currentTab = tab;
            currentPage = 1;
            hasMorePages = true;
            loadedMediaIds.clear();

            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');

            updateNavState(tab);

            const title = document.getElementById('grid-title');
            document.getElementById('content-grid').innerHTML = '';

            if (tab === 'movie') title.textContent = "Popular Movies";
            else if (tab === 'tv') title.textContent = "Popular TV Shows";
            else title.textContent = "Trending Now";

            fetchHeroContent();
            fetchGridContent();
        }

        // DEDICATED SEARCH PAGE VIEW
        function openSearchView() {
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('search-view').classList.remove('hidden');

            updateNavState('search');
            window.scrollTo(0, 0);

            const input = document.getElementById('dedicated-search-input');
            input.focus();
        }

        function clearSearchInput() {
            const input = document.getElementById('dedicated-search-input');
            input.value = '';
            document.getElementById('search-clear-btn').classList.add('hidden');
            document.getElementById('search-results-grid').innerHTML = '';
            document.getElementById('search-suggestions').classList.remove('hidden');
        }

        function triggerSearchTag(tag) {
            const input = document.getElementById('dedicated-search-input');
            input.value = tag;
            handleDedicatedSearch({ target: input });
        }

        async function handleDedicatedSearch(e) {
            const query = e.target.value.trim();
            const clearBtn = document.getElementById('search-clear-btn');
            const suggestions = document.getElementById('search-suggestions');
            const grid = document.getElementById('search-results-grid');
            const loader = document.getElementById('search-loader');

            if (query.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');

            if (query.length < 2) {
                suggestions.classList.remove('hidden');
                grid.innerHTML = '';
                return;
            }

            suggestions.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                grid.innerHTML = '';

                const items = (data.results || []).filter(item => item.poster_path || item.backdrop_path);
                
                if (items.length === 0) {
                    grid.innerHTML = `<p class="text-xs text-gray-500 col-span-2 text-center py-8">No results found for "${query}"</p>`;
                    return;
                }

                items.forEach(item => {
                    const type = item.media_type || 'movie';
                    if (type !== 'movie' && type !== 'tv') return;

                    const card = document.createElement('div');
                    card.className = "bg-brand-card border border-brand-border rounded-2xl overflow-hidden cursor-pointer group";
                    card.onclick = () => {
                        window.location.hash = `details?id=${item.id}&type=${type}`;
                    };

                    card.innerHTML = `
                        <div class="relative aspect-[2/3] bg-brand-bg">
                            <img src="${IMG_URL}${item.poster_path || item.backdrop_path}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                            <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-400 border border-amber-500/20">
                                ★ ${item.vote_average?.toFixed(1) || 'N/A'}
                            </div>
                        </div>
                        <div class="p-2.5">
                            <h4 class="text-xs font-bold text-white truncate">${item.title || item.name}</h4>
                            <p class="text-[10px] text-gray-500 mt-0.5 uppercase">${type}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            } finally {
                loader.classList.add('hidden');
            }
        }

        // HERO BANNER WITH FILTERING & DOTS ON RIGHT
        async function fetchHeroContent() {
            try {
                let endpoint = 'trending/all/day';
                if (currentTab === 'movie') endpoint = 'trending/movie/day';
                else if (currentTab === 'tv') endpoint = 'trending/tv/day';

                const res = await fetch(`${BASE_URL}/${endpoint}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const heroItems = (data.results || []).filter(item => item.backdrop_path).slice(0, 5);

                if (heroItems.length === 0) return;

                let currentIndex = 0;

                // Render Dots Right Side
                const dotsContainer = document.getElementById('hero-dots');
                dotsContainer.innerHTML = heroItems.map((_, i) => `
                    <div id="hero-dot-${i}" class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${i === 0 ? 'bg-amber-400 w-4' : 'bg-white/40'}"></div>
                `).join('');

                const updateHero = async (index) => {
                    const item = heroItems[index];
                    const type = item.media_type || (currentTab === 'tv' ? 'tv' : 'movie');

                    document.getElementById('hero-bg').style.backgroundImage = `url('${ORIGINAL_IMG}${item.backdrop_path}')`;
                    document.getElementById('hero-type').textContent = type.toUpperCase();
                    
                    document.getElementById('hero-section').onclick = () => {
                        window.location.hash = `details?id=${item.id}&type=${type}`;
                    };

                    // Update Dots
                    heroItems.forEach((_, i) => {
                        const dot = document.getElementById(`hero-dot-${i}`);
                        if (dot) {
                            dot.className = `w-1.5 h-1.5 rounded-full transition-all duration-300 ${i === index ? 'bg-amber-400 w-4' : 'bg-white/40'}`;
                        }
                    });

                    // Official Logo Fetch
                    const container = document.getElementById('hero-title-container');
                    try {
                        const imgRes = await fetch(`${BASE_URL}/${type}/${item.id}/images?api_key=${TMDB_API_KEY}&include_image_language=en,null`);
                        const imgData = await imgRes.json();
                        const logo = imgData.logos?.[0]?.file_path;

                        if (logo) {
                            container.innerHTML = `<img src="${IMG_URL}${logo}" class="max-h-8 max-w-[80%] object-contain drop-shadow-lg">`;
                        } else {
                            container.innerHTML = `<h2 class="text-lg font-extrabold text-white truncate drop-shadow-md">${item.title || item.name}</h2>`;
                        }
                    } catch {
                        container.innerHTML = `<h2 class="text-lg font-extrabold text-white truncate drop-shadow-md">${item.title || item.name}</h2>`;
                    }
                };

                updateHero(0);

                clearInterval(heroSliderInterval);
                heroSliderInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % heroItems.length;
                    updateHero(currentIndex);
                }, 3500);

            } catch (e) {
                console.error("Hero fetch error:", e);
            }
        }

        // GRID CONTENT
        async function fetchGridContent() {
            if (isLoading || !hasMorePages) return;
            isLoading = true;

            const loader = document.getElementById('infinite-loader');
            loader.classList.remove('hidden');

            let endpoint = '';
            if (currentTab === 'movie') endpoint = `movie/popular?page=${currentPage}`;
            else if (currentTab === 'tv') endpoint = `tv/popular?page=${currentPage}`;
            else endpoint = `trending/all/day?page=${currentPage}`;

            try {
                const res = await fetch(`${BASE_URL}/${endpoint}&api_key=${TMDB_API_KEY}`);
                const data = await res.json();

                if (currentPage >= data.total_pages) hasMorePages = false;

                renderGridItems(data.results || []);
                currentPage++;
            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
                loader.classList.add('hidden');
            }
        }

        function renderGridItems(items) {
            const grid = document.getElementById('content-grid');

            items.forEach(item => {
                if (!item.backdrop_path && !item.poster_path) return;
                
                if (loadedMediaIds.has(item.id)) return;
                loadedMediaIds.add(item.id);

                const type = item.media_type || (currentTab === 'tv' ? 'tv' : 'movie');
                const card = document.createElement('div');
                card.className = "bg-brand-card border border-brand-border rounded-2xl overflow-hidden cursor-pointer group";
                card.onclick = () => {
                    window.location.hash = `details?id=${item.id}&type=${type}`;
                };

                card.innerHTML = `
                    <div class="relative aspect-[2/3] bg-brand-bg">
                        <img src="${IMG_URL}${item.poster_path || item.backdrop_path}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-400 border border-amber-500/20">
                            ★ ${item.vote_average?.toFixed(1) || 'N/A'}
                        </div>
                    </div>
                    <div class="p-2.5">
                        <h4 class="text-xs font-bold text-white truncate">${item.title || item.name}</h4>
                        <p class="text-[10px] text-gray-500 mt-0.5 uppercase">${type}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (document.getElementById('app-view').classList.contains('hidden')) return;
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    fetchGridContent();
                }
            });
        }

        // DETAILS PAGE
        async function renderDetailsPage(id, type = 'movie') {
            currentDetailsId = id;
            currentDetailsType = type;

            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('search-view').classList.add('hidden');
            document.getElementById('details-view').classList.remove('hidden');

            // CRITICAL RESET FIX: Reset tab back to 'Overview' every time a new item is loaded
            switchTab('overview');
            window.scrollTo(0, 0);

            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits,images,watch/providers&include_image_language=en,null`);
                const data = await res.json();

                document.getElementById('media-type').textContent = type.toUpperCase();
                document.getElementById('rating-val').textContent = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
                document.getElementById('overview-text').textContent = data.overview || 'No overview available.';

                // ORIGINAL TITLE
                const origTitle = data.original_title || data.original_name;
                const origBadge = document.getElementById('original-title-badge');
                if (origTitle && origTitle !== (data.title || data.name)) {
                    origBadge.textContent = `Original: ${origTitle}`;
                    origBadge.classList.remove('hidden');
                } else {
                    origBadge.classList.add('hidden');
                }

                // LOGO OR TITLE
                const titleContainer = document.getElementById('details-title-container');
                const logo = data.images?.logos?.[0]?.file_path;
                if (logo) {
                    titleContainer.innerHTML = `<img src="${IMG_URL}${logo}" class="max-h-12 max-w-[80%] object-contain drop-shadow-xl">`;
                } else {
                    titleContainer.innerHTML = `<h1 id="media-title" class="text-2xl font-black text-white leading-tight drop-shadow-md">${data.title || data.name}</h1>`;
                }

                // BACKDROP SLIDER
                const backdrops = data.images?.backdrops || [];
                const bgElement = document.getElementById('details-backdrop');

                if (backdrops.length > 0) {
                    let backdropIdx = 0;
                    bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${backdrops[0].file_path}')`;

                    clearInterval(detailsSliderInterval);
                    if (backdrops.length > 1) {
                        detailsSliderInterval = setInterval(() => {
                            backdropIdx = (backdropIdx + 1) % Math.min(backdrops.length, 5);
                            bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${backdrops[backdropIdx].file_path}')`;
                        }, 3000);
                    }
                } else if (data.backdrop_path) {
                    bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${data.backdrop_path}')`;
                }

                // METADATA
                document.getElementById('meta-release').textContent = data.release_date || data.first_air_date || 'N/A';

                const runtimeLabel = document.getElementById('meta-runtime-label');
                const runtimeVal = document.getElementById('meta-runtime');

                if (type === 'tv') {
                    runtimeLabel.textContent = "SEASONS & EPISODES";
                    const seasons = data.number_of_seasons || 0;
                    const episodes = data.number_of_episodes || 0;
                    runtimeVal.textContent = seasons > 0 ? `${seasons} Season${seasons > 1 ? 's' : ''} • ${episodes} Ep` : 'N/A';
                } else {
                    runtimeLabel.textContent = "RUNTIME";
                    runtimeVal.textContent = data.runtime ? `${data.runtime} min` : 'N/A';
                }

                // DIRECTOR / CREATOR
                const directorElement = document.getElementById('meta-director');
                if (type === 'movie') {
                    const director = data.credits?.crew?.find(c => c.job === 'Director');
                    directorElement.textContent = director ? director.name : 'N/A';
                } else {
                    const creators = data.created_by?.map(c => c.name).join(', ');
                    directorElement.textContent = creators || 'N/A';
                }

                // OTT WATCH PROVIDERS
                const ottContainer = document.getElementById('meta-ott');
                const providersData = data['watch/providers']?.results;
                const regionData = providersData?.IN || providersData?.US;
                const flatrate = regionData?.flatrate || regionData?.buy || [];

                if (flatrate.length > 0) {
                    ottContainer.innerHTML = flatrate.slice(0, 3).map(p => `
                        <img src="${IMG_URL}${p.logo_path}" title="${p.provider_name}" class="w-5 h-5 rounded-md object-cover border border-white/10 shadow">
                    `).join('');
                } else {
                    ottContainer.innerHTML = `<span class="text-xs font-bold text-gray-400">N/A</span>`;
                }

                // BUDGET & REVENUE
                const formatUSD = (val) => val && val > 0 ? `$${val.toLocaleString()}` : 'N/A';
                document.getElementById('financial-budget').textContent = formatUSD(data.budget);
                document.getElementById('financial-revenue').textContent = formatUSD(data.revenue);

                // GENRES
                const genreContainer = document.getElementById('genre-container');
                genreContainer.innerHTML = (data.genres || []).map(g => `
                    <span class="bg-brand-goldBg border border-brand-goldBorder/60 text-amber-400 text-xs font-semibold px-3.5 py-1.5 rounded-xl flex-shrink-0">${g.name}</span>
                `).join('');

                // SETUP CAST TAB
                setupCastTab(data);

                // SETUP MEDIA TAB SUB-GALLERIES (ALL AVAILABLE IMAGES)
                setupMediaTab(data.images);

            } catch (e) {
                console.error(e);
            }
        }

        // CAST ENGINE (MOVIE = ALL CAST, TV = SEASON SELECTOR)
        function setupCastTab(data) {
            const seasonContainer = document.getElementById('tv-season-selector-container');

            if (currentDetailsType === 'tv' && data.seasons?.length > 0) {
                seasonContainer.classList.remove('hidden');
                const select = document.getElementById('season-select');
                
                select.innerHTML = data.seasons
                    .filter(s => s.season_number > 0)
                    .map(s => `<option value="${s.season_number}">${s.name} (${s.episode_count} Episodes)</option>`).join('');

                if (data.seasons.find(s => s.season_number === 1)) {
                    select.value = 1;
                    fetchSeasonCast(1);
                } else if (data.seasons[0]) {
                    select.value = data.seasons[0].season_number;
                    fetchSeasonCast(data.seasons[0].season_number);
                }
            } else {
                seasonContainer.classList.add('hidden');
                renderCastCards(data.credits?.cast || []);
            }
        }

        async function handleSeasonCastChange(seasonNum) {
            fetchSeasonCast(seasonNum);
        }

        async function fetchSeasonCast(seasonNum) {
            const loader = document.getElementById('cast-loader');
            const castGrid = document.getElementById('cast-grid');
            castGrid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${BASE_URL}/tv/${currentDetailsId}/season/${seasonNum}?api_key=${TMDB_API_KEY}&append_to_response=credits`);
                const data = await res.json();
                renderCastCards(data.credits?.cast || []);
            } catch (e) {
                console.error(e);
            } finally {
                loader.classList.add('hidden');
            }
        }

        // MODERN BIG CAST CARD UI
        function renderCastCards(castList) {
            const castGrid = document.getElementById('cast-grid');
            if (!castList || castList.length === 0) {
                castGrid.innerHTML = `<p class="text-xs text-gray-500 col-span-2">No cast information available.</p>`;
                return;
            }

            castGrid.innerHTML = castList.map(c => `
                <div class="bg-brand-card border border-brand-border rounded-2xl overflow-hidden shadow-lg flex flex-col">
                    <div class="relative aspect-[3/4] bg-brand-bg w-full">
                        <img src="${c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/300x400?text=No+Photo'}" 
                             class="w-full h-full object-cover object-top" loading="lazy">
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between space-y-1">
                        <div>
                            <h4 class="text-xs font-extrabold text-white leading-tight">${c.name}</h4>
                            <p class="text-[10px] text-amber-400 font-medium mt-0.5">${c.character || 'Actor'}</p>
                        </div>
                        ${c.original_name && c.original_name !== c.name ? `<p class="text-[9px] text-gray-500 truncate">Real: ${c.original_name}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // MEDIA SUB-TAB ENGINE
        function setupMediaTab(imagesObj) {
            const backdrops = imagesObj?.backdrops || [];
            const posters = imagesObj?.posters || [];
            const logos = imagesObj?.logos || [];

            // Backdrops
            document.getElementById('media-backdrops-grid').innerHTML = backdrops.length > 0 ? backdrops.map(img => `
                <div class="aspect-video bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
                    <img src="${ORIGINAL_IMG}${img.file_path}" class="w-full h-full object-cover" loading="lazy">
                </div>
            `).join('') : `<p class="text-xs text-gray-500 text-center py-4">No backdrops available.</p>`;

            // Posters
            document.getElementById('media-posters-grid').innerHTML = posters.length > 0 ? posters.map(img => `
                <div class="aspect-[2/3] bg-brand-card border border-brand-border rounded-2xl overflow-hidden">
                    <img src="${IMG_URL}${img.file_path}" class="w-full h-full object-cover" loading="lazy">
                </div>
            `).join('') : `<p class="text-xs text-gray-500 text-center py-4 col-span-2">No posters available.</p>`;

            // Logos
            document.getElementById('media-logos-grid').innerHTML = logos.length > 0 ? logos.map(img => `
                <div class="aspect-video bg-brand-card border border-brand-border rounded-2xl p-4 flex items-center justify-center">
                    <img src="${IMG_URL}${img.file_path}" class="max-h-full max-w-full object-contain" loading="lazy">
                </div>
            `).join('') : `<p class="text-xs text-gray-500 text-center py-4 col-span-2">No logos available.</p>`;

            // Default to Backdrops subtab
            switchMediaSubTab('backdrops');
        }

        function switchMediaSubTab(subTab) {
            ['backdrops', 'posters', 'logos'].forEach(st => {
                const btn = document.getElementById(`subtab-${st}-btn`);
                const container = document.getElementById(`media-${st}-container`);
                if (st === subTab) {
                    btn.className = "flex-1 py-1.5 rounded-xl text-xs font-extrabold bg-white/10 text-white transition";
                    container.classList.remove('hidden');
                } else {
                    btn.className = "flex-1 py-1.5 rounded-xl text-xs font-extrabold text-gray-400 hover:text-white transition";
                    container.classList.add('hidden');
                }
            });
        }

        function switchTab(tab) {
            ['overview', 'cast', 'media'].forEach(t => {
                const btn = document.getElementById(`tab-${t}-btn`);
                const content = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "text-white relative pb-2 transition font-bold";
                    content.classList.remove('hidden');
                } else {
                    btn.className = "text-gray-400 hover:text-white transition pb-2";
                    content.classList.add('hidden');
                }
            });

            const activeBtn = document.getElementById(`tab-${tab}-btn`);
            const indicator = document.getElementById('tab-indicator');
            if (activeBtn && indicator) {
                activeBtn.appendChild(indicator);
            }
        }
    </script>
</body>
</html>
