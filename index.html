<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie & TV Show App</title>
  <style>
    :root {
      --bg-color: #0d0f12;
      --card-bg: #161920;
      --accent-color: #e5a00d;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 70px;
    }

    /* --- HERO SECTION --- */
    .hero-container {
      position: relative;
      width: 100%;
      height: 56.25vw; /* 16:9 Aspect Ratio */
      max-height: 500px;
      overflow: hidden;
      background-color: #000;
    }

    .hero-backdrop {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.5s ease-in-out;
    }

    /* Bottom Fade Overlay */
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(13,15,18,0.8) 80%, rgba(13,15,18,1) 100%);
      pointer-events: none;
      z-index: 2;
    }

    .hero-content {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      z-index: 3;
    }

    .hero-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin: 0 0 10px 0;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* White Dots styling over the fade overlay */
    .hero-dots {
      position: absolute;
      bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 8px;
      z-index: 10; /* Fixed: Placed above overlay */
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffffff; /* Fixed: White color */
      opacity: 0.4;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .dot.active {
      opacity: 1;
      transform: scale(1.2);
    }

    /* --- PERSON DETAILS PAGE --- */
    .person-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      margin: 16px;
    }

    .person-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .info-box:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .info-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.95rem;
      font-weight: bold;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .badge {
      background: var(--accent-color);
      color: #000;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 8px;
    }

    /* --- MEDIA DETAIL & TAB BAR --- */
    .tab-menu {
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 10px 16px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
    }

    /* Credits Container */
    .credits-container {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 12px;
    }

    .credit-card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.8rem;
    }

    .credit-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
    }

    .credit-title {
      padding: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- 1. HERO SECTION -->
  <div class="hero-container" id="heroContainer">
    <img id="heroBackdrop" class="hero-backdrop" src="" alt="Hero Backdrop">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h2 id="heroTitle" class="hero-title">Loading...</h2>
    </div>
    <!-- White Dots Indicator -->
    <div class="hero-dots" id="heroDots"></div>
  </div>

  <!-- 2. PERSON DETAILS SECTION -->
  <div class="person-card">
    <div class="person-grid">
      <div class="info-box">
        <div class="info-label">AGE</div>
        <div class="info-value" id="personAge">--</div>
      </div>
      <div class="info-box">
        <div class="info-label">BIRTH DATE</div>
        <div class="info-value" id="personBirth">--</div>
      </div>

      <!-- Updated Buttons replacing SPOUSE and FIRST KNOWN WORK -->
      <div class="info-box" onclick="loadPersonCredits('movie')">
        <div class="info-label">CREDITS</div>
        <div class="info-value">
          MOVIES <span class="badge" id="movieCount">0</span>
        </div>
      </div>
      <div class="info-box" onclick="loadPersonCredits('tv')">
        <div class="info-label">CREDITS</div>
        <div class="info-value">
          TV SHOWS <span class="badge" id="tvCount">0</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Credits Display Area -->
  <div id="creditsList" class="credits-container"></div>

  <!-- 3. MEDIA DETAILS SECTION (For Movie/TV Details Page) -->
  <div class="tab-menu" id="mediaTabs">
    <button class="tab-btn active" onclick="switchMediaTab('overview')">Overview</button>
    <button class="tab-btn" onclick="switchMediaTab('cast')">Cast</button>
    <!-- Seasons tab will be hidden automatically if media is a Movie -->
    <button class="tab-btn" id="seasonsTab" onclick="switchMediaTab('seasons')">Seasons</button>
  </div>

  <script>
    const API_KEY = 'YOUR_TMDB_API_KEY'; // App ki TMDB API Key add karein
    const BASE_IMAGE_URL = 'https://image.tmdb.org/tpa/t/p/original/';
    
    let currentHeroIndex = 0;
    let heroItems = [];
    let currentPersonCredits = { movie: [], tv: [] };

    // --- 1. HERO SECTION (16:9 Backdrop Image Reload & White Dots) ---
    async function initHeroSection() {
      // Example data array - Real app me TMDb API `/trending/all/day` response se populate karein
      heroItems = [
        {
          title: "Avengers: Endgame",
          backdrop: "https://image.tmdb.org/t/p/original/or2at9pA2pC6BfXst9A.jpg"
        },
        {
          title: "Stranger Things",
          backdrop: "https://image.tmdb.org/t/p/original/562233e.jpg"
        },
        {
          title: "The Dark Knight",
          backdrop: "https://image.tmdb.org/t/p/original/nMK48223.jpg"
        }
      ];

      renderHeroDots();
      updateHeroSlide(0);

      // Auto cycle hero section
      setInterval(() => {
        currentHeroIndex = (currentHeroIndex + 1) % heroItems.length;
        updateHeroSlide(currentHeroIndex);
      }, 5000);
    }

    function renderHeroDots() {
      const dotsContainer = document.getElementById('heroDots');
      dotsContainer.innerHTML = '';
      heroItems.forEach((_, index) => {
        const dot = document.createElement('div');
        dot.className = `dot ${index === 0 ? 'active' : ''}`;
        dot.onclick = () => {
          currentHeroIndex = index;
          updateHeroSlide(index);
        };
        dotsContainer.appendChild(dot);
      });
    }

    function updateHeroSlide(index) {
      const item = heroItems[index];
      if (!item) return;

      const imgElement = document.getElementById('heroBackdrop');
      const titleElement = document.getElementById('heroTitle');

      // Refresh image load (Everytime 16:9 high quality image)
      imgElement.style.opacity = '0.3';
      setTimeout(() => {
        imgElement.src = item.backdrop;
        titleElement.textContent = item.title;
        imgElement.style.opacity = '1';
      }, 200);

      // Update dots
      const dots = document.querySelectorAll('.hero-dots .dot');
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    // --- 2. PERSON DETAILS & CREDITS (Movies / TV Shows Clickable) ---
    function setupPersonPage(personData) {
      document.getElementById('personAge').textContent = personData.age || 'N/A';
      document.getElementById('personBirth').textContent = personData.birthday || 'N/A';

      // Example credit data
      currentPersonCredits.movie = personData.movie_credits || [];
      currentPersonCredits.tv = personData.tv_credits || [];

      document.getElementById('movieCount').textContent = currentPersonCredits.movie.length;
      document.getElementById('tvCount').textContent = currentPersonCredits.tv.length;

      // Default load movies
      loadPersonCredits('movie');
    }

    function loadPersonCredits(type) {
      const container = document.getElementById('creditsList');
      container.innerHTML = '';
      const list = type === 'movie' ? currentPersonCredits.movie : currentPersonCredits.tv;

      list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'credit-card';
        card.innerHTML = `
          <img src="${item.poster_path ? BASE_IMAGE_URL + item.poster_path : 'https://via.placeholder.com/100x140'}" alt="poster">
          <div class="credit-title">${item.title || item.name}</div>
        `;
        container.appendChild(card);
      });
    }

    // --- 3. MEDIA DETAILS FIX (Hide Seasons Menu on Movies) ---
    function renderDetailsPage(mediaType) {
      const seasonsTab = document.getElementById('seasonsTab');

      // Bug Fix: Hide Season menu permanently for Movie items
      if (mediaType === 'movie') {
        seasonsTab.style.display = 'none';
      } else {
        seasonsTab.style.display = 'inline-block';
      }
    }

    function switchMediaTab(tabName) {
      const tabs = document.querySelectorAll('.tab-btn');
      tabs.forEach(tab => tab.classList.remove('active'));
      event.target.classList.add('active');
    }

    // App Initialization
    window.onload = () => {
      initHeroSection();
      
      // Demo initialization data for person page
      setupPersonPage({
        age: "58 Years",
        birthday: "1967-11-22",
        movie_credits: [{ title: "The Avengers", poster_path: "" }, { title: "Spotlight", poster_path: "" }],
        tv_credits: [{ name: "I Know This Much Is True", poster_path: "" }]
      });

      // Demo: Set page to Movie details to verify seasons menu hiding
      renderDetailsPage('movie');
    };
  </script>
</body>
</html>
