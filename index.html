
<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineStream - Movies & TV Shows</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar hide for horizontal filters */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-20 select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/60 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2" onclick="loadTrending()">
            <i class="fa-solid fa-play text-red-600 text-xl"></i>
            <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-red-500 to-amber-500 bg-clip-text text-transparent cursor-pointer">CineStream</span>
        </div>
        <button onclick="switchTab('search')" class="p-2 rounded-full hover:bg-slate-800 text-slate-300">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
        </button>
    </header>

    <!-- Main Content Container -->
    <main class="p-4 max-w-7xl mx-auto">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-6">
            <!-- OTT Filter Chips -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                <button onclick="loadTrending()" class="ott-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-red-600 text-white whitespace-nowrap transition-all">Trending</button>
                <button onclick="loadByOTT(8)" class="ott-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 whitespace-nowrap transition-all">Netflix</button>
                <button onclick="loadByOTT(119)" class="ott-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 whitespace-nowrap transition-all">Prime Video</button>
                <button onclick="loadByOTT(122)" class="ott-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 whitespace-nowrap transition-all">Disney+ Hotstar</button>
                <button onclick="loadByOTT(237)" class="ott-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 whitespace-nowrap transition-all">SonyLIV</button>
            </div>

            <!-- Title Header -->
            <div class="flex justify-between items-center">
                <h2 id="section-title" class="text-lg font-bold text-slate-200">Trending Today</h2>
            </div>

            <!-- Media Cards Grid -->
            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                <!-- Dynamic Content Load -->
            </div>
        </section>

        <!-- SEARCH TAB -->
        <section id="tab-search" class="hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search Movies, TV Shows, Actors..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-200 focus:outline-none focus:border-red-500">
            </div>
            <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                <p class="col-span-full text-center text-slate-500 py-10 text-sm">Type something to search...</p>
            </div>
        </section>

        <!-- UPCOMING TAB -->
        <section id="tab-upcoming" class="hidden space-y-4">
            <h2 class="text-lg font-bold text-slate-200">Upcoming Movies in Theaters & OTT</h2>
            <div id="upcoming-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
                <!-- Dynamic Upcoming Content -->
            </div>
        </section>

    </main>

    <!-- Details View Modal -->
    <div id="details-modal" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md hidden overflow-y-auto">
        <button onclick="closeModal()" class="fixed top-4 right-4 z-50 bg-slate-900/80 border border-slate-700 text-white w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content" class="max-w-2xl mx-auto pb-10">
            <!-- Dynamic Details Content -->
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-lg border-t border-slate-800/80 px-6 py-2 flex justify-around items-center">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-red-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium">Home</span>
        </button>
        <button onclick="switchTab('search')" id="nav-search" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-compass text-lg"></i>
            <span class="text-[10px] font-medium">Explore</span>
        </button>
        <button onclick="switchTab('upcoming')" id="nav-upcoming" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-calendar-days text-lg"></i>
            <span class="text-[10px] font-medium">Upcoming</span>
        </button>
    </nav>

    <!-- Application Script -->
    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let searchTimeout = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadTrending();
        });

        // Tab Switcher
        function switchTab(tabName) {
            ['home', 'search', 'upcoming'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.replace('text-red-500', 'text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.replace('text-slate-400', 'text-red-500');

            if (tabName === 'upcoming' && document.getElementById('upcoming-grid').children.length === 0) {
                loadUpcoming();
            }
        }

        // Fetch API Helper
        async function fetchTMDB(endpoint, params = '') {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&region=IN${params}`);
                return await res.json();
            } catch (err) {
                console.error("API Error:", err);
                return null;
            }
        }

        // Load Trending
        async function loadTrending() {
            document.getElementById('section-title').innerText = "Trending Today";
            highlightOttButton(0);
            showGridSkeleton('home-grid');
            const data = await fetchTMDB('/trending/all/day');
            renderGrid(data.results, 'home-grid');
        }

        // Load by OTT Platform
        async function loadByOTT(providerId) {
            const ottNames = { 8: 'Netflix', 119: 'Prime Video', 122: 'Disney+ Hotstar', 237: 'SonyLIV' };
            document.getElementById('section-title').innerText = `Popular on ${ottNames[providerId]}`;
            showGridSkeleton('home-grid');
            const data = await fetchTMDB('/discover/movie', `&with_watch_providers=${providerId}&watch_region=IN&sort_by=popularity.desc`);
            renderGrid(data.results, 'home-grid');
        }

        // Load Upcoming
        async function loadUpcoming() {
            showGridSkeleton('upcoming-grid');
            const data = await fetchTMDB('/movie/upcoming', '&page=1');
            renderGrid(data.results, 'upcoming-grid');
        }

        // Search Handler
        function handleSearch(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.getElementById('search-grid').innerHTML = '<p class="col-span-full text-center text-slate-500 py-10 text-sm">Type something to search...</p>';
                return;
            }
            searchTimeout = setTimeout(async () => {
                showGridSkeleton('search-grid');
                const data = await fetchTMDB('/search/multi', `&query=${encodeURIComponent(query)}`);
                const filtered = data.results.filter(item => item.media_type === 'movie' || item.media_type === 'tv');
                renderGrid(filtered, 'search-grid');
            }, 500);
        }

        // Render Media Cards
        function renderGrid(items, targetId) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10 text-sm">No results found.</p>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const type = item.media_type || (item.title ? 'movie' : 'tv');

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="bg-slate-900 rounded-xl overflow-hidden border border-slate-800 hover:border-slate-700 transition cursor-pointer flex flex-col">
                        <div class="relative aspect-[2/3] bg-slate-800">
                            <img src="${poster}" alt="${title}" class="w-full h-full object-cover" loading="lazy">
                            <span class="absolute top-2 right-2 bg-slate-950/80 border border-slate-700/60 text-amber-400 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-1">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="p-2.5 flex flex-col justify-between flex-grow">
                            <h3 class="text-xs font-semibold text-slate-200 line-clamp-1">${title}</h3>
                            <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1">
                                <span>${year}</span>
                                <span class="uppercase tracking-wider font-semibold text-slate-500 text-[9px]">${type}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show Full Details Modal
        async function openDetails(type, id) {
            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `<div class="p-10 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i><p>Loading details...</p></div>`;

            const data = await fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers');

            if (!data) {
                content.innerHTML = `<p class="p-10 text-center text-red-400">Failed to load details.</p>`;
                return;
            }

            const title = data.title || data.name;
            const backdrop = data.backdrop_path ? `${BACKDROP_URL}${data.backdrop_path}` : `${IMG_URL}${data.poster_path}`;
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const releaseDate = data.release_date || data.first_air_date || 'N/A';
            const cast = data.credits?.cast?.slice(0, 6) || [];
            const providers = data['watch/providers']?.results?.IN?.flatrate || [];

            content.innerHTML = `
                <div class="relative aspect-video w-full bg-slate-900">
                    <img src="${backdrop}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"></div>
                </div>
                
                <div class="px-5 -mt-16 relative z-10 space-y-4">
                    <div class="flex items-end gap-4">
                        <img src="${IMG_URL}${data.poster_path}" class="w-24 h-36 rounded-lg border border-slate-700 shadow-xl object-cover">
                        <div class="space-y-1">
                            <span class="text-xs text-red-500 font-semibold uppercase tracking-wider">${type === 'movie' ? 'Movie' : 'TV Show'}</span>
                            <h1 class="text-xl font-bold text-white">${title}</h1>
                            <div class="flex items-center gap-3 text-xs text-slate-400">
                                <span class="text-amber-400 font-bold"><i class="fa-solid fa-star"></i> ${rating}</span>
                                <span>•</span>
                                <span>${releaseDate}</span>
                            </div>
                        </div>
                    </div>

                    <!-- OTT Providers -->
                    ${providers.length > 0 ? `
                        <div>
                            <p class="text-xs font-semibold text-slate-400 mb-2">Available On (India):</p>
                            <div class="flex gap-2">
                                ${providers.map(p => `
                                    <img src="${IMG_URL}${p.logo_path}" title="${p.provider_name}" class="w-8 h-8 rounded-lg">
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- Overview -->
                    <div>
                        <h3 class="text-sm font-semibold text-slate-300 mb-1">Overview</h3>
                        <p class="text-xs text-slate-400 leading-relaxed">${data.overview || 'No overview available.'}</p>
                    </div>

                    <!-- Cast -->
                    ${cast.length > 0 ? `
                        <div>
                            <h3 class="text-sm font-semibold text-slate-300 mb-2">Top Cast</h3>
                            <div class="grid grid-cols-3 gap-2">
                                ${cast.map(c => `
                                    <div class="bg-slate-900 p-2 rounded-lg border border-slate-800 text-center">
                                        <p class="text-xs font-medium text-slate-200 truncate">${c.name}</p>
                                        <p class="text-[10px] text-slate-500 truncate">${c.character}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- TV Show Seasons (if applicable) -->
                    ${data.seasons ? `
                        <div>
                            <h3 class="text-sm font-semibold text-slate-300 mb-2">Seasons (${data.number_of_seasons})</h3>
                            <div class="space-y-2">
                                ${data.seasons.slice(0, 5).map(s => `
                                    <div class="flex items-center justify-between bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <span class="text-xs font-medium text-slate-300">${s.name}</span>
                                        <span class="text-xs text-slate-500">${s.episode_count} Episodes</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Close Modal
        function closeModal() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // UI Helpers
        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="bg-slate-900/60 rounded-xl aspect-[2/3] animate-pulse"></div>
            `).join('');
        }

        function highlightOttButton(index) {
            const btns = document.querySelectorAll('.ott-btn');
            btns.forEach((btn, i) => {
                if (i === index) {
                    btn.className = "ott-btn active px-4 py-1.5 rounded-full text-xs font-semibold bg-red-600 text-white whitespace-nowrap transition-all";
                } else {
                    btn.className = "ott-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-slate-900 border border-slate-800 hover:border-slate-700 text-slate-300 whitespace-nowrap transition-all";
                }
            });
        }
    </script>
</body>
</html>
