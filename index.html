<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineDB - Ultimate Streaming Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(20, 27, 45, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }
        .glass-card:active {
            transform: scale(0.97);
        }
        .glass-modal {
            background: rgba(7, 11, 22, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }
    </style>
</head>
<body class="bg-[#070a13] text-slate-100 font-sans antialiased min-h-screen pb-24 select-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/30 via-[#070a13] to-[#070a13]">

    <!-- Fixed Header -->
    <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="resetToHome()">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-red-600 via-rose-500 to-amber-500 flex items-center justify-center shadow-lg shadow-red-500/30 border border-white/20">
                <i class="fa-solid fa-play text-white text-xs"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-wider text-white block leading-none">Cine<span class="text-red-500">DB</span></span>
                <span class="text-[9px] text-amber-400 font-bold uppercase tracking-widest flex items-center gap-1">
                    <i class="fa-solid fa-bolt text-[8px]"></i> TMDB Inside
                </span>
            </div>
        </div>
        
        <button onclick="switchTab('search')" class="w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-slate-300 hover:text-white border border-white/10 active:bg-white/10 transition">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="p-4 max-w-7xl mx-auto space-y-5">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-5">
            <!-- Category Filters -->
            <div class="flex gap-2.5 overflow-x-auto no-scrollbar py-0.5">
                <button onclick="changeCategoryFilter('all', this)" class="cat-btn active px-5 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 whitespace-nowrap border border-red-400/30">All</button>
                <button onclick="changeCategoryFilter('movie', this)" class="cat-btn px-5 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">Movies</button>
                <button onclick="changeCategoryFilter('tv', this)" class="cat-btn px-5 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10">TV Shows</button>
            </div>

            <!-- OPTIMIZED HERO BANNER (Zoom issue fixed) -->
            <div id="hero-container" class="relative rounded-3xl overflow-hidden glass-card border border-white/10 shadow-2xl h-[210px] sm:h-[300px] flex items-end cursor-pointer group transition duration-500">
                <div class="p-12 text-center w-full text-slate-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-red-500 mb-2"></i>
                    <p class="text-xs">Loading Spotlight...</p>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <h2 id="section-title" class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    Trending Movies & Shows
                </h2>
            </div>

            <!-- Media Grid -->
            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>

            <!-- Scroll Loader -->
            <div id="infinite-loader" class="py-6 text-center text-slate-500 text-xs hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-lg text-red-500 mb-1"></i>
                <p>Loading more titles...</p>
            </div>
        </section>

        <!-- SEARCH TAB -->
        <section id="tab-search" class="hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-400"></i>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search Movies, TV Shows, Cast..." class="w-full glass-card rounded-2xl pl-11 pr-4 py-3.5 text-sm text-slate-100 focus:outline-none focus:border-red-500/60 transition">
            </div>
            <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
                <p class="col-span-full text-center text-slate-500 py-12 text-xs">Search anything on TMDB...</p>
            </div>
        </section>

        <!-- SCHEDULE / WATCHED LIST TAB -->
        <section id="tab-schedule" class="hidden space-y-4">
            <div class="flex border-b border-white/10 gap-6 pb-2">
                <button onclick="switchListSubTab('schedule')" id="subtab-schedule" class="text-sm font-bold text-red-500 border-b-2 border-red-500 pb-1">Scheduled Plan</button>
                <button onclick="switchListSubTab('watched')" id="subtab-watched" class="text-sm font-semibold text-slate-400 pb-1">Watched History</button>
            </div>

            <div id="list-schedule-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
            <div id="list-watched-container" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
        </section>

    </main>

    <!-- Details Modal -->
    <div id="details-modal" class="fixed inset-0 z-50 glass-modal hidden overflow-y-auto">
        <button onclick="closeModalManual()" class="fixed top-4 right-4 z-50 w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-white border border-white/20 active:scale-95 transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content" class="max-w-2xl mx-auto pb-12"></div>
    </div>

    <!-- CALENDAR DATE PICKER MODAL -->
    <div id="date-modal" class="fixed inset-0 z-50 glass-modal hidden flex items-center justify-center p-4">
        <div class="glass-card p-5 rounded-3xl max-w-xs w-full space-y-4 border border-white/15 shadow-2xl">
            <h3 id="date-modal-title" class="text-sm font-bold text-slate-100 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-red-500"></i> Select Date
            </h3>
            <p class="text-[11px] text-slate-400">Choose date to add to your list:</p>
            <input type="date" id="custom-date-input" class="w-full bg-slate-900 border border-white/20 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-red-500">
            <div class="flex gap-2 pt-1">
                <button onclick="closeDateModal()" class="w-1/2 py-2.5 rounded-xl text-xs font-semibold glass-card text-slate-400 hover:text-white">Cancel</button>
                <button onclick="confirmDateSelection()" class="w-1/2 py-2.5 rounded-xl text-xs font-bold bg-red-600 hover:bg-red-500 text-white shadow-lg shadow-red-600/30">Save Date</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 glass-header px-6 py-2.5 flex justify-around items-center border-t border-white/10">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-red-500">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="triggerRandomPicker()" id="nav-random" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-amber-400 transition">
            <i class="fa-solid fa-dice text-lg animate-bounce"></i>
            <span class="text-[10px] font-semibold">Random</span>
        </button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-btn flex flex-col items-center gap-1 text-slate-400">
            <i class="fa-solid fa-calendar-check text-lg"></i>
            <span class="text-[10px] font-semibold">My List</span>
        </button>
    </nav>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let currentTab = 'home';
        let currentCategory = 'all'; 
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let searchTimeout = null;

        // Auto Slider & Date State
        let heroItems = [];
        let heroIndex = 0;
        let heroTimer = null;
        let pendingItem = null;
        let pendingKey = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadHomeTitles(true);
            setupHistoryState();
            setupInfiniteScroll();
        });

        function setupHistoryState() {
            window.history.replaceState({ modalOpen: false, tab: 'home' }, '');
            window.addEventListener('popstate', (e) => {
                const modal = document.getElementById('details-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModalDOM();
                } else if (e.state && e.state.tab) {
                    switchTabDOM(e.state.tab);
                }
            });
        }

        function resetToHome() {
            if (currentTab !== 'home') switchTab('home');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchTab(tabName) {
            if (currentTab === tabName) return;
            window.history.pushState({ modalOpen: false, tab: tabName }, '');
            switchTabDOM(tabName);
        }

        function switchTabDOM(tabName) {
            currentTab = tabName;
            ['home', 'search', 'schedule'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
                document.getElementById(`nav-${tab}`).classList.replace('text-red-500', 'text-slate-400');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`nav-${tabName}`).classList.replace('text-slate-400', 'text-red-500');

            if (tabName === 'schedule') {
                renderUserLists();
            }
        }

        async function fetchTMDB(endpoint, params = '') {
            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&region=IN${params}`);
                return await res.json();
            } catch (err) {
                console.error("API Fetch Error:", err);
                return null;
            }
        }

        async function fetchTitleLogo(type, id) {
            try {
                const data = await fetchTMDB(`/${type}/${id}/images`, '&include_image_language=en,hi,null');
                if (data && data.logos && data.logos.length > 0) {
                    const logo = data.logos.find(l => l.iso_639_1 === 'en') || data.logos[0];
                    return `${IMG_URL}${logo.file_path}`;
                }
            } catch (e) { console.error(e); }
            return null;
        }

        function changeCategoryFilter(category, btnEl) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-5 py-2 rounded-2xl text-xs font-semibold glass-card text-slate-300 whitespace-nowrap hover:bg-white/10";
            });
            if (btnEl) btnEl.className = "cat-btn active px-5 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-red-600 to-rose-600 text-white shadow-lg shadow-red-600/30 whitespace-nowrap border border-red-400/30";

            currentCategory = category;
            const titles = {
                all: "Trending Movies & Shows",
                movie: "Popular Movies",
                tv: "Popular TV Shows"
            };
            document.getElementById('section-title').innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> ${titles[category]}`;

            loadHomeTitles(true);
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (currentTab !== 'home' || isFetching || !hasMore) return;
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                    loadHomeTitles(false);
                }
            });
        }

        async function loadHomeTitles(reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                showGridSkeleton('home-grid');
            } else {
                document.getElementById('infinite-loader').classList.remove('hidden');
            }

            let endpoint = '/trending/all/day';
            if (currentCategory === 'movie') endpoint = '/trending/movie/day';
            if (currentCategory === 'tv') endpoint = '/trending/tv/day';

            const data = await fetchTMDB(endpoint, `&page=${currentPage}`);
            document.getElementById('infinite-loader').classList.add('hidden');

            if (data && data.results && data.results.length > 0) {
                if (reset) {
                    heroItems = data.results.slice(0, 5);
                    heroIndex = 0;
                    startHeroAutoSlide();
                }
                renderGrid(data.results, 'home-grid', !reset);
                currentPage++;
                if (currentPage > data.total_pages) hasMore = false;
            } else {
                hasMore = false;
            }

            isFetching = false;
        }

        function startHeroAutoSlide() {
            if (heroTimer) clearInterval(heroTimer);
            if (!heroItems.length) return;

            renderHeroBanner(heroItems[heroIndex]);

            heroTimer = setInterval(() => {
                heroIndex = (heroIndex + 1) % heroItems.length;
                renderHeroBanner(heroItems[heroIndex]);
            }, 4000);
        }

        // PERFECTLY PROPORTIONED HERO BANNER
        async function renderHeroBanner(item) {
            const container = document.getElementById('hero-container');
            const type = item.media_type || (item.title ? 'movie' : 'tv');
            const title = item.title || item.name;
            const backdrop = item.backdrop_path ? `${BACKDROP_URL}${item.backdrop_path}` : `${IMG_URL}${item.poster_path}`;
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

            container.onclick = () => openDetails(type, item.id);

            const logoUrl = await fetchTitleLogo(type, item.id);

            container.innerHTML = `
                <div class="absolute inset-0 bg-slate-900">
                    <img src="${backdrop}" class="w-full h-full object-cover object-center transition-all duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#070a13] via-[#070a13]/30 to-transparent"></div>
                    <div class="absolute inset-0 bg-gradient-to-r from-[#070a13]/70 via-transparent to-transparent"></div>
                </div>

                <div class="relative z-10 p-4 w-full flex items-end justify-between gap-4">
                    <div class="space-y-1.5 max-w-[75%]">
                        <span class="bg-amber-400/20 text-amber-300 border border-amber-400/30 text-[10px] font-bold px-2 py-0.5 rounded-lg flex items-center gap-1 w-max backdrop-blur-md">
                            <i class="fa-solid fa-star text-[8px]"></i> TMDB ${rating}
                        </span>

                        ${logoUrl ? `
                            <img src="${logoUrl}" alt="${title}" class="max-h-10 max-w-[180px] object-contain drop-shadow-2xl">
                        ` : `
                            <h1 class="text-base font-black text-white leading-tight drop-shadow-md truncate">${title}</h1>
                        `}
                    </div>

                    <div class="flex gap-1.5 pb-1">
                        ${heroItems.map((_, idx) => `
                            <span class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${idx === heroIndex ? 'bg-red-500 w-4' : 'bg-white/30'}"></span>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        async function triggerRandomPicker() {
            const randomPage = Math.floor(Math.random() * 10) + 1;
            const data = await fetchTMDB('/trending/all/week', `&page=${randomPage}`);
            if (data && data.results && data.results.length > 0) {
                const randomItem = data.results[Math.floor(Math.random() * data.results.length)];
                const type = randomItem.media_type || (randomItem.title ? 'movie' : 'tv');
                openDetails(type, randomItem.id);
            }
        }

        // USER LISTS & CALENDAR DATE LOGIC
        function getListData(key) {
            return JSON.parse(localStorage.getItem(`cinedb_${key}`)) || [];
        }

        function handleListAction(item, key) {
            let list = getListData(key);
            const index = list.findIndex(i => i.id === item.id);

            if (index > -1) {
                list.splice(index, 1);
                localStorage.setItem(`cinedb_${key}`, JSON.stringify(list));
                if (currentTab === 'schedule') renderUserLists();
                openDetails(item.media_type, item.id);
            } else {
                pendingItem = item;
                pendingKey = key;
                const dateModal = document.getElementById('date-modal');
                const dateInput = document.getElementById('custom-date-input');
                const titleEl = document.getElementById('date-modal-title');
                
                titleEl.innerHTML = key === 'schedule' 
                    ? `<i class="fa-solid fa-calendar-day text-red-500"></i> Schedule Plan Date` 
                    : `<i class="fa-solid fa-circle-check text-blue-500"></i> Watched Date`;
                    
                dateInput.value = new Date().toISOString().split('T')[0];
                dateModal.classList.remove('hidden');
            }
        }

        function confirmDateSelection() {
            if (!pendingItem || !pendingKey) return;
            const dateVal = document.getElementById('custom-date-input').value;
            let list = getListData(pendingKey);
            
            pendingItem.userDate = dateVal || new Date().toISOString().split('T')[0];
            list.push(pendingItem);
            
            localStorage.setItem(`cinedb_${pendingKey}`, JSON.stringify(list));
            closeDateModal();
            
            if (currentTab === 'schedule') renderUserLists();
            openDetails(pendingItem.media_type, pendingItem.id);
        }

        function closeDateModal() {
            document.getElementById('date-modal').classList.add('hidden');
            pendingItem = null;
            pendingKey = null;
        }

        function switchListSubTab(sub) {
            const isSched = sub === 'schedule';
            document.getElementById('subtab-schedule').className = isSched ? "text-sm font-bold text-red-500 border-b-2 border-red-500 pb-1" : "text-sm font-semibold text-slate-400 pb-1";
            document.getElementById('subtab-watched').className = !isSched ? "text-sm font-bold text-red-500 border-b-2 border-red-500 pb-1" : "text-sm font-semibold text-slate-400 pb-1";

            document.getElementById('list-schedule-container').classList.toggle('hidden', !isSched);
            document.getElementById('list-watched-container').classList.toggle('hidden', isSched);
        }

        function renderUserLists() {
            const schedList = getListData('schedule');
            const watchedList = getListData('watched');

            renderGrid(schedList, 'list-schedule-container');
            renderGrid(watchedList, 'list-watched-container');
        }

        function handleSearch(query) {
            clearTimeout(searchTimeout);
            if (!query.trim()) {
                document.getElementById('search-grid').innerHTML = '<p class="col-span-full text-center text-slate-500 py-12 text-xs">Search anything on TMDB...</p>';
                return;
            }
            searchTimeout = setTimeout(async () => {
                showGridSkeleton('search-grid');
                const data = await fetchTMDB('/search/multi', `&query=${encodeURIComponent(query)}`);
                const filtered = data.results ? data.results.filter(i => i.media_type === 'movie' || i.media_type === 'tv') : [];
                renderGrid(filtered, 'search-grid');
            }, 400);
        }

        function renderGrid(items, targetId, append = false) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                if (!append) container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-12 text-xs">No saved titles yet.</p>`;
                return;
            }

            const html = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const type = item.media_type || (item.title ? 'movie' : 'tv');

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="glass-card rounded-2xl overflow-hidden transition duration-300 cursor-pointer flex flex-col group">
                        <div class="relative aspect-[2/3] bg-slate-900/60 overflow-hidden">
                            <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-2 right-2 bg-slate-950/80 backdrop-blur-md text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1 border border-white/10 shadow-md">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="p-2.5 flex flex-col justify-between flex-grow">
                            <div>
                                <h3 class="text-xs font-semibold text-slate-100 line-clamp-1">${title}</h3>
                                ${item.userDate ? `<span class="text-[9px] text-red-400 font-semibold block mt-1"><i class="fa-regular fa-calendar-check text-[8px] mr-1"></i>${item.userDate}</span>` : ''}
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5">
                                <span>${year}</span>
                                <span class="uppercase tracking-wider font-bold text-[8px] bg-white/5 border border-white/10 px-1.5 py-0.5 rounded-md text-slate-300">${type}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (append) {
                container.innerHTML += html;
            } else {
                container.innerHTML = html;
            }
        }

        async function openDetails(type, id) {
            window.history.pushState({ modalOpen: true, tab: currentTab }, '');
            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `<div class="p-16 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-red-500 mb-3"></i><p class="text-xs">Loading details...</p></div>`;

            const [data, logoUrl] = await Promise.all([
                fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers'),
                fetchTitleLogo(type, id)
            ]);

            if (!data) {
                content.innerHTML = `<p class="p-12 text-center text-red-400 text-xs">Failed to load content.</p>`;
                return;
            }

            const title = data.title || data.name;
            const backdrop = data.backdrop_path ? `${BACKDROP_URL}${data.backdrop_path}` : `${IMG_URL}${data.poster_path}`;
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const releaseDate = data.release_date || data.first_air_date || 'N/A';
            const cast = data.credits?.cast?.slice(0, 10) || [];
            const providers = data['watch/providers']?.results?.IN?.flatrate || [];
            const validSeasons = (data.seasons || []).filter(s => s.season_number > 0);

            const schedItem = getListData('schedule').find(i => i.id === data.id);
            const watchedItem = getListData('watched').find(i => i.id === data.id);

            const itemPayload = JSON.stringify({ id: data.id, title, poster_path: data.poster_path, vote_average: data.vote_average, release_date: releaseDate, media_type: type }).replace(/"/g, '&quot;');

            content.innerHTML = `
                <div class="relative aspect-video w-full bg-slate-900">
                    <img src="${backdrop}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#070a13] via-[#070a13]/50 to-transparent"></div>
                </div>
                
                <div class="px-5 -mt-20 relative z-10 space-y-5">
                    <div class="flex items-end gap-4">
                        <img src="${IMG_URL}${data.poster_path}" class="w-28 h-40 rounded-2xl border border-white/20 shadow-2xl object-cover flex-shrink-0">
                        <div class="space-y-2 min-w-0 flex-grow">
                            <span class="text-[10px] font-bold text-red-500 uppercase tracking-widest bg-red-500/10 border border-red-500/20 px-2 py-0.5 rounded-md inline-block">${type === 'movie' ? 'Movie' : 'TV Show'}</span>
                            
                            ${logoUrl ? `
                                <img src="${logoUrl}" alt="${title}" class="max-h-12 max-w-full object-contain my-1">
                            ` : `
                                <h1 class="text-xl font-bold text-white leading-tight">${title}</h1>
                            `}

                            <div class="flex items-center gap-3 text-xs text-slate-300">
                                <span class="text-amber-400 font-bold flex items-center gap-1 bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20">
                                    <i class="fa-solid fa-star text-[10px]"></i> TMDB ${rating}
                                </span>
                                <span>•</span>
                                <span>${releaseDate}</span>
                            </div>
                        </div>
                    </div>

                    <!-- USER ACTION BUTTONS WITH DATE SELECTOR -->
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="handleListAction(${itemPayload}, 'schedule')" class="py-2.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 border transition ${schedItem ? 'bg-emerald-600 text-white border-emerald-400' : 'glass-card text-slate-300 border-white/10'}">
                            <i class="fa-solid fa-calendar-plus"></i> ${schedItem ? `Scheduled (${schedItem.userDate})` : 'Add to Schedule'}
                        </button>
                        <button onclick="handleListAction(${itemPayload}, 'watched')" class="py-2.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 border transition ${watchedItem ? 'bg-blue-600 text-white border-blue-400' : 'glass-card text-slate-300 border-white/10'}">
                            <i class="fa-solid fa-check-circle"></i> ${watchedItem ? `Watched (${watchedItem.userDate})` : 'Mark Watched'}
                        </button>
                    </div>

                    ${providers.length > 0 ? `
                        <div class="glass-card p-3.5 rounded-2xl">
                            <p class="text-xs font-semibold text-slate-300 mb-2.5">Available On (India):</p>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                                ${providers.map(p => `
                                    <div class="flex-none w-11 h-11 rounded-2xl overflow-hidden bg-slate-900 border border-white/15 p-1 flex items-center justify-center shadow-lg">
                                        <img src="${IMG_URL}${p.logo_path}" title="${p.provider_name}" class="w-full h-full object-cover rounded-xl">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass-card p-4 rounded-2xl">
                        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Overview</h3>
                        <p class="text-xs text-slate-300 leading-relaxed">${data.overview || 'No overview available.'}</p>
                    </div>

                    ${type === 'tv' && validSeasons.length > 0 ? `
                        <div class="glass-card p-4 rounded-2xl space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Seasons & Episodes</h3>
                                <span class="text-[10px] text-slate-400">${validSeasons.length} Seasons</span>
                            </div>

                            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                                ${validSeasons.map((s, idx) => `
                                    <button onclick="loadSeasonEpisodes(${id}, ${s.season_number}, this)" class="season-btn ${idx === 0 ? 'bg-red-600 text-white border-red-400/30' : 'bg-white/5 text-slate-300 border-white/10'} px-3.5 py-1.5 rounded-xl text-xs font-semibold border whitespace-nowrap transition">
                                        ${s.name}
                                    </button>
                                `).join('')}
                            </div>

                            <div id="episodes-container" class="space-y-3 pt-2"></div>
                        </div>
                    ` : ''}

                    ${cast.length > 0 ? `
                        <div>
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Top Cast</h3>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                                ${cast.map(c => {
                                    const photo = c.profile_path ? `${IMG_URL}${c.profile_path}` : 'https://via.placeholder.com/150?text=No+Photo';
                                    return `
                                        <div class="flex-none w-24 glass-card p-2 rounded-2xl text-center flex flex-col items-center">
                                            <img src="${photo}" class="w-14 h-14 rounded-full object-cover border border-white/20 mb-2 shadow-md">
                                            <p class="text-[11px] font-semibold text-slate-100 truncate w-full">${c.name}</p>
                                            <p class="text-[9px] text-slate-400 truncate w-full mt-0.5">${c.character || ''}</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            if (type === 'tv' && validSeasons.length > 0) {
                const firstSeasonNum = validSeasons[0].season_number;
                const firstBtn = document.querySelector('.season-btn');
                loadSeasonEpisodes(id, firstSeasonNum, firstBtn);
            }
        }

        async function loadSeasonEpisodes(tvId, seasonNumber, btnEl) {
            if (btnEl) {
                document.querySelectorAll('.season-btn').forEach(b => {
                    b.className = "season-btn bg-white/5 text-slate-300 border border-white/10 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition";
                });
                btnEl.className = "season-btn bg-red-600 text-white border border-red-400/30 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition";
            }

            const container = document.getElementById('episodes-container');
            container.innerHTML = `<div class="py-6 text-center text-slate-400 text-xs"><i class="fa-solid fa-circle-notch fa-spin text-lg text-red-500 mb-1"></i><p>Loading episodes...</p></div>`;

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}`);

            if (!data || !data.episodes || data.episodes.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 py-4 text-xs">No episodes found.</p>`;
                return;
            }

            container.innerHTML = data.episodes.map(ep => {
                const thumbnail = ep.still_path ? `${IMG_URL}${ep.still_path}` : 'https://via.placeholder.com/300x170?text=No+Thumbnail';
                const rating = ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A';
                const airDate = ep.air_date || 'N/A';

                return `
                    <div class="glass-card p-2.5 rounded-2xl flex gap-3 items-center border border-white/5">
                        <div class="relative w-28 aspect-video rounded-xl overflow-hidden bg-slate-900 flex-shrink-0">
                            <img src="${thumbnail}" class="w-full h-full object-cover">
                            <span class="absolute bottom-1 right-1 bg-black/80 text-amber-400 font-bold text-[9px] px-1.5 py-0.5 rounded backdrop-blur-sm flex items-center gap-0.5">
                                <i class="fa-solid fa-star text-[7px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="flex-grow min-w-0 space-y-1">
                            <h4 class="text-xs font-bold text-slate-100 truncate">E${ep.episode_number}. ${ep.name}</h4>
                            <p class="text-[10px] text-slate-400 flex items-center gap-1">
                                <i class="fa-regular fa-calendar text-[9px]"></i> ${airDate}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeModalManual() {
            window.history.back();
        }

        function closeModalDOM() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="glass-card rounded-2xl aspect-[2/3] animate-pulse"></div>
            `).join('');
        }
    </script>
</body>
</html>
