<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineDB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monochrome palette: remaps remaining indigo tint/border/text tokens to white/gray -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50:'#FFFFFF',100:'#F5F5F5',200:'#E5E5E5',300:'#D4D4D4',400:'#B0B0B0',500:'#FFFFFF',600:'#9A9A9A',700:'#7A7A7A',800:'#5C5C5C',900:'#404040',950:'#1A1A1A' }
                    },
                    // Default Tailwind 'lg' is 1024px — too high. Phones running
                    // "Request Desktop Site" report ~980px, so the desktop
                    // layout (top nav, split modal, scaled-up text) never
                    // triggered there. 900px catches that case reliably.
                    screens: { 'lg': '900px' }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
