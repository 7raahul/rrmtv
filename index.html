<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MtDv</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monochrome palette: remaps remaining indigo tint/border/text tokens to white/gray -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50:'#FFFFFF',100:'#F5F5F5',200:'#E5E5E5',300:'#D4D4D4',400:'#B0B0B0',500:'#FFFFFF',600:'#9A9A9A',700:'#7A7A7A',800:'#5C5C5C',900:'#404040',950:'#1A1A1A' }
                    },
                    // Default Tailwind 'lg' is 1024px — too high. Phones running
                    // "Request Desktop Site" report ~980px, so the desktop
                    // layout (top nav, split modal, scaled-up text) never
                    // triggered there. 900px catches that case reliably.
                    screens: { 'lg': '900px' }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-card {
            background: rgba(18, 18, 22, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card:active { transform: scale(0.97); }
        .glass-modal {
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        /* No backdrop-filter: used for items repeated inside scrolling
           grids/lists (poster cards, badges, episode cards). backdrop-blur
           on dozens of simultaneously-visible elements is the #1 cause of
           scroll jank on mid-range phones — this keeps the same look
           without the GPU cost. */
        .card-solid {
            background: rgba(15, 15, 18, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-solid:active { transform: scale(0.97); }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(18, 18, 22, 0.8) 25%, rgba(255, 255, 255, 0.15) 50%, rgba(18, 18, 22, 0.8) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Modern slim scrollbar — replaces the default OS scrollbar site-wide.
           .no-scrollbar rows (providers, cast, genre chips) stay fully hidden as before. */
        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.32);
            background-clip: padding-box;
        }

        /* Desktop card lift on hover — subtle, GPU-cheap (no blur), pairs with
           the existing group-hover image zoom. */
        .card-solid {
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
        }

        /* Mobile floating navigation — screenshot-style glass pill */
        .mobile-bottom-nav {
            display: none;
        }

        @media (max-width: 899px) {
            /* Mobile-only: remove the entire top header (MtDv + hamburger + top row).
               Desktop header remains unchanged at >= 900px. */
            .glass-header {
                display: none !important;
            }

            /* With the mobile header removed, start the page at the hero itself. */
            main {
                padding-top: 0 !important;
            }

            /* Compact screenshot-style floating bottom navigation. */
            .mobile-bottom-nav {
                display: flex;
                position: fixed;
                left: 20px;
                right: 20px;
                bottom: max(10px, env(safe-area-inset-bottom));
                z-index: 100;
                height: 70px;
                padding: 5px;
                align-items: stretch;
                gap: 2px;
                border: 1px solid rgba(255,255,255,.13);
                border-radius: 36px;
                background: rgba(28,28,31,.88);
                box-shadow: 0 14px 36px rgba(0,0,0,.60), inset 0 1px 0 rgba(255,255,255,.07);
                backdrop-filter: blur(18px) saturate(120%);
                -webkit-backdrop-filter: blur(18px) saturate(120%);
            }

            .mobile-bottom-nav::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                pointer-events: none;
                background: linear-gradient(180deg, rgba(255,255,255,.045), transparent 44%);
            }

            .mobile-nav-btn {
                position: relative;
                z-index: 1;
                flex: 1 1 0;
                min-width: 0;
                border: 0;
                border-radius: 31px;
                background: transparent;
                color: rgba(220,220,225,.82);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 3px;
                -webkit-tap-highlight-color: transparent;
                transition: transform .2s ease, background .22s ease, color .22s ease;
            }

            .mobile-nav-btn i {
                font-size: 22px;
                line-height: 1;
                transition: transform .22s ease, color .22s ease;
            }

            .mobile-nav-btn span {
                font-size: 11px;
                line-height: 1;
                font-weight: 500;
                letter-spacing: -.01em;
                white-space: nowrap;
            }

            .mobile-nav-btn.active {
                color: #fff;
                background: rgba(74,74,78,.72);
                box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 2px 10px rgba(0,0,0,.18);
            }

            .mobile-nav-btn.active i {
                transform: translateY(-1px);
            }

            .mobile-nav-btn:active {
                transform: scale(.95);
            }

            /* Replace the mobile top tab row with the floating nav. */
            .mobile-top-tabs {
                display: none !important;
            }

            /* Keep the last posters clear of the floating navigation. */
            main {
                padding-bottom: 96px !important;
            }

            /* Mobile-only: make the hero truly edge-to-edge. */
            #tab-home .group\/hero {
                margin-left: -1rem;
                margin-right: -1rem;
                width: calc(100% + 2rem);
            }

            #tab-home #hero-container {
                border-left: 0;
                border-right: 0;
                border-radius: 0;
            }

            /* Mobile-only: remove the catalog controls shown below the hero. */
            #tab-home #catalog-filter-bar {
                display: none !important;
            }

            /* Mobile-only: remove the extra section title; keep poster/logo titles. */
            #tab-home #section-title-row {
                display: none !important;
            }

            /* Mobile-only: no genre sections/headings (Action, Comedy, etc.).
               Keep the main poster grid so only poster/title content remains. */
            #tab-home #genre-rows-section {
                display: none !important;
            }

            /* Mobile details page: stronger hierarchy and contrast on dark UI. */
            #details-modal .detail-stat-grid {
                gap: 10px !important;
            }
            #details-modal .detail-stat-card {
                min-height: 78px;
                padding: 14px 14px !important;
                background: linear-gradient(145deg, rgba(24,24,29,.98), rgba(13,13,16,.98)) !important;
                border: 1px solid rgba(255,255,255,.12) !important;
                box-shadow: 0 8px 22px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.035);
            }
            #details-modal .detail-stat-card p:first-child {
                color: #a1a1aa !important;
                font-size: 10px !important;
                letter-spacing: .12em;
            }
            #details-modal .detail-stat-card p:nth-child(2) {
                color: #f8fafc !important;
                font-size: 15px !important;
                margin-top: 5px;
                line-height: 1.25;
            }
            #details-modal .detail-tabs {
                border-bottom-color: rgba(255,255,255,.12) !important;
                margin-bottom: 2px;
            }
            #details-modal .detail-tab-btn {
                padding: 11px 2px 12px !important;
                color: #a1a1aa !important;
                font-size: 12px !important;
                letter-spacing: .01em;
            }
            #details-modal .detail-tab-btn.text-white {
                color: #ffffff !important;
            }
            #details-modal .detail-tab-btn.border-amber-400 {
                border-bottom-width: 3px !important;
                border-color: #fbbf24 !important;
            }
            #details-modal #dpanel-overview .card-solid {
                background: linear-gradient(145deg, rgba(24,24,29,.98), rgba(13,13,16,.98)) !important;
                border: 1px solid rgba(255,255,255,.11) !important;
                box-shadow: 0 10px 26px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.035);
            }
            #details-modal #dpanel-overview .card-solid h3 {
                color: #f4f4f5 !important;
                font-size: 12px !important;
                letter-spacing: .09em;
            }
            #details-modal #dpanel-overview .card-solid > p,
            #details-modal #dpanel-overview .card-solid .text-slate-200,
            #details-modal #dpanel-overview .card-solid .text-slate-300 {
                color: #d4d4d8 !important;
            }
            #details-modal #dpanel-overview .card-solid .text-slate-500 {
                color: #a1a1aa !important;
            }
            #details-modal #dpanel-overview .card-solid .text-amber-400 {
                color: #fbbf24 !important;
            }
            #details-modal #dpanel-overview > .grid.grid-cols-2 {
                gap: 10px !important;
            }
            #details-modal #dpanel-overview > .grid.grid-cols-2 > .card-solid {
                min-height: 82px;
                padding: 14px !important;
            }
            #details-modal #dpanel-overview .ott-provider-logo {
                filter: none;
            }

            /* Mobile-only: details/actor overlays must be solid black.
               Do not show the page behind them through blur/transparency. */
            .glass-modal {
                background: #000 !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
            }
        }

        @media (min-width: 900px) {
            .mobile-bottom-nav {
                display: none !important;
            }
        }

        @media (min-width: 900px) {
            .card-solid:hover {
                transform: translateY(-5px) scale(1.015);
                border-color: rgba(251, 191, 36, 0.35);
                box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(251, 191, 36, 0.08);
            }
        }
    </style>
</head>
<body class="bg-[#060608] text-slate-100 font-sans antialiased min-h-screen select-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-[#060608] to-[#060608]">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Fixed Header (Lionsgate Play style: brand row + tab row) -->
    <header class="sticky top-0 z-40 glass-header">
      <div class="max-w-7xl mx-auto flex items-center justify-between px-4 lg:px-8 py-3">
        <div class="flex items-center gap-10">
            <div class="flex items-center cursor-pointer" onclick="setTopTab('all')">
                <span class="text-2xl font-black tracking-wider text-white leading-none">MtDv</span>
            </div>
            <!-- Desktop-only tabs (mobile keeps the second row below) -->
            <nav class="hidden lg:flex items-center gap-7">
                <button onclick="setTopTab('all')" id="dttab-all" class="dtoptab-btn px-1 py-2 text-sm font-bold text-white border-b-2 border-amber-400 transition">Home</button>
                <button onclick="setTopTab('movie')" id="dttab-movie" class="dtoptab-btn px-1 py-2 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition">Movies</button>
                <button onclick="setTopTab('tv')" id="dttab-tv" class="dtoptab-btn px-1 py-2 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition">TV Shows</button>
            </nav>
        </div>

        <div class="flex items-center gap-1">
            <div class="relative">
                <button onclick="toggleHamburgerMenu(event)" id="hamburger-btn" class="w-9 h-9 rounded-xl flex items-center justify-center text-white hover:bg-white/10 transition">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <div id="hamburger-dropdown" class="hidden absolute top-full right-0 mt-2 w-60 card-solid border border-white/15 rounded-2xl p-3 shadow-2xl z-50 space-y-3">
                    <div>
                        <label class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block mb-1">Release Year</label>
                        <select id="year-select" onchange="changeYearFilter(this.value)" class="w-full bg-[#0D0D10] border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none cursor-pointer">
                            <option value="">All Years</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block mb-1">Country</label>
                        <select id="country-select" onchange="changeCountryFilter(this.value)" class="w-full bg-[#0D0D10] border border-white/15 rounded-xl px-3 py-2 text-xs text-white focus:outline-none cursor-pointer">
                            <option value="ALL">All Countries</option>
                            <option value="IN">🇮🇳 India</option>
                            <option value="US">🇺🇸 United States</option>
                            <option value="GB">🇬🇧 United Kingdom</option>
                            <option value="KR">🇰🇷 South Korea</option>
                            <option value="JP">🇯🇵 Japan</option>
                            <option value="CN">🇨🇳 China</option>
                            <option value="FR">🇫🇷 France</option>
                            <option value="DE">🇩🇪 Germany</option>
                            <option value="ES">🇪🇸 Spain</option>
                            <option value="IT">🇮🇹 Italy</option>
                            <option value="TR">🇹🇷 Turkey</option>
                            <option value="CA">🇨🇦 Canada</option>
                            <option value="BR">🇧🇷 Brazil</option>
                            <option value="MX">🇲🇽 Mexico</option>
                            <option value="AU">🇦🇺 Australia</option>
                            <option value="RU">🇷🇺 Russia</option>
                            <option value="TH">🇹🇭 Thailand</option>
                            <option value="ID">🇮🇩 Indonesia</option>
                        </select>
                    </div>
                </div>
            </div>

            <button onclick="switchTab('search')" id="header-search-btn" class="hidden lg:flex w-9 h-9 rounded-xl items-center justify-center text-white hover:bg-white/10 transition">
                <i class="fa-solid fa-magnifying-glass text-base"></i>
            </button>
        </div>
      </div>

      <!-- Legacy mobile top tabs hidden in favor of the screenshot-style floating bottom nav. -->
      <div class="lg:hidden mobile-top-tabs max-w-7xl mx-auto flex items-center gap-6 px-4 lg:px-8 border-t border-white/10">
          <button onclick="setTopTab('all')" id="ttab-all" class="toptab-btn px-1 py-3 text-sm font-bold text-white border-b-2 border-amber-400 transition">Home</button>
          <button onclick="setTopTab('movie')" id="ttab-movie" class="toptab-btn px-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition">Movies</button>
          <button onclick="setTopTab('tv')" id="ttab-tv" class="toptab-btn px-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition">TV Shows</button>
      </div>
    </header>

    <!-- Screenshot-style mobile floating navigation -->
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Mobile navigation">
        <button type="button" id="mobile-nav-home" class="mobile-nav-btn active" onclick="setTopTab('all')" aria-label="Home">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button type="button" id="mobile-nav-movie" class="mobile-nav-btn" onclick="setTopTab('movie')" aria-label="Movies">
            <i class="fa-solid fa-clapperboard"></i>
            <span>Movies</span>
        </button>
        <button type="button" id="mobile-nav-tv" class="mobile-nav-btn" onclick="setTopTab('tv')" aria-label="TV Shows">
            <i class="fa-solid fa-tv"></i>
            <span>TV Shows</span>
        </button>
        <button type="button" id="mobile-nav-search" class="mobile-nav-btn" onclick="switchTab('search')" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </button>
    </nav>

    <!-- Main Content Tab Area -->
    <main class="p-4 lg:p-8 max-w-7xl mx-auto space-y-5 lg:space-y-8">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-4">

            <!-- HERO SPOTLIGHT -->
            <div class="relative group/hero">
                <div id="hero-container" class="relative overflow-hidden glass-card shadow-2xl aspect-video lg:aspect-auto lg:min-h-[280px] w-full cursor-pointer group">
                    <div class="p-12 text-center w-full text-indigo-300/60 my-auto">
                        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i>
                        <p class="text-xs">Loading Spotlight...</p>
                    </div>
                </div>
                <button onclick="heroPrev(event)" class="hidden lg:flex absolute left-4 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-black/50 hover:bg-black/75 border border-white/15 items-center justify-center text-white transition opacity-0 group-hover/hero:opacity-100">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button onclick="heroNext(event)" class="hidden lg:flex absolute right-4 top-1/2 -translate-y-1/2 z-20 w-11 h-11 rounded-full bg-black/50 hover:bg-black/75 border border-white/15 items-center justify-center text-white transition opacity-0 group-hover/hero:opacity-100">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <!-- TOP 10 TODAY (Desktop only) -->
            <div id="top10-section" class="hidden lg:block space-y-3"></div>

            <!-- CATALOG FILTER BAR (Movies / TV Shows tabs, desktop only) -->
            <div id="catalog-filter-bar" class="hidden lg:flex items-center gap-2.5 flex-wrap">
                <button data-sort="trending" onclick="setCatalogSort('trending')" class="sort-pill-btn px-4 py-2 rounded-xl text-sm font-bold bg-white text-black transition">Trending</button>
                <button data-sort="popular" onclick="setCatalogSort('popular')" class="sort-pill-btn px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30 transition">Popular</button>
                <button data-sort="new" onclick="setCatalogSort('new')" class="sort-pill-btn px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30 transition">New Releases</button>
                <button data-sort="top_rated" onclick="setCatalogSort('top_rated')" class="sort-pill-btn px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30 transition">Top Rated</button>

                <div class="relative">
                    <button onclick="toggleGenreMenu(event)" id="genre-filter-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30 transition">
                        <span id="genre-filter-label">Genre</span> <i class="fa-solid fa-chevron-down text-[10px] transition-transform" id="genre-filter-chevron"></i>
                    </button>
                    <div id="genre-filter-dropdown" class="hidden absolute top-full left-0 mt-2 card-solid border border-white/15 rounded-2xl p-4 shadow-2xl z-50 w-72"></div>
                </div>

                <select id="catalog-year-select" onchange="changeYearFilter(this.value)" class="bg-white/[0.04] border border-white/10 hover:border-white/30 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-300 focus:outline-none cursor-pointer transition">
                    <option value="">All Years</option>
                </select>

                <select id="catalog-country-select" onchange="changeCountryFilter(this.value)" class="bg-white/[0.04] border border-white/10 hover:border-white/30 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-300 focus:outline-none cursor-pointer transition">
                    <option value="ALL">All Countries</option>
                    <option value="IN">🇮🇳 India</option>
                    <option value="US">🇺🇸 United States</option>
                    <option value="GB">🇬🇧 United Kingdom</option>
                    <option value="KR">🇰🇷 South Korea</option>
                    <option value="JP">🇯🇵 Japan</option>
                    <option value="CN">🇨🇳 China</option>
                    <option value="FR">🇫🇷 France</option>
                    <option value="DE">🇩🇪 Germany</option>
                    <option value="ES">🇪🇸 Spain</option>
                    <option value="IT">🇮🇹 Italy</option>
                    <option value="TR">🇹🇷 Turkey</option>
                    <option value="CA">🇨🇦 Canada</option>
                    <option value="BR">🇧🇷 Brazil</option>
                    <option value="MX">🇲🇽 Mexico</option>
                    <option value="AU">🇦🇺 Australia</option>
                    <option value="RU">🇷🇺 Russia</option>
                    <option value="TH">🇹🇭 Thailand</option>
                    <option value="ID">🇮🇩 Indonesia</option>
                </select>
            </div>

            <!-- GENRE ROWS (Movies / TV Shows tabs only) -->
            <div id="genre-rows-section" class="hidden space-y-7"></div>

            <div id="section-title-row" class="flex justify-between items-center pt-2">
                <h2 id="section-title" class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    Trending Movies & Shows
                </h2>
            </div>

            <!-- Home Media Grid -->
            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3.5 lg:gap-5"></div>

            <div id="infinite-loader" class="py-6 text-center text-indigo-300/60 text-xs hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-lg text-indigo-400 mb-1"></i>
                <p>Loading more titles...</p>
            </div>
        </section>

        <!-- SEARCH TAB WITH FILTERS -->
        <section id="tab-search" class="hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-indigo-400/70"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search Movies, TV Shows, Cast..." class="w-full glass-card rounded-2xl pl-11 pr-4 py-3.5 text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-400 transition">
            </div>

            <!-- Recent Searches (Desktop only) -->
            <div id="recent-searches-wrap" class="hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-slate-400">Recent Searches</span>
                    <button onclick="clearRecentSearches()" class="text-xs font-semibold text-slate-400 hover:text-white underline transition">Clear All</button>
                </div>
                <div id="recent-searches-row" class="flex gap-2 flex-wrap"></div>
            </div>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let currentTab = 'home';
        let currentCategory = 'all'; 
        let currentCountry = 'ALL';
        let currentSort = 'trending';
        let currentGenre = '';
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let searchTimeout = null;
        let searchInitialized = false;

        let heroItems = [];
        let heroIndex = 0;
        let heroTimer = null;
        let heroEnrichToken = 0;
        let currentYear = '';

        document.addEventListener('DOMContentLoaded', () => {
            populateYearSelect();
            restoreNavigationState();
            setupHistoryState();
            setupInfiniteScroll();

            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get('id');
            const sharedType = params.get('type');

            if (sharedId && sharedType) {
                openDetails(sharedType, sharedId);
            } else if (currentTab === 'search') {
                switchTabDOM('search');
            } else {
                updateSectionTitle();
                loadHomeTitles(true);
            }
        });

        // Global image fallback for dynamically-rendered TMDB images.
        // This catches poster/backdrop/logo/episode/cast image failures too.
        document.addEventListener('error', (event) => {
            const img = event.target;
            if (!(img instanceof HTMLImageElement)) return;
            if (img.dataset.fallbackApplied === '1') return;

            img.dataset.fallbackApplied = '1';
            img.style.display = 'none';
            if (img.parentElement) img.parentElement.classList.add('image-failed');
        }, true);

        function populateYearSelect() {
            const current = new Date().getFullYear();
            let html = '<option value="">All Years</option>';
            for (let y = current; y >= 1945; y--) html += `<option value="${y}">${y}</option>`;
            ['year-select', 'catalog-year-select'].forEach(id => {
                const sel = document.getElementById(id);
                if (sel) sel.innerHTML = html;
            });
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-card px-4 py-2.5 rounded-2xl text-xs font-semibold text-white border border-indigo-500/30 shadow-2xl flex items-center gap-2 transform transition-all duration-300 translate-y-5 opacity-0 pointer-events-auto';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-indigo-400 text-sm"></i> <span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function checkShareableLink() {
            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get('id');
            const sharedType = params.get('type');
            if (sharedId && sharedType) openDetails(sharedType, sharedId);
        }

        function restoreNavigationState() {
            const params = new URLSearchParams(window.location.search);
            const hasDetails = !!(params.get('id') && params.get('type'));
            const hasSearch = params.has('q');

            if (hasDetails) {
                const savedCategory = sessionStorage.getItem('mtdv_active_category');
                currentCategory = savedCategory === 'movie' || savedCategory === 'tv' ? savedCategory : 'all';
                currentTab = sessionStorage.getItem('mtdv_active_tab') || 'home';
                return;
            }

            if (hasSearch) {
                currentTab = 'search';
                sessionStorage.setItem('mtdv_active_tab', 'search');
                return;
            }

            const savedCategory = sessionStorage.getItem('mtdv_active_category');
            const savedTab = sessionStorage.getItem('mtdv_active_tab');

            if (savedTab === 'search') {
                currentTab = 'search';
                return;
            }

            if (savedCategory === 'movie' || savedCategory === 'tv') {
                currentCategory = savedCategory;
                currentTab = 'home';
                syncMobileBottomNav(savedCategory);
                return;
            }

            currentCategory = 'all';
            currentTab = 'home';
            sessionStorage.setItem('mtdv_active_category', 'all');
            sessionStorage.setItem('mtdv_active_tab', 'home');
        }

        function setupHistoryState() {
            const params = new URLSearchParams(window.location.search);
            const currentState = {
                modalOpen: !!(params.get('id') && params.get('type')),
                tab: currentTab,
                category: currentCategory
            };

            // Do not overwrite a meaningful URL (search/details) during refresh.
            window.history.replaceState(currentState, '', window.location.href);

            window.addEventListener('popstate', (e) => {
                const modal = document.getElementById('details-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModalDOM();
                } else if (e.state && e.state.tab) {
                    if (e.state.category === 'movie' || e.state.category === 'tv' || e.state.category === 'all') {
                        currentCategory = e.state.category;
                    }
                    switchTabDOM(e.state.tab);
                }
            });
        }

        function switchTab(tabName) {
            // Close any open modals first — otherwise the tab switches
            // behind the modal and it looks like the nav button did nothing.
            const detailsModal = document.getElementById('details-modal');
            if (detailsModal && !detailsModal.classList.contains('hidden')) {
                closeModalDOM();
            }
            const actorModal = document.getElementById('actor-modal');
            if (actorModal && !actorModal.classList.contains('hidden')) {
                closeActorModal();
            }

            if (currentTab === tabName && tabName !== 'home') return;

            sessionStorage.setItem('mtdv_active_tab', tabName);
            if (tabName !== 'search') {
                sessionStorage.setItem('mtdv_active_category', currentCategory);
            }

            window.history.pushState({
                modalOpen: false,
                tab: tabName,
                category: currentCategory
            }, '', tabName === 'search' ? `${window.location.pathname}?tab=search` : window.location.pathname);

            switchTabDOM(tabName);
        }

        function switchTabDOM(tabName) {
            currentTab = tabName;
            syncMobileBottomNav(tabName === 'search' ? 'search' : (currentCategory === 'all' ? 'home' : currentCategory));
            if (tabName !== 'search') document.title = 'MtDv';

            ['home', 'search'].forEach(tab => {
                const tabEl = document.getElementById(`tab-${tab}`);
                if (tabEl) tabEl.classList.toggle('hidden', tab !== tabName);
            });

            if (tabName === 'search' && !searchInitialized) {
                searchInitialized = true;
                renderRecentSearches();
                handleSearch();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchTMDB(endpoint, params = '', retryCount = 0) {
            const cacheKey = `mtdv_cache_${endpoint}_${params}`;
            const cached = sessionStorage.getItem(cacheKey);

            if (cached) {
                try {
                    return JSON.parse(cached);
                } catch (_) {
                    sessionStorage.removeItem(cacheKey);
                }
            }

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 8000);

                const res = await fetch(
                    `${BASE_URL}${endpoint}?api_key=${API_KEY}${params}`,
                    { signal: controller.signal, cache: 'no-store' }
                );
                clearTimeout(timeout);

                if (!res.ok) throw new Error(`TMDB HTTP ${res.status}`);

                const data = await res.json();

                // Never cache an error-shaped/empty API response.
                if (data && !data.status_code) {
                    try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch (_) {}
                }
                return data;
            } catch (err) {
                console.error(`API Fetch Error (attempt ${retryCount + 1}):`, endpoint, err);

                if (retryCount < 2) {
                    await new Promise(resolve => setTimeout(resolve, 450 * (retryCount + 1)));
                    return fetchTMDB(endpoint, params, retryCount + 1);
                }
                return null;
            }
        }

        async function fetchTitleLogo(type, id) {
            try {
                const data = await fetchTMDB(`/${type}/${id}/images`, '&include_image_language=en,hi,null');
                if (data && data.logos && data.logos.length > 0) {
                    const logo = data.logos.find(l => l.iso_639_1 === 'en' || l.iso_639_1 === 'hi') || data.logos[0];
                    return `${IMG_URL}${logo.file_path}`;
                }
            } catch (e) { console.error(e); }
            return null;
        }

        // India + TV Shows should surface OTT web series, not daily-soap TV serials.
        // TMDB has no "web series only" flag, so we resolve the actual Indian OTT
        // platform IDs from /watch/providers/tv (name-matched, not hardcoded) and
        // filter discover/tv to only those with_watch_providers.
        let indianOttProviderIdsCache = null;
        const INDIAN_OTT_NAME_PATTERNS = ['netflix', 'prime video', 'amazon', 'hotstar', 'jiocinema', 'jio cinema', 'sonyliv', 'sony liv', 'zee5', 'mx player', 'voot', 'aha', 'hoichoi', 'lionsgate play', 'apple tv', 'mubi', 'erosnow', 'eros now'];
        async function getIndianOttProviderIds() {
            if (indianOttProviderIdsCache) return indianOttProviderIdsCache;
            const data = await fetchTMDB('/watch/providers/tv', '&watch_region=IN');
            if (data && data.results && data.results.length) {
                const ids = data.results
                    .filter(p => INDIAN_OTT_NAME_PATTERNS.some(pat => p.provider_name.toLowerCase().includes(pat)))
                    .map(p => p.provider_id);
                indianOttProviderIdsCache = ids.length ? ids : [8, 119, 232];
            } else {
                indianOttProviderIdsCache = [8, 119, 232]; // fallback: Netflix, Prime Video, ZEE5
            }
            return indianOttProviderIdsCache;
        }

        // Keep desktop tabs, legacy mobile tabs, and the new floating mobile nav in sync.
        function syncMobileBottomNav(active) {
            const ids = ['home', 'movie', 'tv', 'search'];
            ids.forEach(id => {
                const btn = document.getElementById(`mobile-nav-${id}`);
                if (btn) btn.classList.toggle('active', id === active);
            });
        }

        // Home / Movies / TV Shows top tab row
        function setTopTab(category) {
            syncMobileBottomNav(category === 'all' ? 'home' : category);
            document.querySelectorAll('.toptab-btn').forEach(b => {
                b.className = "toptab-btn px-1 py-3 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition";
            });
            const idMap = { all: 'ttab-all', movie: 'ttab-movie', tv: 'ttab-tv' };
            const activeEl = document.getElementById(idMap[category]);
            if (activeEl) activeEl.className = "toptab-btn px-1 py-3 text-sm font-bold text-white border-b-2 border-amber-400 transition";

            // Desktop header tabs
            document.querySelectorAll('.dtoptab-btn').forEach(b => {
                b.className = "dtoptab-btn px-1 py-2 text-sm font-semibold text-slate-400 border-b-2 border-transparent hover:text-white transition";
            });
            const dActive = document.getElementById({ all: 'dttab-all', movie: 'dttab-movie', tv: 'dttab-tv' }[category]);
            if (dActive) dActive.className = "dtoptab-btn px-1 py-2 text-sm font-bold text-white border-b-2 border-amber-400 transition";

            currentCategory = category;
            currentSort = 'trending';
            currentGenre = '';

            sessionStorage.setItem('mtdv_active_category', category);
            sessionStorage.setItem('mtdv_active_tab', 'home');

            switchTab('home');
            updateSectionTitle();
            loadHomeTitles(true);

            const filterBar = document.getElementById('catalog-filter-bar');
            const genreSection = document.getElementById('genre-rows-section');
            if (category === 'movie' || category === 'tv') {
                filterBar.classList.remove('hidden');
                filterBar.classList.add('lg:flex');
                document.querySelectorAll('.sort-pill-btn').forEach(b => {
                    const on = b.dataset.sort === 'trending';
                    b.className = `sort-pill-btn px-4 py-2 rounded-xl text-sm font-bold transition ${on ? 'bg-white text-black' : 'font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30'}`;
                });
                const genreLabel = document.getElementById('genre-filter-label');
                if (genreLabel) genreLabel.textContent = 'Genre';
                closeGenreMenu();
                loadGenreRows(category);
            } else {
                filterBar.classList.add('hidden');
                filterBar.classList.remove('lg:flex');
                genreSection.classList.add('hidden');
                genreSection.innerHTML = '';
            }
        }

        // Genre id/name lists — movie and tv use different TMDB genre sets
        // for Action/Sci-Fi, so each type has its own row list.
        const GENRE_ROWS = {
            movie: [
                { id: 28, name: 'Action' },
                { id: 35, name: 'Comedy' },
                { id: 18, name: 'Drama' },
                { id: 878, name: 'Sci-Fi' },
                { id: 27, name: 'Horror' },
                { id: 16, name: 'Animation' }
            ],
            tv: [
                { id: 10759, name: 'Action & Adventure' },
                { id: 35, name: 'Comedy' },
                { id: 18, name: 'Drama' },
                { id: 10765, name: 'Sci-Fi & Fantasy' },
                { id: 80, name: 'Crime' },
                { id: 16, name: 'Animation' }
            ]
        };

        // Full genre catalog used by the Genre filter dropdown (catalog bar)
        const GENRE_FULL = {
            movie: [
                { id: 28, name: 'Action' }, { id: 12, name: 'Adventure' },
                { id: 16, name: 'Animation' }, { id: 35, name: 'Comedy' },
                { id: 80, name: 'Crime' }, { id: 99, name: 'Documentary' },
                { id: 18, name: 'Drama' }, { id: 10751, name: 'Family' },
                { id: 14, name: 'Fantasy' }, { id: 36, name: 'History' },
                { id: 27, name: 'Horror' }, { id: 10402, name: 'Music' },
                { id: 9648, name: 'Mystery' }, { id: 10749, name: 'Romance' },
                { id: 878, name: 'Science Fiction' }, { id: 53, name: 'Thriller' },
                { id: 10752, name: 'War' }, { id: 37, name: 'Western' }
            ],
            tv: [
                { id: 10759, name: 'Action & Adventure' }, { id: 16, name: 'Animation' },
                { id: 35, name: 'Comedy' }, { id: 80, name: 'Crime' },
                { id: 99, name: 'Documentary' }, { id: 18, name: 'Drama' },
                { id: 10751, name: 'Family' }, { id: 10762, name: 'Kids' },
                { id: 9648, name: 'Mystery' }, { id: 10764, name: 'Reality' },
                { id: 10765, name: 'Sci-Fi & Fantasy' }, { id: 10766, name: 'Soap' },
                { id: 10767, name: 'Talk' }, { id: 10768, name: 'War & Politics' },

        };

        function setCatalogSort(sort) {
            currentSort = sort;
            document.querySelectorAll('.sort-pill-btn').forEach(b => {
                const on = b.dataset.sort === sort;
                b.className = `sort-pill-btn px-4 py-2 rounded-xl text-sm font-bold transition ${on ? 'bg-white text-black' : 'font-semibold text-slate-300 bg-white/[0.04] border border-white/10 hover:border-white/30'}`;
            });
            updateSectionTitle();

        }

        function toggleGenreMenu(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('genre-filter-dropdown');
            const chevron = document.getElementById('genre-filter-chevron');
            const opening = dropdown.classList.contains('hidden');
            if (opening) {
                const list = GENRE_FULL[currentCategory] || [];
                dropdown.innerHTML = `
                    <button onclick="selectGenre('', 'Genre')" class="col-span-2 text-left text-sm font-semibold ${currentGenre === '' ? 'text-white' : 'text-slate-400 hover:text-white'} pb-2 mb-2 border-b border-white/10 transition">All Genres</button>
                    <div class="grid grid-cols-2 gap-x-6 gap-y-2 max-h-80 overflow-y-auto">
                        ${list.map(g => `<button onclick="selectGenre(${g.id}, '${g.name.replace(/'/g, "\\'")}')" class="text-left text-sm ${currentGenre == g.id ? 'text-amber-400 font-bold' : 'text-slate-300 hover:text-white'} transition">${g.name}</button>`).join('')}
                    </div>
                `;
            }
            dropdown.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180', !dropdown.classList.contains('hidden'));
        }
        function closeGenreMenu() {
            document.getElementById('genre-filter-dropdown')?.classList.add('hidden');
            document.getElementById('genre-filter-chevron')?.classList.remove('rotate-180');
        }
        function selectGenre(genreId, genreName) {
            currentGenre = genreId;
            const label = document.getElementById('genre-filter-label');
            if (label) label.textContent = genreName;
            closeGenreMenu();
            updateSectionTitle();
            loadHomeTitles(true);
        }
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('genre-filter-dropdown');
            const btn = document.getElementById('genre-filter-btn');
            if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && btn && !btn.contains(e.target)) {
                closeGenreMenu();
            }
        });

        let genreRowToken = 0;

        // Renders one horizontal-scroll poster row per genre on the
        // Movies / TV Shows tabs, above the main Popular grid.
        async function loadGenreRows(type) {
            const section = document.getElementById('genre-rows-section');
            const token = ++genreRowToken;
            const genres = GENRE_ROWS[type] || [];

            section.classList.remove('hidden');
            section.innerHTML = genres.map(g => `
                <div>
                    <h2 class="text-sm font-bold text-white tracking-wide mb-2.5 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-amber-400"></span> ${g.name}
                    </h2>
                    <div id="genre-row-${type}-${g.id}" class="flex gap-3 overflow-x-auto no-scrollbar pb-1">
                        ${Array(6).fill(0).map(() => `<div class="skeleton flex-none w-28 lg:w-32 aspect-[2/3] rounded-xl border border-indigo-500/10"></div>`).join('')}
                    </div>
                </div>
            `).join('');

            for (const g of genres) {
                const endpoint = type === 'tv' ? '/discover/tv' : '/discover/movie';
                const data = await fetchTMDB(endpoint, `&with_genres=${g.id}&sort_by=popularity.desc`);
                if (token !== genreRowToken) return; // user switched tabs mid-fetch

                const row = document.getElementById(`genre-row-${type}-${g.id}`);
                if (!row) continue;

                const items = (data?.results || []).slice(0, 12);
                if (!items.length) {
                    row.innerHTML = `<p class="text-[11px] text-slate-500 py-2">No titles found.</p>`;
                    continue;
                }

                row.innerHTML = items.map(item => {
                    const title = item.title || item.name || 'Untitled';
                    const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Poster';
                    const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                    return `
                        <div onclick="openDetails('${type}', ${item.id})" class="card-solid flex-none w-28 lg:w-32 rounded-xl overflow-hidden cursor-pointer group">
                            <div class="relative aspect-[2/3] bg-[#060608] overflow-hidden">
                                ${poster ? `<img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" decoding="async">` : ''}
                                <span class="absolute top-1.5 right-1.5 bg-[#060608]/90 text-amber-400 font-bold text-[9px] px-1.5 py-0.5 rounded-md flex items-center gap-0.5 border border-indigo-500/20">
                                    <i class="fa-solid fa-star text-[8px]"></i> ${rating}
                                </span>
                            </div>
                            <p class="text-[10px] font-semibold text-slate-100 line-clamp-1 px-1.5 py-1.5">${title}</p>
                        </div>
                    `;
                }).join('');
            }
        }

        function syncFilterControls() {
            ['year-select', 'catalog-year-select'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = currentYear;
            });
            ['country-select', 'catalog-country-select'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = currentCountry;
            });
        }

        function changeCountryFilter(countryCode) {
            currentCountry = countryCode;
            syncFilterControls();
            updateSectionTitle();
            loadHomeTitles(true);
            closeHamburgerMenu();
        }

        function changeYearFilter(year) {
            currentYear = year;
            syncFilterControls();
            updateSectionTitle();
            loadHomeTitles(true);
            closeHamburgerMenu();
        }

        function toggleHamburgerMenu(e) {
            e.stopPropagation();
            document.getElementById('hamburger-dropdown').classList.toggle('hidden');
        }
        function closeHamburgerMenu() {
            document.getElementById('hamburger-dropdown')?.classList.add('hidden');
        }
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('hamburger-dropdown');
            const btn = document.getElementById('hamburger-btn');
            if (dropdown && !dropdown.classList.contains('hidden') && !dropdown.contains(e.target) && btn && !btn.contains(e.target)) {
                closeHamburgerMenu();
            }
        });

        function heroPrev(e) {
            e.stopPropagation();
            if (!heroItems.length) return;
            heroIndex = (heroIndex - 1 + heroItems.length) % heroItems.length;
            startHeroAutoSlide();
        }
        function heroNext(e) {
            e.stopPropagation();
            if (!heroItems.length) return;
            heroIndex = (heroIndex + 1) % heroItems.length;
            startHeroAutoSlide();
        }

        function renderTop10(items) {
            const section = document.getElementById('top10-section');
            if (!section) return;
            if (!items.length) { section.innerHTML = ''; return; }
            section.innerHTML = `
                <h2 class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span> Trending Now
                </h2>
                <div class="flex gap-6 overflow-x-auto no-scrollbar pb-2 pt-1">
                    ${items.map((item, idx) => {
                        const type = item.media_type || (item.title ? 'movie' : 'tv');
                        const title = item.title || item.name || 'Untitled';
                        const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/300x450?text=No+Image';
                        return `
                            <div onclick="openDetails('${type}', ${item.id})" class="relative flex-none flex items-end cursor-pointer group pl-8">
                                <div class="relative z-0 w-28 aspect-[2/3] rounded-xl overflow-hidden border border-white/10 shadow-xl group-hover:border-white/30 transition">
                                    <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                                </div>
                                <span class="absolute left-0 bottom-0 z-10 text-[90px] font-black leading-none select-none text-transparent pointer-events-none" style="-webkit-text-stroke: 3px rgba(255,255,255,0.9);">${idx + 1}</span>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function updateSectionTitle() {
            const sortLabels = { trending: 'Trending', popular: 'Popular', new: 'New Releases', top_rated: 'Top Rated' };
            const titles = { all: "Trending Movies & Shows", movie: "Movies", tv: "TV Shows" };
            let titleText = currentCategory === 'all' ? titles.all : `${sortLabels[currentSort] || 'Trending'} ${titles[currentCategory]}`;
            if (currentGenre) {
                const g = (GENRE_FULL[currentCategory] || []).find(x => x.id == currentGenre);
                if (g) titleText += ` • ${g.name}`;
            }
            if (currentCountry !== 'ALL') titleText += ` (${currentCountry})`;
            if (currentYear) titleText += ` (${currentYear})`;
            document.getElementById('section-title').innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> ${titleText}`;
            document.getElementById('section-title-row').classList.toggle('lg:hidden', currentCategory === 'movie' || currentCategory === 'tv');
        }

        function setupInfiniteScroll() {
            let ticking = false;
            window.addEventListener('scroll', () => {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(() => {
                    if (currentTab === 'home' && !isFetching && hasMore) {
                        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                            loadHomeTitles(false);
                        }
                    }
                    ticking = false;
                });
            }, { passive: true });
        }

        async function loadHomeTitles(reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                showGridSkeleton('home-grid');
            } else {
                document.getElementById('infinite-loader').classList.remove('hidden');
            }

            let endpoint = '/trending/all/day';
            let params = `&page=${currentPage}`;
            const effectiveCategory = currentCategory === 'all' ? 'movie' : currentCategory;
            const hasCatalogFilters = currentCategory !== 'all' && (currentSort !== 'trending' || currentGenre);

            if (currentCountry === 'IN' && currentCategory === 'tv' && currentSort === 'trending' && !currentGenre) {
                // Web-series-only: filter by actual Indian OTT platforms instead of
                // origin_country (which also returns broadcast TV daily soaps).
                endpoint = '/discover/tv';
                const ottIds = await getIndianOttProviderIds();
                params += `&watch_region=IN&with_watch_providers=${ottIds.join('|')}&sort_by=popularity.desc`;
                if (currentYear) params += `&first_air_date_year=${currentYear}`;
            } else if (hasCatalogFilters || currentCountry !== 'ALL' || currentYear) {
                endpoint = effectiveCategory === 'tv' ? '/discover/tv' : '/discover/movie';
                const sortMap = {
                    trending: 'popularity.desc',
                    popular: 'popularity.desc',
                    new: effectiveCategory === 'tv' ? 'first_air_date.desc' : 'primary_release_date.desc',
                    top_rated: 'vote_average.desc'
                };
                params += `&sort_by=${sortMap[currentSort] || 'popularity.desc'}`;
                if (currentSort === 'top_rated') params += '&vote_count.gte=200';
                if (currentSort === 'new') {
                    const todayStr = new Date().toISOString().split('T')[0];
                    params += effectiveCategory === 'tv' ? `&first_air_date.lte=${todayStr}` : `&primary_release_date.lte=${todayStr}`;
                }
                if (currentGenre) params += `&with_genres=${currentGenre}`;
                if (currentCountry !== 'ALL') params += `&with_origin_country=${currentCountry}`;
                if (currentYear) params += effectiveCategory === 'tv' ? `&first_air_date_year=${currentYear}` : `&primary_release_year=${currentYear}`;
            } else {
                if (currentCategory === 'movie') endpoint = '/trending/movie/day';
                else if (currentCategory === 'tv') endpoint = '/trending/tv/day';
            }

            const data = await fetchTMDB(endpoint, params);
            document.getElementById('infinite-loader').classList.add('hidden');

            if (data && data.results && data.results.length > 0) {
                if (reset) {
                    // Render grid + basic hero IMMEDIATELY — don't block on extra
                    // per-item detail fetches (that was causing filter clicks to
                    // feel broken/unresponsive).
                    heroItems = data.results.slice(0, 5);
                    heroIndex = 0;
                    startHeroAutoSlide();
                    renderTop10(data.results.slice(0, 10));
                    renderGrid(data.results, 'home-grid', false);
                    currentPage++;
                    if (currentPage > data.total_pages) hasMore = false;
                    isFetching = false;

                    // Enrich hero items (logo, runtime, cert, genres) in the
                    // background, then re-render just the hero banner.
                    enrichHeroItems(heroItems);
                    return;
                }
                renderGrid(data.results, 'home-grid', !reset);
                currentPage++;
                if (currentPage > data.total_pages) hasMore = false;
            } else {
                hasMore = false;
                if (reset) {
                    document.getElementById('home-grid').innerHTML = `<div class="col-span-full text-center text-slate-400 py-12 text-xs">No content found for this selection.</div>`;
                }
            }

            isFetching = false;
        }

        async function enrichHeroItems(rawHero) {
            const enrichToken = ++heroEnrichToken;
            const enriched = await Promise.all(rawHero.map(async raw => {
                const hType = raw.media_type || (raw.title ? 'movie' : 'tv');
                const certAppend = hType === 'movie' ? 'release_dates' : 'content_ratings';
                const [details, logoUrl] = await Promise.all([
                    fetchTMDB(`/${hType}/${raw.id}`, `&append_to_response=${certAppend}`),
                    fetchTitleLogo(hType, raw.id)
                ]);
                return { ...raw, _type: hType, _details: details, _logoUrl: logoUrl };
            }));
            // If the user switched filters again while this was in flight, drop it.
            if (enrichToken !== heroEnrichToken) return;
            heroItems = enriched;
            renderHeroBanner(heroItems[heroIndex]);
        }

        function startHeroAutoSlide() {
            if (heroTimer) clearInterval(heroTimer);
            if (!heroItems.length) return;

            renderHeroBanner(heroItems[heroIndex]);

            heroTimer = setInterval(() => {
                heroIndex = (heroIndex + 1) % heroItems.length;
                renderHeroBanner(heroItems[heroIndex]);
            }, 6000);
        }

        function renderHeroBanner(item) {
            const container = document.getElementById('hero-container');
            const type = item._type || item.media_type || (item.title ? 'movie' : 'tv');
            const title = item.title || item.name;
            const backdrop = item.backdrop_path ? `${BACKDROP_URL}${item.backdrop_path}` : `${IMG_URL}${item.poster_path}`;
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
            const logoUrl = item._logoUrl || null;

            container.onclick = () => openDetails(type, item.id);

            const details = item._details || {};
            const year = (item.release_date || item.first_air_date || '').split('-')[0];
            const genres = (details.genres || []).slice(0, 3).map(g => g.name).join(' • ');
            const metaLine = [type === 'tv' ? 'TV Show' : 'Movie', year, genres].filter(Boolean).join('  •  ');
            const fmtHeroDate = d => d ? new Date(d).toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
            const heroAirDate = item.release_date || item.first_air_date || details.release_date || details.first_air_date || '';
            const heroTodayStr = new Date().toISOString().split('T')[0];

            } else if (type === 'movie' && heroAirDate && heroAirDate > heroTodayStr) {
                heroUpcoming = `Releasing ${fmtHeroDate(heroAirDate)}`;
            }
            const heroStatA = type === 'tv' ? ['Air Date', fmtHeroDate(heroAirDate)] : ['Release', fmtHeroDate(heroAirDate)];
            const heroStatB = type === 'tv' ? ['Seasons', details.number_of_seasons ?? '—'] : ['Runtime', details.runtime ? details.runtime + ' min' : '—'];
            const dots = heroItems.map((_, idx) => `
                <span class="w-1 h-1 rounded-full transition-all duration-300 ${idx === heroIndex ? 'bg-white w-3' : 'bg-white/40'}"></span>

            container.innerHTML = `
                <!-- MOBILE: full-width 16:9 banner -->
                <div class="lg:hidden relative aspect-video w-full overflow-hidden">
                    <img src="${backdrop}" class="absolute inset-0 w-full h-full object-cover object-center">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#060608] via-[#060608]/15 to-transparent"></div>
                    <span class="absolute top-3 right-3 z-20 bg-black/70 text-amber-400 border border-white/15 text-[11px] font-bold px-2.5 py-1 rounded-lg flex items-center gap-1 w-max backdrop-blur-md">
                        <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                    </span>
                    <div class="relative z-10 h-full flex items-end p-4 w-full pr-14">
                        ${logoUrl ? `<img src="${logoUrl}" alt="${title}" class="max-h-10 max-w-[70%] object-contain drop-shadow-2xl">`
                                  : `<h1 class="text-lg font-black text-white leading-tight drop-shadow-md max-w-[85%]">${title}</h1>`}
                    </div>
                    <div class="absolute bottom-3 right-3 z-10 flex gap-1">${dots}</div>
                </div>

                <!-- DESKTOP: 16:9 image on the left (rating top-right), black info panel on the right -->
                <div class="hidden lg:flex relative w-full items-stretch bg-black">
                    <div class="relative w-[46%] max-w-[820px] aspect-video flex-shrink-0 overflow-hidden">
                        <img src="${backdrop}" class="w-full h-full object-cover object-center">
                        <span class="absolute top-3 right-3 z-20 bg-black/70 text-amber-400 border border-white/15 text-sm font-bold px-3 py-1.5 rounded-lg flex items-center gap-1.5 backdrop-blur-md">
                            <i class="fa-solid fa-star text-xs"></i> ${rating}
                        </span>
                    </div>

                    <div class="relative flex-1 min-w-0 flex flex-col justify-center gap-5 px-12 bg-black">
                        ${logoUrl ? `<img src="${logoUrl}" alt="${title}" class="max-h-24 max-w-[80%] object-contain object-left drop-shadow-2xl">`
                                  : `<h1 class="text-4xl font-black text-white leading-tight">${title}</h1>`}
                        <p class="text-sm text-slate-400">${metaLine}</p>

                        <div class="grid grid-cols-2 gap-3 max-w-md">
                            <div class="rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3">
                                <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">${heroStatA[0]}</p>
                                <p class="text-base font-bold text-white">${heroStatA[1]}</p>
                            </div>
                            <div class="rounded-xl border border-white/10 bg-white/[0.03] px-4 py-3">
                                <p class="text-[10px] text-slate-500 uppercase tracking-wider mb-1">${heroStatB[0]}</p>
                                <p class="text-base font-bold text-white">${heroStatB[1]}</p>
                            </div>
                        </div>

                        ${heroUpcoming ? `
                            <div class="max-w-md flex items-center gap-2 rounded-xl border border-amber-400/25 bg-amber-400/5 px-4 py-2.5">
                                <i class="fa-solid fa-calendar-days text-amber-400 text-sm"></i>
                                <p class="text-sm font-semibold text-amber-200">${heroUpcoming}</p>

                    <div class="absolute bottom-3 right-4 z-10 flex gap-1">${dots}</div>

        /* ENHANCED SEARCH LOGIC */
        function getRecentSearches() {
            try { return JSON.parse(localStorage.getItem('mtdv_recent_searches')) || []; } catch (e) { return []; }
        }
        function saveRecentSearch(query) {
            let list = getRecentSearches().filter(q => q.toLowerCase() !== query.toLowerCase());
            list.unshift(query);
            list = list.slice(0, 8);
            localStorage.setItem('mtdv_recent_searches', JSON.stringify(list));
            renderRecentSearches();
        }
        function renderRecentSearches() {
            const wrap = document.getElementById('recent-searches-wrap');
            const row = document.getElementById('recent-searches-row');
            if (!wrap || !row) return;
            const list = getRecentSearches();
            if (!list.length) { wrap.className = "hidden"; row.innerHTML = ''; return; }
            wrap.className = "hidden lg:block";
            row.innerHTML = list.map(q => `
                <button onclick="applyRecentSearch('${q.replace(/'/g, "\\'")}')" class="flex-none px-3 py-1.5 rounded-xl card-solid border border-white/10 text-xs text-slate-300 hover:text-white hover:border-white/30 transition whitespace-nowrap">
                    <i class="fa-regular fa-clock text-[10px] mr-1.5"></i>${q}
                </button>
            `).join('');
        }
        function applyRecentSearch(query) {
            document.getElementById('search-input').value = query;
            handleSearch();
        }
        function clearRecentSearches() {
            localStorage.removeItem('mtdv_recent_searches');
            renderRecentSearches();
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = document.getElementById('search-input').value.trim();
                const type = document.getElementById('search-type').value;
                const genre = document.getElementById('search-genre').value;
                const year = document.getElementById('search-year').value;

                if (query) {
                    saveRecentSearch(query);
                    document.title = `Search: ${query} — MtDv`;
                    window.history.replaceState({ modalOpen: false, tab: 'search' }, '', `${window.location.pathname}?q=${encodeURIComponent(query)}`);
                } else {
                    document.title = 'MtDv';
                    window.history.replaceState({ modalOpen: false, tab: 'search' }, '', window.location.pathname);
                }

                showGridSkeleton('search-grid');

                let endpoint = '/search/multi';
                let params = `&query=${encodeURIComponent(query)}`;

                if (!query) {
                    endpoint = type === 'tv' ? '/discover/tv' : '/discover/movie';
                    params = '&sort_by=popularity.desc';
                    if (genre) params += `&with_genres=${genre}`;
                    if (year) {
                        if (type === 'tv') params += `&first_air_date_year=${year}`;
                        else params += `&primary_release_year=${year}`;
                    }
                }

                const data = await fetchTMDB(endpoint, params);
                let results = data?.results || [];

                if (type !== 'all') results = results.filter(i => (i.media_type || (i.title ? 'movie' : 'tv')) === type);
                if (genre) results = results.filter(i => i.genre_ids && i.genre_ids.includes(parseInt(genre)));

                renderGrid(results, 'search-grid');
            }, 400);
        }

        let renderedCardKeys = {};

        function renderGrid(items, targetId, append = false) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                if (!append) container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-16 text-xs space-y-2"><i class="fa-regular fa-folder-open text-2xl text-slate-500"></i><p>No content found.</p></div>`;
                return;
            }

            if (!append) renderedCardKeys[targetId] = new Set();
            if (!renderedCardKeys[targetId]) renderedCardKeys[targetId] = new Set();
            const seenKeys = renderedCardKeys[targetId];

            const html = items.map(item => {
                const type = item.media_type || (item.title ? 'movie' : 'tv');
                const cardKey = `${type}_${item.id}`;
                if (seenKeys.has(cardKey)) return ''; // duplicate across pages — skip
                seenKeys.add(cardKey);

                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : '';
                const releaseTime = date !== 'N/A' ? new Date(date).getTime() : 0;
                const isNew = releaseTime > 0 && releaseTime <= Date.now() && (Date.now() - releaseTime) < (45 * 24 * 60 * 60 * 1000);

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="card-solid rounded-2xl overflow-hidden transition duration-300 cursor-pointer flex flex-col group relative">
                        <div class="relative aspect-[2/3] bg-[#060608] overflow-hidden">
                            <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-2 right-2 bg-[#060608]/90 text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1 border border-indigo-500/20 shadow-md">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                            ${isNew ? `<span class="hidden lg:flex absolute bottom-2 left-2 bg-white text-black text-[9px] font-black px-2 py-0.5 rounded-md items-center shadow-md">NEW</span>` : ''}
                        </div>
                        <div class="p-2.5 flex flex-col justify-between flex-grow">
                            <h3 class="text-xs font-semibold text-slate-100 line-clamp-1">${title}</h3>
                            <div class="flex justify-between items-center text-[10px] text-slate-400 mt-1.5">
                                <span>${year}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (append) container.insertAdjacentHTML('beforeend', html);
            else container.innerHTML = html;
        }

        async function openDetails(type, id) {
            sessionStorage.setItem('mtdv_active_tab', currentTab);
            sessionStorage.setItem('mtdv_active_category', currentCategory);

            const newUrl = `${window.location.pathname}?type=${type}&id=${id}`;
            window.history.pushState({ modalOpen: true, tab: currentTab, type, id }, '', newUrl);

            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            stopDetailBackdropRotation();

            content.innerHTML = `<div class="p-16 text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-white mb-3"></i><p class="text-xs">Loading details...</p></div>`;

            // Load the main details independently. Optional title-logo fetching must never
            // block the details page. If the combined request fails, fall back to the basic
            // details endpoint so the page can still open.
            let data = await fetchTMDB(
                `/${type}/${id}`,
                `&append_to_response=credits,watch/providers,images,videos,${type === 'movie' ? 'release_dates' : 'content_ratings'}&include_image_language=en,hi,null&include_video_language=en,hi,null`
            );

            if (!data) {
                data = await fetchTMDB(`/${type}/${id}`);
            }

            if (!data) {
                content.innerHTML = `<div class="p-12 text-center text-slate-400 text-xs"><i class="fa-solid fa-triangle-exclamation text-amber-400 text-2xl mb-3"></i><p>Details could not be loaded.</p><button onclick="location.reload()" class="mt-4 px-4 py-2 rounded-xl bg-white/10 border border-white/15 text-white text-xs font-semibold">Retry</button></div>`;
                return;
            }

            // TV series use aggregate credits so cast from different seasons is not lost.
            if (type === 'tv') {
                const aggregateCredits = await fetchTMDB(`/tv/${id}/aggregate_credits`);
                if (aggregateCredits) data.credits = aggregateCredits;
            }

            // Title logo is optional. Start rendering without it, then fill it in when available.
            let logoUrl = null;

            const title = data.title || data.name;
            document.title = `${title} — MtDv`;
            const titleSlug = title.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            window.history.replaceState({ modalOpen: true, tab: currentTab, type, id }, '', `${window.location.pathname}?type=${type}&id=${id}&title=${encodeURIComponent(titleSlug)}`);
            const backdrop = data.backdrop_path
                ? `${BACKDROP_URL}${data.backdrop_path}`
                : (data.poster_path ? `${IMG_URL}${data.poster_path}` : '');
            // 16:9 backdrop slideshow — landscape TMDB backdrops only, best-rated first, capped at 8
            const backdropList = (data.images?.backdrops || [])
                .filter(b => b.iso_639_1 === null || b.iso_639_1 === 'en')
                .sort((a, b) => b.vote_average - a.vote_average)
                .slice(0, 8)
                .map(b => `${BACKDROP_URL}${b.file_path}`);
            if (backdropList.length === 0) backdropList.push(backdrop);
            if (!backdropList.includes(backdrop)) backdropList.unshift(backdrop);
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const releaseDate = data.release_date || data.first_air_date || 'N/A';
            const releaseYear = releaseDate !== 'N/A' ? releaseDate.split('-')[0] : 'N/A';
            const cast = data.credits?.cast?.slice(0, 10) || [];
            const providers = Array.from(new Map(
                ((data['watch/providers']?.results?.IN?.flatrate) || [])
                    .filter(p => p && p.logo_path)
                    .map(p => [p.provider_id || p.provider_name, p])
            ).values());
            const validSeasons = (data.seasons || []).filter(s => s.season_number > 0);
            const hasEpisodesTab = type === 'tv' && validSeasons.length > 0;

            // Desktop extras: full cast, media galleries, chips, overview length
            const allCast = data.credits?.cast || [];
            const videoOrder = ['Trailer', 'Teaser', 'Clip', 'Featurette', 'Behind the Scenes', 'Bloopers'];
            const videosList = (data.videos?.results || [])
                .filter(v => v.site === 'YouTube')
                .sort((a, b) => {
                    const ia = videoOrder.indexOf(a.type), ib = videoOrder.indexOf(b.type);
                    return ((ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib)) || ((b.official ? 1 : 0) - (a.official ? 1 : 0));
                })
                .slice(0, 24);
            const mediaSets = {
