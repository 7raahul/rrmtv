<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse - Modern Streaming Discovery</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#08090c',
                            card: '#12141c',
                            navBg: '#181a24',
                            pillBorder: '#282c3c',
                            accent: '#6366f1',
                            accentHover: '#4f46e5',
                            gold: '#fbbf24',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #08090c;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .glass-pill {
            background: rgba(22, 25, 36, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .skeleton {
            background: linear-gradient(90deg, #12141c 25%, #1d212e 50%, #12141c 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pt-24 pb-10">

    <!-- FLOATING TOP PILL NAVIGATION (IMAGE 1 & 2 FIXED) -->

        <div class="glass-pill rounded-full p-1.5 flex items-center justify-between w-full max-w-lg transition-all duration-300">
            <!-- Nav Item: Home -->
            <button onclick="navTo('home')" id="pill-home" class="nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-white bg-white/10 transition-all duration-300">
                <i class="fa-solid fa-house text-sm sm:text-base"></i>
                <span class="text-[11px] sm:text-xs">Home</span>
            </button>

            <!-- Nav Item: Movies -->
            <button onclick="navTo('movie')" id="pill-movie" class="nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-white transition-all duration-300">
                <i class="fa-solid fa-clapperboard text-sm sm:text-base"></i>
                <span class="text-[11px] sm:text-xs">Movies</span>
            </button>

            <!-- Nav Item: TV Shows -->
            <button onclick="navTo('tv')" id="pill-tv" class="nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-white transition-all duration-300">
                <i class="fa-solid fa-tv text-sm sm:text-base"></i>
                <span class="text-[11px] sm:text-xs">TV Shows</span>
            </button>

            <!-- Nav Item: Search Overlay Toggle -->
            <button onclick="toggleSearchModal(true)" id="pill-search" class="nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-white transition-all duration-300">
                <i class="fa-solid fa-magnifying-glass text-sm sm:text-base"></i>
                <span class="text-[11px] sm:text-xs">Search</span>

        </div>
    </header>

    <!-- SEARCH OVERLAY MODAL -->

            <div class="flex items-center justify-between">

                    <i class="fa-solid fa-play-circle text-2xl"></i> StreamPulse
                </div>
                <button onclick="toggleSearchModal(false)" class="w-10 h-10 rounded-full bg-white/10 text-white flex items-center justify-center hover:bg-white/20 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="Search movies, TV shows, actors..."

                <button id="search-clear" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white" onclick="clearSearch()">

            </div>

            <!-- Recent Searches Tags -->

        </div>
    </div>

    <!-- MAIN APP CONTENT CONTAINER -->
    <main class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 space-y-8">

        <!-- Hero Spotlight Carousel (Home Only) -->

            <div class="relative z-10 p-6 sm:p-10 max-w-3xl space-y-3">
                <div class="flex items-center gap-2">
                    <span id="hero-type" class="bg-indigo-600/90 backdrop-blur-md text-white text-[10px] font-bold px-2.5 py-1 rounded-md uppercase tracking-wider">Spotlight</span>
                    <span id="hero-rating" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs font-bold px-2 py-0.5 rounded flex items-center gap-1">
                        <i class="fa-solid fa-star text-[10px]"></i> 0.0
                    </span>
                </div>
                <h1 id="hero-title" class="text-2xl sm:text-4xl md:text-5xl font-black text-white leading-tight">Loading Featured...</h1>
                <p id="hero-overview" class="text-xs sm:text-sm text-gray-300 line-clamp-3 leading-relaxed max-w-2xl"></p>
                <div class="pt-2 flex items-center gap-3">
                    <button id="hero-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-2.5 rounded-xl text-xs sm:text-sm flex items-center gap-2 transition shadow-lg shadow-indigo-600/30">
                        <i class="fa-solid fa-circle-info"></i> More Details

        </section>

        <!-- Dynamic Horizontal Filters Bar -->

            <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar py-1">

                <!-- Genre Select -->

                    <option value="">All Genres</option>

                <!-- Year Select -->

                </label>

        <!-- Main Content Heading -->
        <div class="flex items-center justify-between">
            <h2 id="section-heading" class="text-lg sm:text-2xl font-bold text-white flex items-center gap-2">
                <span class="w-2 h-6 bg-indigo-500 rounded-full inline-block"></span> Trending Now

            <span id="result-count" class="text-xs text-gray-400"></span>
        </div>

        <!-- Content Grid -->
        <div id="content-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Skeletons generated dynamically -->
        </div>

        <!-- Infinite Scroll / Load More -->
        <div class="flex justify-center pt-6">
            <button id="load-more-btn" onclick="loadNextPage()" class="hidden bg-brand-card hover:bg-brand-pillBorder border border-brand-pillBorder text-white text-xs sm:text-sm font-semibold px-8 py-3 rounded-xl transition shadow-lg">

        <div class="bg-brand-card border border-brand-pillBorder rounded-3xl max-w-4xl w-full max-h-[92vh] overflow-y-auto hide-scrollbar relative text-gray-200 shadow-2xl">

                            <span id="modal-rating" class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-0.5 rounded font-bold"></span>
                            <span id="modal-year" class="text-gray-300 font-medium"></span>
                            <span id="modal-runtime" class="text-gray-400"></span>

                        <h2 id="modal-title" class="text-2xl sm:text-3xl font-black text-white"></h2>

                        </div>
                        <div>
                            <span class="text-gray-400 block">Budget / Revenue</span>
                            <span id="modal-finance" class="font-semibold text-white">-</span>
                        </div>
                        <div>
                            <span class="text-gray-400 block">Production</span>
                            <span id="modal-prod" class="font-semibold text-white line-clamp-1">-</span>
                        </div>

                    <div class="space-y-2">

                        <select id="season-selector" onchange="loadSeasonEpisodes()" class="bg-brand-dark text-white border border-brand-pillBorder text-xs rounded-xl px-3 py-1.5 outline-none">

            <div class="flex flex-col sm:flex-row gap-6">

        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Notification</span>
    </div>

    <!-- Core Application Logic -->
    <script>
        const TMDB_API_KEY = '0d516ae53b334d92b86cfc7c958d192f';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/original';

        let state = {
            currentTab: 'home',
            page: 1,
            totalPages: 1,
            isLoading: false,
            searchQuery: '',
            filters: {
                category: 'trending',
                genre: '',
                year: '',
                indiaPriority: false
            },
            genres: [],
            recentSearches: JSON.parse(localStorage.getItem('recentSearches') || '[]'),
            currentDetailsData: null
        };

        const grid = document.getElementById('content-grid');
        const searchInput = document.getElementById('search-input');
        const loadMoreBtn = document.getElementById('load-more-btn');

        window.addEventListener('DOMContentLoaded', () => {
            initApp();
            setupSearch();
            setupKeyboardNav();
            handleURLParams();
        });

        async function initApp() {
            await fetchGenres();
            populateYearFilter();
            renderRecentSearches();
            loadHomeHero();
            fetchContent();
        }

        // NAVIGATION & ACTIVE TAB UI
        function navTo(tab) {
            state.currentTab = tab;
            state.page = 1;

            ['home', 'movie', 'tv'].forEach(t => {
                const btn = document.getElementById(`pill-${t}`);
                if (t === tab) {
                    btn.className = "nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-white bg-white/10 transition-all duration-300";
                } else {
                    btn.className = "nav-pill-btn flex-1 py-2 px-3 rounded-full flex flex-col sm:flex-row items-center justify-center gap-1.5 text-xs font-semibold text-gray-400 hover:text-white transition-all duration-300";
                }
            });

            const heroSection = document.getElementById('hero-section');
            if (tab === 'home') {
                heroSection.classList.remove('hidden');
                document.getElementById('india-ott-container').classList.remove('hidden');
            } else {
                heroSection.classList.add('hidden');
                document.getElementById('india-ott-container').classList.add('hidden');
            }

            updateHeading();
            fetchContent();
            window.history.pushState({ tab }, '', `?tab=${tab}`);
        }

        function toggleSearchModal(show) {
            const modal = document.getElementById('search-overlay');
            if (show) {
                modal.classList.remove('hidden');
                searchInput.focus();
            } else {
                modal.classList.add('hidden');
            }
        }

        function updateHeading() {
            const heading = document.getElementById('section-heading');
            if (state.searchQuery) {
                heading.innerHTML = `<span class="w-2 h-6 bg-indigo-500 rounded-full inline-block"></span> Results for "${state.searchQuery}"`;
            } else if (state.currentTab === 'movie') {
                heading.innerHTML = `<span class="w-2 h-6 bg-indigo-500 rounded-full inline-block"></span> Explore Movies`;
            } else if (state.currentTab === 'tv') {
                heading.innerHTML = `<span class="w-2 h-6 bg-indigo-500 rounded-full inline-block"></span> Explore TV Shows`;
            } else {
                heading.innerHTML = `<span class="w-2 h-6 bg-indigo-500 rounded-full inline-block"></span> Trending Now`;
            }
        }

        // API CONTENT FETCH
        async function fetchContent(append = false) {
            if (state.isLoading) return;
            state.isLoading = true;

            if (!append) renderSkeletons();

            try {
                let url = '';
                const { category, genre, year, indiaPriority } = state.filters;

                if (state.searchQuery) {
                    url = `${BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(state.searchQuery)}&page=${state.page}`;
                } else if (state.currentTab === 'movie') {
                    url = `${BASE_URL}/discover/movie?api_key=${TMDB_API_KEY}&page=${state.page}&sort_by=${getSortParam(category)}`;
                    if (genre) url += `&with_genres=${genre}`;
                    if (year) url += `&primary_release_year=${year}`;
                } else if (state.currentTab === 'tv') {
                    url = `${BASE_URL}/discover/tv?api_key=${TMDB_API_KEY}&page=${state.page}&sort_by=${getSortParam(category)}`;
                    if (genre) url += `&with_genres=${genre}`;
                    if (year) url += `&first_air_date_year=${year}`;
                    if (indiaPriority) url += `&with_origin_country=IN`;
                } else {
                    url = `${BASE_URL}/trending/all/day?api_key=${TMDB_API_KEY}&page=${state.page}`;
                }

                const res = await fetch(url);
                const data = await res.json();

                state.totalPages = data.total_pages || 1;
                document.getElementById('result-count').textContent = `Page ${state.page} of ${state.totalPages}`;

                renderGrid(data.results || [], append);
                
                loadMoreBtn.classList.toggle('hidden', state.page >= state.totalPages);

            } catch (err) {
                console.error("API Error:", err);
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">Unable to load data. Please try again.</div>`;
            } finally {
                state.isLoading = false;
            }
        }

        function getSortParam(cat) {
            switch(cat) {
                case 'popular': return 'popularity.desc';
                case 'top_rated': return 'vote_average.desc';
                case 'now_playing': return 'primary_release_date.desc';
                default: return 'popularity.desc';
            }
        }

        // HERO CAROUSEL
        async function loadHomeHero() {
            try {
                const res = await fetch(`${BASE_URL}/trending/all/week?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const item = data.results?.[0];
                if (!item) return;

                document.getElementById('hero-backdrop').style.backgroundImage = `url(${BACKDROP_URL}${item.backdrop_path})`;
                document.getElementById('hero-title').textContent = item.title || item.name;
                document.getElementById('hero-overview').textContent = item.overview;
                document.getElementById('hero-rating').innerHTML = `<i class="fa-solid fa-star text-[10px]"></i> ${item.vote_average?.toFixed(1) || '0.0'}`;
                document.getElementById('hero-type').textContent = item.media_type || 'Featured';
                
                document.getElementById('hero-btn').onclick = () => openDetails(item.id, item.media_type || 'movie');
            } catch(e) { console.error(e); }
        }

        // RENDER CARDS
        function renderGrid(items, append = false) {
            if (!append) grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-gray-400">No content found matching query.</div>`;
                return;
            }

            items.forEach(item => {
                if (!item.poster_path && !item.backdrop_path) return;
                
                const type = item.media_type || (state.currentTab === 'tv' ? 'tv' : 'movie');
                const title = item.title || item.name;
                const year = (item.release_date || item.first_air_date || '').split('-')[0];
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';

                const card = document.createElement('div');
                card.className = "group relative bg-brand-card border border-brand-pillBorder rounded-2xl overflow-hidden cursor-pointer transition transform hover:-translate-y-1.5 hover:shadow-2xl hover:border-indigo-500/50 flex flex-col";
                card.onclick = () => openDetails(item.id, type);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] overflow-hidden bg-brand-dark">
                        <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                        <div class="absolute top-2 right-2 bg-black/70 backdrop-blur-md border border-white/10 px-2 py-0.5 rounded-md text-[11px] font-bold text-amber-400 flex items-center gap-1">
                            <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                        </div>
                        <div class="absolute top-2 left-2 bg-indigo-600/90 text-white font-bold text-[9px] px-1.5 py-0.5 rounded uppercase tracking-wider">
                            ${type}
                        </div>
                    </div>
                    <div class="p-3 flex flex-col justify-between flex-grow">
                        <h3 class="text-xs sm:text-sm font-bold text-white line-clamp-1 group-hover:text-indigo-400 transition">${title}</h3>
                        <div class="flex items-center justify-between text-[11px] text-gray-400 mt-1">
                            <span>${year || 'N/A'}</span>
                            <span class="hover:text-white"><i class="fa-solid fa-circle-info"></i> Details</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderSkeletons() {
            grid.innerHTML = Array(10).fill(0).map(() => `
                <div class="bg-brand-card border border-brand-pillBorder rounded-2xl overflow-hidden animate-pulse">
                    <div class="aspect-[2/3] skeleton"></div>
                    <div class="p-3 space-y-2">
                        <div class="h-4 skeleton rounded w-3/4"></div>
                        <div class="h-3 skeleton rounded w-1/2"></div>
                    </div>
                </div>
            `).join('');
        }

        // SEARCH CONTROL
        let searchTimeout = null;
        function setupSearch() {
            searchInput.addEventListener('input', (e) => {
                const val = e.target.value.trim();
                document.getElementById('search-clear').classList.toggle('hidden', !val);

                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    state.searchQuery = val;
                    state.page = 1;
                    if (val) saveRecentSearch(val);
                    updateHeading();
                    fetchContent();
                }, 500);
            });
        }

        function clearSearch() {
            searchInput.value = '';
            state.searchQuery = '';
            document.getElementById('search-clear').classList.add('hidden');
            updateHeading();
            fetchContent();
        }

        function saveRecentSearch(q) {
            if (!state.recentSearches.includes(q)) {
                state.recentSearches.unshift(q);
                if (state.recentSearches.length > 5) state.recentSearches.pop();
                localStorage.setItem('recentSearches', JSON.stringify(state.recentSearches));
                renderRecentSearches();
            }
        }

        function renderRecentSearches() {
            const container = document.getElementById('recent-searches-container');
            const tags = document.getElementById('recent-tags');
            if (state.recentSearches.length === 0) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            tags.innerHTML = state.recentSearches.map(q => `
                <span onclick="applyRecentSearch('${q}')" class="bg-brand-card border border-brand-pillBorder hover:border-indigo-500 text-gray-300 text-xs px-3 py-1 rounded-full cursor-pointer transition">
                    ${q}
                </span>
            `).join('');
        }

        function applyRecentSearch(q) {
            searchInput.value = q;
            state.searchQuery = q;
            document.getElementById('search-clear').classList.remove('hidden');
            updateHeading();
            fetchContent();
        }

        // FILTERS SETUP
        async function fetchGenres() {
            try {
                const res = await fetch(`${BASE_URL}/genre/movie/list?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                state.genres = data.genres || [];
                const select = document.getElementById('filter-genre');
                select.innerHTML = `<option value="">All Genres</option>` + 
                    state.genres.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
            } catch(e) { console.error(e); }
        }

        function populateYearFilter() {
            const select = document.getElementById('filter-year');
            const currentYear = new Date().getFullYear();
            let options = `<option value="">All Years</option>`;
            for (let y = currentYear; y >= 1980; y--) {
                options += `<option value="${y}">${y}</option>`;
            }
            select.innerHTML = options;
        }

        function applyFilters() {
            state.filters.category = document.getElementById('filter-category').value;
            state.filters.genre = document.getElementById('filter-genre').value;
            state.filters.year = document.getElementById('filter-year').value;
            state.filters.indiaPriority = document.getElementById('filter-india').checked;
            state.page = 1;
            fetchContent();
        }

        function loadNextPage() {
            if (state.page < state.totalPages) {
                state.page++;
                fetchContent(true);
            }
        }

        // DETAILS MODAL
        async function openDetails(id, type = 'movie') {
            const modal = document.getElementById('detail-modal');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits,videos,images,watch/providers`);
                const data = await res.json();
                state.currentDetailsData = { ...data, media_type: type };

                document.getElementById('modal-backdrop').style.backgroundImage = data.backdrop_path ? `url(${BACKDROP_URL}${data.backdrop_path})` : '';
                document.getElementById('modal-poster').src = data.poster_path ? `${IMG_URL}${data.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                document.getElementById('modal-title').textContent = data.title || data.name;
                document.getElementById('modal-tagline').textContent = data.tagline ? `"${data.tagline}"` : '';
                document.getElementById('modal-type-badge').textContent = type;
                document.getElementById('modal-rating').innerHTML = `<i class="fa-solid fa-star"></i> ${data.vote_average?.toFixed(1) || 'N/A'}`;
                document.getElementById('modal-year').textContent = (data.release_date || data.first_air_date || '').split('-')[0];
                document.getElementById('modal-runtime').textContent = data.runtime ? `${data.runtime} mins` : (data.episode_run_time?.[0] ? `${data.episode_run_time[0]} mins` : '');

                document.getElementById('modal-overview').textContent = data.overview || 'No overview available.';
                document.getElementById('modal-genres').innerHTML = (data.genres || []).map(g => `<span class="bg-brand-dark text-gray-300 border border-brand-pillBorder px-2.5 py-1 rounded-lg text-xs font-semibold">${g.name}</span>`).join('');
                document.getElementById('modal-status').textContent = data.status || '-';
                document.getElementById('modal-lang').textContent = data.original_language || '-';
                document.getElementById('modal-finance').textContent = data.budget ? `$${(data.budget / 1000000).toFixed(1)}M` : '-';
                document.getElementById('modal-prod').textContent = data.production_companies?.[0]?.name || '-';

                const providers = data['watch/providers']?.results?.IN || data['watch/providers']?.results?.US;
                const provContainer = document.getElementById('modal-providers');
                if (providers && (providers.flatrate || providers.rent)) {
                    const list = providers.flatrate || providers.rent || [];
                    provContainer.innerHTML = list.map(p => `
                        <div class="flex items-center gap-1.5 bg-brand-dark px-2.5 py-1 rounded-xl border border-brand-pillBorder">
                            <img src="${IMG_URL}${p.logo_path}" class="w-4 h-4 rounded-full">
                            <span class="text-white font-medium">${p.provider_name}</span>
                        </div>
                    `).join('');
                } else {
                    provContainer.innerHTML = `<span class="text-gray-500">No watch provider info found.</span>`;
                }

                const episodeTabBtn = document.getElementById('tab-btn-episodes');
                if (type === 'tv' && data.seasons?.length) {
                    episodeTabBtn.classList.remove('hidden');
                    populateSeasons(data.seasons, id);
                } else {
                    episodeTabBtn.classList.add('hidden');
                }

                renderCast(data.credits?.cast || []);
                renderMedia(data.videos?.results || [], data.images?.backdrops || []);
                switchTab('overview');

                window.history.pushState({}, '', `?type=${type}&id=${id}`);

            } catch (e) { console.error(e); }
        }

        function switchTab(tabName) {
            ['overview', 'episodes', 'cast', 'media'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                const content = document.getElementById(`tab-${t}`);
                if (btn && content) {
                    if (t === tabName) {
                        btn.className = 'py-3 border-b-2 border-indigo-500 text-indigo-400 font-bold';
                        content.classList.remove('hidden');
                    } else {
                        btn.className = 'py-3 border-b-2 border-transparent text-gray-400 hover:text-white';
                        content.classList.add('hidden');
                    }
                }
            });
        }

        // SEASONS & EPISODES
        function populateSeasons(seasons, tvId) {
            const select = document.getElementById('season-selector');
            select.innerHTML = seasons.map(s => `<option value="${s.season_number}">${s.name} (${s.episode_count} Ep)</option>`).join('');
            select.dataset.tvid = tvId;
            loadSeasonEpisodes();
        }

        async function loadSeasonEpisodes() {
            const select = document.getElementById('season-selector');
            const tvId = select.dataset.tvid;
            const seasonNum = select.value;
            const container = document.getElementById('episodes-list');

            container.innerHTML = `<div class="text-xs text-gray-400">Loading episodes...</div>`;

            try {
                const res = await fetch(`${BASE_URL}/tv/${tvId}/season/${seasonNum}?api_key=${TMDB_API_KEY}`);
                const data = await res.json();

                container.innerHTML = (data.episodes || []).map(ep => `
                    <div class="flex flex-col sm:flex-row gap-4 bg-brand-dark/40 p-3 rounded-2xl border border-brand-pillBorder/60 items-start">
                        <img src="${ep.still_path ? IMG_URL + ep.still_path : 'https://via.placeholder.com/300x170?text=No+Image'}" 
                             class="w-full sm:w-36 aspect-video object-cover rounded-xl">
                        <div class="space-y-1 text-xs">
                            <div class="flex items-center gap-2">
                                <span class="text-indigo-400 font-bold">E${ep.episode_number}</span>
                                <h5 class="font-bold text-white text-sm">${ep.name}</h5>
                            </div>
                            <p class="text-gray-400 line-clamp-2">${ep.overview || 'No overview available.'}</p>
                            <div class="text-[10px] text-gray-500 pt-1">Air Date: ${ep.air_date || 'N/A'} • ⭐ ${ep.vote_average?.toFixed(1) || 'N/A'}</div>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // CAST & ACTOR MODAL
        function renderCast(cast) {
            const container = document.getElementById('cast-grid');
            container.innerHTML = cast.slice(0, 8).map(person => `
                <div onclick="openActorProfile(${person.id})" class="bg-brand-dark/50 p-2.5 rounded-2xl border border-brand-pillBorder/50 text-center cursor-pointer hover:border-indigo-500 transition group">
                    <img src="${person.profile_path ? IMG_URL + person.profile_path : 'https://via.placeholder.com/150x200?text=No+Photo'}" 
                         class="w-16 h-16 rounded-full object-cover mx-auto mb-2 group-hover:scale-105 transition">
                    <h5 class="text-xs font-bold text-white group-hover:text-indigo-400 line-clamp-1">${person.name}</h5>
                    <p class="text-[10px] text-gray-400 line-clamp-1">${person.character || 'Actor'}</p>
                </div>
            `).join('');
        }

        async function openActorProfile(personId) {
            const modal = document.getElementById('actor-modal');
            modal.classList.remove('hidden');

            try {
                const res = await fetch(`${BASE_URL}/person/${personId}?api_key=${TMDB_API_KEY}&append_to_response=combined_credits`);
                const data = await res.json();

                document.getElementById('actor-img').src = data.profile_path ? `${IMG_URL}${data.profile_path}` : 'https://via.placeholder.com/150x200?text=No+Photo';
                document.getElementById('actor-name').textContent = data.name;
                document.getElementById('actor-dept').textContent = data.known_for_department;
                document.getElementById('actor-bio').textContent = data.biography || 'No biography available.';

                const knownFor = (data.combined_credits?.cast || []).slice(0, 4);
                document.getElementById('actor-known-grid').innerHTML = knownFor.map(item => `
                    <div onclick="closeModal('actor-modal'); openDetails(${item.id}, '${item.media_type}')" class="cursor-pointer group">
                        <img src="${item.poster_path ? IMG_URL + item.poster_path : 'https://via.placeholder.com/150x200?text=No+Poster'}" class="rounded-xl mb-1 group-hover:scale-105 transition">
                        <p class="text-[10px] font-bold text-white line-clamp-1">${item.title || item.name}</p>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // MEDIA & TRAILERS
        function renderMedia(videos, backdrops) {
            const videoContainer = document.getElementById('video-list');
            const galleryContainer = document.getElementById('gallery-grid');

            const trailers = videos.filter(v => v.site === 'YouTube' && (v.type === 'Trailer' || v.type === 'Teaser')).slice(0, 2);
            if (trailers.length) {
                videoContainer.innerHTML = trailers.map(v => `
                    <div class="aspect-video rounded-xl overflow-hidden border border-brand-pillBorder">
                        <iframe class="w-full h-full" src="https://www.youtube.com/embed/${v.key}" frameborder="0" allowfullscreen></iframe>
                    </div>
                `).join('');
            } else {
                videoContainer.innerHTML = `<p class="text-xs text-gray-500">No trailers found.</p>`;
            }

            if (backdrops.length) {
                galleryContainer.innerHTML = backdrops.slice(0, 6).map(bg => `
                    <img src="${IMG_URL}${bg.file_path}" onclick="openLightbox('${BACKDROP_URL}${bg.file_path}')" 
                         class="rounded-xl cursor-pointer hover:opacity-80 transition object-cover border border-brand-pillBorder">
                `).join('');
            } else {
                galleryContainer.innerHTML = `<p class="text-xs text-gray-500">No gallery images.</p>`;
            }
        }

        // UTILS & MODALS
        function openLightbox(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox-modal').classList.remove('hidden');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
            if (modalId === 'detail-modal') {
                document.body.style.overflow = 'auto';
                window.history.pushState({}, '', `?tab=${state.currentTab}`);
            }
        }

        function setupKeyboardNav() {
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal('detail-modal');
                    closeModal('actor-modal');
                    closeModal('lightbox-modal');
                    toggleSearchModal(false);
                }
            });
        }

        function handleURLParams() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type');
            const id = params.get('id');
            const tab = params.get('tab');

            if (tab) navTo(tab);
            if (type && id) openDetails(id, type);
        }

        function shareLink() {
            navigator.clipboard.writeText(window.location.href);
            showToast('Details link copied!');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
