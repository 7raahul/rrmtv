<!DOCTYPE html>
<html lang="hi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CineDB</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Claude-style warm palette: remaps indigo/violet tokens site-wide -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { 50:'#FBF4F0',100:'#F5E6DE',200:'#EACDBD',300:'#DEA98D',400:'#D18B67',500:'#CC785C',600:'#B35F44',700:'#8F4934',800:'#6B3627',900:'#47241A',950:'#2E170F' },
                        violet: { 200:'#E8C4A0',300:'#DDA878',400:'#C98A54',500:'#B3703C',600:'#96592E',700:'#7A4726' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .glass-header {
            background: rgba(26, 21, 18, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(204, 120, 92, 0.2);
        }
        .glass-card {
            background: rgba(41, 32, 27, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(204, 120, 92, 0.18);
        }
        .glass-card:active { transform: scale(0.97); }
        .glass-modal {
            background: rgba(26, 21, 18, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, rgba(41, 32, 27, 0.8) 25%, rgba(179, 95, 68, 0.5) 50%, rgba(41, 32, 27, 0.8) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-[#1A1512] text-stone-100 font-sans antialiased min-h-screen pb-24 select-none bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-indigo-950/40 via-[#1A1512] to-[#1A1512]">

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Fixed Header -->
    <header class="sticky top-0 z-40 glass-header px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('home')">
            <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/30 border border-white/20">
                <i class="fa-solid fa-play text-stone-950 text-xs font-black"></i>
            </div>
            <span class="text-2xl font-black tracking-wider text-white leading-none">Cine<span class="text-indigo-400">DB</span></span>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="openAuthModal('signin')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-stone-300 hover:text-white transition">Sign In</button>
            <button onclick="openAuthModal('signup')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 border border-indigo-400/30 hover:opacity-95 transition">Sign Up</button>
        </div>
    </header>

    <!-- Main Content Tab Area -->
    <main class="p-4 max-w-7xl mx-auto space-y-5">

        <!-- HOME TAB -->
        <section id="tab-home" class="space-y-4">
            
            <!-- Category & Country Bar -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5">
                <button onclick="changeCategoryFilter('all', this)" class="cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 whitespace-nowrap border border-indigo-400/30">All</button>
                <button onclick="changeCategoryFilter('movie', this)" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10">Movies</button>
                <button onclick="changeCategoryFilter('tv', this)" class="cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10">TV Shows</button>

                <!-- MODERN COUNTRY SELECTOR DROPDOWN -->
                <div class="relative flex-shrink-0 flex items-center glass-card rounded-2xl px-3 py-1.5 border border-indigo-400/30">
                    <i class="fa-solid fa-earth-americas text-indigo-400 text-xs mr-2 pointer-events-none"></i>
                    <select id="country-select" onchange="changeCountryFilter(this.value)" class="bg-transparent text-indigo-200 text-xs font-semibold focus:outline-none cursor-pointer pr-1">
                        <option value="ALL" class="bg-[#241C16] text-white">All Countries (Global)</option>
                        <option value="IN" class="bg-[#241C16] text-white">🇮🇳 India</option>
                        <option value="US" class="bg-[#241C16] text-white">🇺🇸 United States</option>
                        <option value="KR" class="bg-[#241C16] text-white">🇰🇷 South Korea</option>
                        <option value="JP" class="bg-[#241C16] text-white">🇯🇵 Japan</option>
                        <option value="GB" class="bg-[#241C16] text-white">🇬🇧 United Kingdom</option>
                        <option value="ES" class="bg-[#241C16] text-white">🇪🇸 Spain</option>
                        <option value="FR" class="bg-[#241C16] text-white">🇫🇷 France</option>
                        <option value="DE" class="bg-[#241C16] text-white">🇩🇪 Germany</option>
                        <option value="TR" class="bg-[#241C16] text-white">🇹🇷 Turkey</option>
                        <option value="CN" class="bg-[#241C16] text-white">🇨🇳 China</option>
                        <option value="CA" class="bg-[#241C16] text-white">🇨🇦 Canada</option>
                        <option value="BR" class="bg-[#241C16] text-white">🇧🇷 Brazil</option>
                        <option value="IT" class="bg-[#241C16] text-white">🇮🇹 Italy</option>
                    </select>
                </div>
            </div>

            <!-- Genre Quick Filters -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="changeGenreFilter('', this)" class="genre-btn active text-[11px] font-medium px-3.5 py-1 rounded-xl bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 whitespace-nowrap">All Genres</button>
                <button onclick="changeGenreFilter('28', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Action</button>
                <button onclick="changeGenreFilter('35', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Comedy</button>
                <button onclick="changeGenreFilter('18', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Drama</button>
                <button onclick="changeGenreFilter('878', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Sci-Fi</button>
                <button onclick="changeGenreFilter('27', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Horror</button>
                <button onclick="changeGenreFilter('16', this)" class="genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap">Animation</button>
            </div>

            <!-- HERO SPOTLIGHT -->
            <div id="hero-container" class="relative rounded-3xl overflow-hidden glass-card border border-indigo-500/20 shadow-2xl aspect-[16/9] w-full flex items-end cursor-pointer group transition duration-500">
                <div class="p-12 text-center w-full text-indigo-300/60 my-auto">
                    <i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i>
                    <p class="text-xs">Loading Spotlight...</p>
                </div>
            </div>

            <div class="flex justify-between items-center pt-2">
                <h2 id="section-title" class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                    Trending Movies & Shows
                </h2>
            </div>

            <!-- Home Media Grid -->
            <div id="home-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>

            <div id="infinite-loader" class="py-6 text-center text-indigo-300/60 text-xs hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-lg text-indigo-400 mb-1"></i>
                <p>Loading more titles...</p>
            </div>
        </section>

        <!-- SEARCH TAB WITH FILTERS -->
        <section id="tab-search" class="hidden space-y-4">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-indigo-400/70"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Search Movies, TV Shows, Cast..." class="w-full glass-card rounded-2xl pl-11 pr-4 py-3.5 text-sm text-stone-100 placeholder-stone-400 focus:outline-none focus:border-indigo-400 transition">
            </div>

            <!-- Search Filters Bar -->
            <div class="grid grid-cols-3 gap-2">
                <select id="search-type" onchange="handleSearch()" class="glass-card text-xs text-indigo-200 rounded-xl p-2.5 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                    <option value="all">All Content</option>
                    <option value="movie">Movies Only</option>
                    <option value="tv">TV Shows Only</option>
                </select>
                <select id="search-genre" onchange="handleSearch()" class="glass-card text-xs text-indigo-200 rounded-xl p-2.5 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                    <option value="">All Genres</option>
                    <option value="28">Action</option>
                    <option value="35">Comedy</option>
                    <option value="18">Drama</option>
                    <option value="878">Sci-Fi</option>
                    <option value="27">Horror</option>
                    <option value="16">Animation</option>
                </select>
                <select id="search-year" onchange="handleSearch()" class="glass-card text-xs text-indigo-200 rounded-xl p-2.5 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                    <option value="">All Years</option>
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024">2024</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022</option>
                    <option value="2020">2020s</option>
                    <option value="2010">2010s</option>
                </select>
            </div>

            <div id="search-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
                <p class="col-span-full text-center text-stone-400 py-12 text-xs">Type query or pick filters to search content...</p>
            </div>
        </section>

        <!-- RANDOM DISCOVERY SEPARATE PAGE -->
        <section id="tab-random" class="hidden space-y-5">
            <div class="glass-card p-5 rounded-3xl space-y-4 border border-indigo-500/30">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-dice text-amber-400 text-xl"></i>
                    <div>
                        <h2 class="text-sm font-bold text-white">Random Title Picker</h2>
                        <p class="text-[11px] text-stone-400">Configure parameters & generate random picks</p>
                    </div>
                </div>

                <!-- Type Selector -->
                <div class="flex gap-2">
                    <button onclick="setRandomType('all', this)" class="rand-type-btn active flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-500 text-white">All</button>
                    <button onclick="setRandomType('movie', this)" class="rand-type-btn flex-1 py-2 rounded-xl text-xs font-semibold glass-card text-indigo-200">Movies</button>
                    <button onclick="setRandomType('tv', this)" class="rand-type-btn flex-1 py-2 rounded-xl text-xs font-semibold glass-card text-indigo-200">TV Shows</button>
                </div>

                <!-- Filters Grid -->
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] text-indigo-300 font-semibold block mb-1">Country</label>
                        <select id="random-country" class="w-full glass-card text-xs text-indigo-200 rounded-xl p-2 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                            <option value="">Global (Any)</option>
                            <option value="IN">🇮🇳 India</option>
                            <option value="US">🇺🇸 USA</option>
                            <option value="KR">🇰🇷 S. Korea</option>
                            <option value="JP">🇯🇵 Japan</option>
                            <option value="GB">🇬🇧 UK</option>
                            <option value="ES">🇪🇸 Spain</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-indigo-300 font-semibold block mb-1">Genre</label>
                        <select id="random-genre" class="w-full glass-card text-xs text-indigo-200 rounded-xl p-2 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                            <option value="">Any Genre</option>
                            <option value="28">Action</option>
                            <option value="35">Comedy</option>
                            <option value="18">Drama</option>
                            <option value="878">Sci-Fi</option>
                            <option value="27">Horror</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-indigo-300 font-semibold block mb-1">Release Year</label>
                        <select id="random-year" class="w-full glass-card text-xs text-indigo-200 rounded-xl p-2 bg-[#241C16] border border-indigo-500/20 focus:outline-none">
                            <option value="">Any Year</option>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                        </select>
                    </div>
                </div>

                <button onclick="executeRandomPick()" class="w-full py-3 rounded-2xl font-bold text-xs bg-gradient-to-r from-amber-500 via-indigo-600 to-violet-600 text-white shadow-xl shadow-indigo-500/20 flex items-center justify-center gap-2 active:scale-95 transition">
                    <i class="fa-solid fa-shuffle text-sm"></i> Roll Random Pick
                </button>
            </div>

            <!-- Random Pick Result Container -->
            <div id="random-result-container">
                <p class="text-center text-stone-400 py-12 text-xs">Click "Roll Random Pick" button to get suggestions!</p>
            </div>
        </section>

        <!-- SCHEDULE / WATCHED LIST TAB -->
        <section id="tab-schedule" class="hidden space-y-4">
            <div class="flex gap-2.5 p-1 glass-card rounded-2xl border border-indigo-500/20">
                <button onclick="switchListSubTab('schedule')" id="subtab-schedule" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 border border-indigo-400/30 flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-calendar-day"></i> Scheduled Plan
                </button>
                <button onclick="switchListSubTab('watched')" id="subtab-watched" class="flex-1 py-2.5 rounded-xl text-xs font-semibold glass-card text-indigo-200 hover:text-white flex items-center justify-center gap-2 transition">
                    <i class="fa-solid fa-circle-check"></i> Watched History
                </button>
            </div>

            <div id="list-schedule-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
            <div id="list-watched-container" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5"></div>
        </section>

    </main>

    <!-- AUTH SIGNIN/SIGNUP MODAL -->
    <div id="auth-modal" class="fixed inset-0 z-[90] glass-modal hidden flex items-center justify-center p-4">
        <div class="glass-card p-6 rounded-3xl max-w-sm w-full space-y-5 border border-indigo-500/30 shadow-2xl relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 w-8 h-8 rounded-xl glass-card flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="flex border-b border-stone-700/60 pb-2 gap-4">
                <button id="auth-tab-signin" onclick="switchAuthMode('signin')" class="text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 pb-1">Sign In</button>
                <button id="auth-tab-signup" onclick="switchAuthMode('signup')" class="text-sm font-bold text-stone-400 hover:text-white pb-1">Sign Up</button>
            </div>

            <form id="form-signin" onsubmit="event.preventDefault(); handleAuthSubmit('signin');" class="space-y-3">
                <div>
                    <label class="text-[11px] text-stone-400 block mb-1">Email Address</label>
                    <input type="email" required placeholder="yourname@gmail.com" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
                </div>
                <div>
                    <label class="text-[11px] text-stone-400 block mb-1">Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 mt-2">Sign In</button>
            </form>

            <form id="form-signup" onsubmit="event.preventDefault(); handleAuthSubmit('signup');" class="hidden space-y-3">
                <div>
                    <label class="text-[11px] text-stone-400 block mb-1">Full Name</label>
                    <input type="text" required placeholder="John Doe" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
                </div>
                <div>
                    <label class="text-[11px] text-stone-400 block mb-1">Email Address</label>
                    <input type="email" required placeholder="yourname@gmail.com" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
                </div>
                <div>
                    <label class="text-[11px] text-stone-400 block mb-1">Create Password</label>
                    <input type="password" required placeholder="••••••••" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 mt-2">Create Account</button>
            </form>
        </div>
    </div>

    <!-- Movie/Show Details Modal -->
    <div id="details-modal" class="fixed inset-0 z-50 glass-modal hidden overflow-y-auto">
        <button onclick="closeModalManual()" class="fixed top-4 right-4 z-50 w-10 h-10 rounded-2xl glass-card flex items-center justify-center text-white border border-indigo-500/30 active:scale-95 transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content" class="max-w-2xl mx-auto pb-28"></div>
    </div>

    <!-- Actor Profile Modal -->
    <div id="actor-modal" class="fixed inset-0 z-[80] glass-modal hidden overflow-y-auto p-4 flex items-center justify-center">
        <div class="glass-card max-w-lg w-full rounded-3xl p-5 relative border border-indigo-500/30 shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar">
            <button onclick="closeActorModal()" class="absolute top-4 right-4 w-8 h-8 rounded-xl glass-card flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="actor-modal-content"></div>
        </div>
    </div>

    <!-- CALENDAR DATE PICKER MODAL -->
    <div id="date-modal" class="fixed inset-0 z-[70] glass-modal hidden flex items-center justify-center p-4">
        <div class="glass-card p-5 rounded-3xl max-w-xs w-full space-y-4 border border-indigo-500/30 shadow-2xl">
            <h3 id="date-modal-title" class="text-sm font-bold text-stone-100 flex items-center gap-2">
                <i class="fa-solid fa-calendar-days text-indigo-400"></i> Select Date
            </h3>
            <p class="text-[11px] text-stone-300">Choose date to add to your list:</p>
            <input type="date" id="custom-date-input" class="w-full bg-[#1A1512] border border-indigo-500/30 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-400">
            <div class="flex gap-2 pt-1">
                <button onclick="closeDateModal()" class="w-1/2 py-2.5 rounded-xl text-xs font-semibold glass-card text-stone-300 hover:text-white">Cancel</button>
                <button onclick="confirmDateSelection()" class="w-1/2 py-2.5 rounded-xl text-xs font-bold bg-indigo-500 hover:bg-indigo-400 text-white shadow-lg shadow-indigo-500/20">Save Date</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-[60] glass-header px-6 py-2.5 flex justify-around items-center border-t border-indigo-500/20">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-indigo-400 transition">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-semibold">Home</span>
        </button>
        <button onclick="switchTab('search')" id="nav-search" class="nav-btn flex flex-col items-center gap-1 text-stone-400 hover:text-indigo-400 transition">
            <i class="fa-solid fa-magnifying-glass text-lg"></i>
            <span class="text-[10px] font-semibold">Search</span>
        </button>
        <button onclick="switchTab('random')" id="nav-random" class="nav-btn flex flex-col items-center gap-1 text-stone-400 hover:text-amber-400 transition">
            <i class="fa-solid fa-dice text-lg"></i>
            <span class="text-[10px] font-semibold">Random</span>
        </button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-btn flex flex-col items-center gap-1 text-stone-400 hover:text-indigo-400 transition">
            <i class="fa-solid fa-calendar-check text-lg"></i>
            <span class="text-[10px] font-semibold">My List</span>
        </button>
    </nav>

    <script>
        const API_KEY = '9c95420163879f1c4726c540b305cbc6';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';

        let currentTab = 'home';
        let currentCategory = 'all'; 
        let currentCountry = 'ALL';
        let currentGenre = '';
        let currentPage = 1;
        let isFetching = false;
        let hasMore = true;
        let searchTimeout = null;

        let selectedRandomType = 'all';
        let heroItems = [];
        let heroIndex = 0;
        let heroTimer = null;
        let pendingItem = null;
        let pendingKey = null;

        document.addEventListener('DOMContentLoaded', () => {
            loadHomeTitles(true);
            setupHistoryState();
            setupInfiniteScroll();
            checkShareableLink();
        });

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-card px-4 py-2.5 rounded-2xl text-xs font-semibold text-white border border-indigo-500/30 shadow-2xl flex items-center gap-2 transform transition-all duration-300 transtone-y-5 opacity-0 pointer-events-auto';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-indigo-400 text-sm"></i> <span>${msg}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('transtone-y-5', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-transtone-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function openAuthModal(mode) {
            switchAuthMode(mode);
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        function switchAuthMode(mode) {
            const isSignIn = mode === 'signin';
            document.getElementById('form-signin').classList.toggle('hidden', !isSignIn);
            document.getElementById('form-signup').classList.toggle('hidden', isSignIn);

            const tabSignIn = document.getElementById('auth-tab-signin');
            const tabSignUp = document.getElementById('auth-tab-signup');

            if (isSignIn) {
                tabSignIn.className = "text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabSignUp.className = "text-sm font-bold text-stone-400 hover:text-white pb-1";
            } else {
                tabSignUp.className = "text-sm font-bold text-indigo-400 border-b-2 border-indigo-400 pb-1";
                tabSignIn.className = "text-sm font-bold text-stone-400 hover:text-white pb-1";
            }
        }

        function handleAuthSubmit(type) {
            closeAuthModal();
            showToast(type === 'signin' ? 'Signed in successfully!' : 'Account created successfully!');
        }

        function checkShareableLink() {
            const params = new URLSearchParams(window.location.search);
            const sharedId = params.get('id');
            const sharedType = params.get('type');
            if (sharedId && sharedType) openDetails(sharedType, sharedId);
        }

        function setupHistoryState() {
            window.history.replaceState({ modalOpen: false, tab: 'home' }, '');
            window.addEventListener('popstate', (e) => {
                const modal = document.getElementById('details-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModalDOM();
                } else if (e.state && e.state.tab) {
                    switchTabDOM(e.state.tab);
                }
            });
        }

        function switchTab(tabName) {
            // Close any open modals first — otherwise the tab switches
            // behind the modal and it looks like the nav button did nothing.
            const detailsModal = document.getElementById('details-modal');
            if (detailsModal && !detailsModal.classList.contains('hidden')) {
                closeModalDOM();
            }
            const actorModal = document.getElementById('actor-modal');
            if (actorModal && !actorModal.classList.contains('hidden')) {
                closeActorModal();
            }

            if (currentTab === tabName && tabName !== 'home') return;
            window.history.pushState({ modalOpen: false, tab: tabName }, '');
            switchTabDOM(tabName);
        }

        function switchTabDOM(tabName) {
            currentTab = tabName;
            ['home', 'search', 'random', 'schedule'].forEach(tab => {
                const tabEl = document.getElementById(`tab-${tab}`);
                const navEl = document.getElementById(`nav-${tab}`);
                
                if (tabEl) tabEl.classList.add('hidden');
                if (navEl) {
                    navEl.classList.remove('text-indigo-400', 'text-amber-400');
                    navEl.classList.add('text-stone-400');
                }
            });

            const activeTabEl = document.getElementById(`tab-${tabName}`);
            const activeNavEl = document.getElementById(`nav-${tabName}`);
            
            if (activeTabEl) activeTabEl.classList.remove('hidden');
            if (activeNavEl) {
                activeNavEl.classList.remove('text-stone-400');
                activeNavEl.classList.add(tabName === 'random' ? 'text-amber-400' : 'text-indigo-400');
            }

            if (tabName === 'schedule') {
                switchListSubTab('schedule');
                renderUserLists();
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function fetchTMDB(endpoint, params = '') {
            const cacheKey = `cinedb_cache_${endpoint}_${params}`;
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) return JSON.parse(cached);

            try {
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}${params}`);
                const data = await res.json();
                if (data) sessionStorage.setItem(cacheKey, JSON.stringify(data));
                return data;
            } catch (err) {
                console.error("API Fetch Error:", err);
                return null;
            }
        }

        async function fetchTitleLogo(type, id) {
            try {
                const data = await fetchTMDB(`/${type}/${id}/images`, '&include_image_language=en,hi,null');
                if (data && data.logos && data.logos.length > 0) {
                    const logo = data.logos.find(l => l.iso_639_1 === 'en' || l.iso_639_1 === 'hi') || data.logos[0];
                    return `${IMG_URL}${logo.file_path}`;
                }
            } catch (e) { console.error(e); }
            return null;
        }

        function changeCategoryFilter(category, btnEl) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn px-4 py-2 rounded-2xl text-xs font-semibold glass-card text-indigo-200 whitespace-nowrap hover:bg-indigo-500/10";
            });
            if (btnEl) btnEl.className = "cat-btn active px-4 py-2 rounded-2xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 whitespace-nowrap border border-indigo-400/30";

            currentCategory = category;
            updateSectionTitle();
            loadHomeTitles(true);
        }

        function changeCountryFilter(countryCode) {
            currentCountry = countryCode;
            updateSectionTitle();
            loadHomeTitles(true);
        }

        function changeGenreFilter(genreId, btnEl) {
            document.querySelectorAll('.genre-btn').forEach(b => {
                b.className = "genre-btn text-[11px] font-medium px-3.5 py-1 rounded-xl glass-card text-stone-300 whitespace-nowrap";
            });
            if (btnEl) btnEl.className = "genre-btn active text-[11px] font-medium px-3.5 py-1 rounded-xl bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 whitespace-nowrap";

            currentGenre = genreId;
            updateSectionTitle();
            loadHomeTitles(true);
        }

        function updateSectionTitle() {
            const titles = { all: "Trending Movies & Shows", movie: "Popular Movies", tv: "Popular TV Shows" };
            let titleText = titles[currentCategory] || "Trending Titles";
            if (currentCountry !== 'ALL') titleText += ` (${currentCountry})`;
            if (currentGenre) titleText += " (Filtered)";
            document.getElementById('section-title').innerHTML = `<span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> ${titleText}`;
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (currentTab !== 'home' || isFetching || !hasMore) return;
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
                    loadHomeTitles(false);
                }
            });
        }

        async function loadHomeTitles(reset = false) {
            if (isFetching) return;
            isFetching = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                showGridSkeleton('home-grid');
            } else {
                document.getElementById('infinite-loader').classList.remove('hidden');
            }

            let endpoint = '/trending/all/day';
            let params = `&page=${currentPage}`;

            if (currentCountry !== 'ALL') {
                endpoint = currentCategory === 'tv' ? '/discover/tv' : '/discover/movie';
                params += `&with_origin_country=${currentCountry}&sort_by=popularity.desc`;
                if (currentGenre) params += `&with_genres=${currentGenre}`;
            } else {
                if (currentCategory === 'movie') endpoint = '/trending/movie/day';
                else if (currentCategory === 'tv') endpoint = '/trending/tv/day';

                if (currentGenre !== '') {
                    endpoint = currentCategory === 'tv' ? '/discover/tv' : '/discover/movie';
                    params += `&with_genres=${currentGenre}&sort_by=popularity.desc`;
                }
            }

            const data = await fetchTMDB(endpoint, params);
            document.getElementById('infinite-loader').classList.add('hidden');

            if (data && data.results && data.results.length > 0) {
                if (reset) {
                    heroItems = data.results.slice(0, 5);
                    heroIndex = 0;
                    startHeroAutoSlide();
                }
                renderGrid(data.results, 'home-grid', !reset);
                currentPage++;
                if (currentPage > data.total_pages) hasMore = false;
            } else {
                hasMore = false;
                if (reset) {
                    document.getElementById('home-grid').innerHTML = `<div class="col-span-full text-center text-stone-400 py-12 text-xs">No content found for this selection.</div>`;
                }
            }

            isFetching = false;
        }

        function startHeroAutoSlide() {
            if (heroTimer) clearInterval(heroTimer);
            if (!heroItems.length) return;

            renderHeroBanner(heroItems[heroIndex]);

            heroTimer = setInterval(() => {
                heroIndex = (heroIndex + 1) % heroItems.length;
                renderHeroBanner(heroItems[heroIndex]);
            }, 4000);
        }

        async function renderHeroBanner(item) {
            const container = document.getElementById('hero-container');
            const type = item.media_type || (item.title ? 'movie' : 'tv');
            const title = item.title || item.name;
            const backdrop = item.backdrop_path ? `${BACKDROP_URL}${item.backdrop_path}` : `${IMG_URL}${item.poster_path}`;
            const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';

            container.onclick = () => openDetails(type, item.id);

            const logoUrl = await fetchTitleLogo(type, item.id);

            // HERO SECTION WITH ONLY STAR ICON & RATING NUMBER (NO TMDB TEXT)
            container.innerHTML = `
                <div class="absolute inset-0 bg-[#1A1512]">
                    <img src="${backdrop}" class="w-full h-full object-cover object-center transition-all duration-700">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1A1512] via-[#1A1512]/30 to-transparent"></div>
                    <div class="absolute inset-0 bg-gradient-to-r from-[#1A1512]/80 via-transparent to-transparent"></div>
                </div>

                <div class="relative z-10 p-4 w-full flex items-end justify-between gap-4">
                    <div class="space-y-1.5 max-w-[75%]">
                        <span class="bg-indigo-500/20 text-indigo-300 border border-indigo-400/30 text-[10px] font-bold px-2 py-0.5 rounded-lg flex items-center gap-1 w-max backdrop-blur-md">
                            <i class="fa-solid fa-star text-[8px] text-amber-400"></i> ${rating}
                        </span>

                        ${logoUrl ? `
                            <img src="${logoUrl}" alt="${title}" class="max-h-10 max-w-[180px] object-contain drop-shadow-2xl">
                        ` : `
                            <h1 class="text-base font-black text-white leading-tight drop-shadow-md truncate">${title}</h1>
                        `}
                    </div>

                    <div class="flex gap-1.5 pb-1">
                        ${heroItems.map((_, idx) => `
                            <span class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${idx === heroIndex ? 'bg-indigo-400 w-4' : 'bg-white/30'}"></span>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        /* RANDOM PICKER DISCOVERY PAGE LOGIC */
        function setRandomType(type, btnEl) {
            selectedRandomType = type;
            document.querySelectorAll('.rand-type-btn').forEach(b => {
                b.className = "rand-type-btn flex-1 py-2 rounded-xl text-xs font-semibold glass-card text-indigo-200";
            });
            btnEl.className = "rand-type-btn active flex-1 py-2 rounded-xl text-xs font-bold bg-indigo-500 text-white";
        }

        async function executeRandomPick() {
            const container = document.getElementById('random-result-container');
            container.innerHTML = `<div class="py-12 text-center text-indigo-300/60 text-xs"><i class="fa-solid fa-dice fa-spin text-3xl text-amber-400 mb-2"></i><p>Rolling random pick...</p></div>`;

            const country = document.getElementById('random-country').value;
            const genre = document.getElementById('random-genre').value;
            const year = document.getElementById('random-year').value;

            let endpoint = '/discover/movie';
            if (selectedRandomType === 'tv') endpoint = '/discover/tv';
            else if (selectedRandomType === 'all') endpoint = Math.random() > 0.5 ? '/discover/movie' : '/discover/tv';

            const randomPage = Math.floor(Math.random() * 5) + 1;
            let params = `&page=${randomPage}&sort_by=popularity.desc`;

            if (country) params += `&with_origin_country=${country}`;
            if (genre) params += `&with_genres=${genre}`;
            if (year) {
                if (endpoint.includes('movie')) params += `&primary_release_year=${year}`;
                else params += `&first_air_date_year=${year}`;
            }

            const data = await fetchTMDB(endpoint, params);

            if (data && data.results && data.results.length > 0) {
                const randomItem = data.results[Math.floor(Math.random() * data.results.length)];
                renderGrid([randomItem], 'random-result-container');
            } else {
                container.innerHTML = `<p class="text-center text-stone-400 py-8 text-xs">No matching title found. Try changing filters!</p>`;
            }
        }

        /* ENHANCED SEARCH LOGIC */
        function handleSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(async () => {
                const query = document.getElementById('search-input').value.trim();
                const type = document.getElementById('search-type').value;
                const genre = document.getElementById('search-genre').value;
                const year = document.getElementById('search-year').value;

                showGridSkeleton('search-grid');

                let endpoint = '/search/multi';
                let params = `&query=${encodeURIComponent(query)}`;

                if (!query) {
                    endpoint = type === 'tv' ? '/discover/tv' : '/discover/movie';
                    params = '&sort_by=popularity.desc';
                    if (genre) params += `&with_genres=${genre}`;
                    if (year) {
                        if (type === 'tv') params += `&first_air_date_year=${year}`;
                        else params += `&primary_release_year=${year}`;
                    }
                }

                const data = await fetchTMDB(endpoint, params);
                let results = data?.results || [];

                if (type !== 'all') results = results.filter(i => (i.media_type || (i.title ? 'movie' : 'tv')) === type);
                if (genre) results = results.filter(i => i.genre_ids && i.genre_ids.includes(parseInt(genre)));

                renderGrid(results, 'search-grid');
            }, 400);
        }

        function getListData(key) {
            return JSON.parse(localStorage.getItem(`cinedb_${key}`)) || [];
        }

        function toggleQuickBookmark(item) {
            let list = getListData('schedule');
            const index = list.findIndex(i => i.id === item.id);

            if (index > -1) {
                list.splice(index, 1);
                localStorage.setItem('cinedb_schedule', JSON.stringify(list));
                showToast(`Removed "${item.title || item.name}" from Schedule`);
            } else {
                item.userDate = new Date().toISOString().split('T')[0];
                list.push(item);
                localStorage.setItem('cinedb_schedule', JSON.stringify(list));
                showToast(`Scheduled "${item.title || item.name}" for Today!`);
            }

            if (currentTab === 'schedule') renderUserLists();
            if (currentTab === 'home') renderGrid([], 'home-grid', false, true); 
        }

        function handleListAction(item, key) {
            let list = getListData(key);
            const index = list.findIndex(i => i.id === item.id);

            if (index > -1) {
                list.splice(index, 1);
                localStorage.setItem(`cinedb_${key}`, JSON.stringify(list));
                showToast(`Removed from ${key === 'schedule' ? 'Schedule' : 'Watched List'}`);
                if (currentTab === 'schedule') renderUserLists();
                openDetails(item.media_type, item.id);
            } else {
                pendingItem = item;
                pendingKey = key;
                const dateModal = document.getElementById('date-modal');
                const dateInput = document.getElementById('custom-date-input');
                const titleEl = document.getElementById('date-modal-title');
                
                titleEl.innerHTML = key === 'schedule' 
                    ? `<i class="fa-solid fa-calendar-day text-indigo-400"></i> Schedule Plan Date` 
                    : `<i class="fa-solid fa-circle-check text-violet-400"></i> Watched Date`;
                    
                dateInput.value = new Date().toISOString().split('T')[0];
                dateModal.classList.remove('hidden');
            }
        }

        function confirmDateSelection() {
            if (!pendingItem || !pendingKey) return;
            const dateVal = document.getElementById('custom-date-input').value;
            let list = getListData(pendingKey);
            
            pendingItem.userDate = dateVal || new Date().toISOString().split('T')[0];
            list.push(pendingItem);
            
            localStorage.setItem(`cinedb_${pendingKey}`, JSON.stringify(list));
            showToast(`Added to ${pendingKey === 'schedule' ? 'Schedule' : 'Watched List'}!`);
            closeDateModal();
            
            if (currentTab === 'schedule') renderUserLists();
            openDetails(pendingItem.media_type, pendingItem.id);
        }

        function closeDateModal() {
            document.getElementById('date-modal').classList.add('hidden');
            pendingItem = null;
            pendingKey = null;
        }

        function switchListSubTab(sub) {
            const isSched = sub === 'schedule';
            const schedBtn = document.getElementById('subtab-schedule');
            const watchedBtn = document.getElementById('subtab-watched');

            if (isSched) {
                schedBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-indigo-500 to-violet-600 text-white shadow-lg shadow-indigo-500/25 border border-indigo-400/30 flex items-center justify-center gap-2 transition";
                watchedBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold glass-card text-indigo-200 hover:text-white flex items-center justify-center gap-2 transition";
            } else {
                watchedBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-violet-600 to-cyan-500 text-white shadow-lg shadow-violet-500/25 border border-violet-400/30 flex items-center justify-center gap-2 transition";
                schedBtn.className = "flex-1 py-2.5 rounded-xl text-xs font-semibold glass-card text-indigo-200 hover:text-white flex items-center justify-center gap-2 transition";
            }

            document.getElementById('list-schedule-container').classList.toggle('hidden', !isSched);
            document.getElementById('list-watched-container').classList.toggle('hidden', isSched);
        }

        function renderUserLists() {
            renderGrid(getListData('schedule'), 'list-schedule-container');
            renderGrid(getListData('watched'), 'list-watched-container');
        }

        function renderGrid(items, targetId, append = false, refreshOnly = false) {
            const container = document.getElementById(targetId);
            if (!items || items.length === 0) {
                if (!append && !refreshOnly) container.innerHTML = `<div class="col-span-full text-center text-stone-400 py-16 text-xs space-y-2"><i class="fa-regular fa-folder-open text-2xl text-stone-500"></i><p>No saved titles found here.</p></div>`;
                return;
            }

            const schedList = getListData('schedule');

            const html = items.map(item => {
                const title = item.title || item.name || 'Untitled';
                const date = item.release_date || item.first_air_date || 'N/A';
                const year = date !== 'N/A' ? date.split('-')[0] : 'N/A';
                const rating = item.vote_average ? item.vote_average.toFixed(1) : 'N/A';
                const poster = item.poster_path ? `${IMG_URL}${item.poster_path}` : 'https://via.placeholder.com/500x750?text=No+Poster';
                const type = item.media_type || (item.title ? 'movie' : 'tv');
                const isBookmarked = schedList.some(s => s.id === item.id);

                const itemPayload = JSON.stringify({ id: item.id, title, poster_path: item.poster_path, vote_average: item.vote_average, release_date: date, media_type: type }).replace(/"/g, '&quot;');

                return `
                    <div onclick="openDetails('${type}', ${item.id})" class="glass-card rounded-2xl overflow-hidden transition duration-300 cursor-pointer flex flex-col group relative">
                        <button onclick="event.stopPropagation(); toggleQuickBookmark(${itemPayload})" class="absolute top-2 left-2 z-20 w-7 h-7 rounded-xl glass-card flex items-center justify-center text-stone-200 hover:text-amber-400 border border-indigo-500/30 active:scale-95 transition shadow-lg">
                            <i class="${isBookmarked ? 'fa-solid text-amber-400' : 'fa-regular'} fa-bookmark text-xs"></i>
                        </button>

                        <div class="relative aspect-[2/3] bg-[#1A1512] overflow-hidden">
                            <img src="${poster}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                            <span class="absolute top-2 right-2 bg-[#1A1512]/80 backdrop-blur-md text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded-lg flex items-center gap-1 border border-indigo-500/20 shadow-md">
                                <i class="fa-solid fa-star text-[9px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="p-2.5 flex flex-col justify-between flex-grow">
                            <div>
                                <h3 class="text-xs font-semibold text-stone-100 line-clamp-1">${title}</h3>
                                ${item.userDate ? `<span class="text-[9px] text-indigo-400 font-semibold block mt-1"><i class="fa-regular fa-calendar-check text-[8px] mr-1"></i>${item.userDate}</span>` : ''}
                            </div>
                            <div class="flex justify-between items-center text-[10px] text-stone-400 mt-1.5">
                                <span>${year}</span>
                                <span class="uppercase tracking-wider font-bold text-[8px] bg-indigo-500/10 border border-indigo-500/20 px-1.5 py-0.5 rounded-md text-indigo-300">${type}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (append) container.innerHTML += html;
            else container.innerHTML = html;
        }

        async function openDetails(type, id) {
            const newUrl = `${window.location.pathname}?type=${type}&id=${id}`;
            window.history.pushState({ modalOpen: true, tab: currentTab, type, id }, '', newUrl);

            const modal = document.getElementById('details-modal');
            const content = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            content.innerHTML = `<div class="p-16 text-center text-indigo-300/60"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-400 mb-3"></i><p class="text-xs">Loading details...</p></div>`;

            const [data, logoUrl] = await Promise.all([
                fetchTMDB(`/${type}/${id}`, '&append_to_response=credits,watch/providers'),
                fetchTitleLogo(type, id)
            ]);

            if (!data) {
                content.innerHTML = `<p class="p-12 text-center text-stone-400 text-xs">Failed to load content.</p>`;
                return;
            }

            const title = data.title || data.name;
            const backdrop = data.backdrop_path ? `${BACKDROP_URL}${data.backdrop_path}` : `${IMG_URL}${data.poster_path}`;
            const rating = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
            const releaseDate = data.release_date || data.first_air_date || 'N/A';
            const cast = data.credits?.cast?.slice(0, 10) || [];
            const providers = data['watch/providers']?.results?.IN?.flatrate || [];
            const validSeasons = (data.seasons || []).filter(s => s.season_number > 0);

            const schedItem = getListData('schedule').find(i => i.id === data.id);
            const watchedItem = getListData('watched').find(i => i.id === data.id);

            const itemPayload = JSON.stringify({ id: data.id, title, poster_path: data.poster_path, vote_average: data.vote_average, release_date: releaseDate, media_type: type }).replace(/"/g, '&quot;');

            content.innerHTML = `
                <div class="relative aspect-video w-full bg-[#1A1512]">
                    <img src="${backdrop}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#1A1512] via-[#1A1512]/50 to-transparent"></div>
                </div>
                
                <div class="px-5 -mt-20 relative z-10 space-y-5">
                    <div class="flex items-end gap-4">
                        <img src="${IMG_URL}${data.poster_path}" class="w-28 h-40 rounded-2xl border border-indigo-500/30 shadow-2xl object-cover flex-shrink-0">
                        <div class="space-y-2 min-w-0 flex-grow">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded-md inline-block">${type === 'movie' ? 'Movie' : 'TV Show'}</span>
                            
                            ${logoUrl ? `
                                <img src="${logoUrl}" alt="${title}" class="max-h-12 max-w-full object-contain my-1">
                            ` : `
                                <h1 class="text-xl font-bold text-white leading-tight">${title}</h1>
                            `}

                            <div class="flex items-center gap-3 text-xs text-stone-300">
                                <span class="text-amber-400 font-bold flex items-center gap-1 bg-amber-400/10 px-2 py-0.5 rounded-md border border-amber-400/20">
                                    <i class="fa-solid fa-star text-[10px]"></i> ${rating}
                                </span>
                                <span>•</span>
                                <span>${releaseDate}</span>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="handleListAction(${itemPayload}, 'schedule')" class="py-2.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 border transition ${schedItem ? 'bg-indigo-500 text-white border-indigo-300' : 'glass-card text-indigo-200 border-indigo-500/20'}">
                            <i class="fa-solid fa-calendar-plus"></i> ${schedItem ? `Scheduled (${schedItem.userDate})` : 'Add to Schedule'}
                        </button>
                        <button onclick="handleListAction(${itemPayload}, 'watched')" class="py-2.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 border transition ${watchedItem ? 'bg-violet-600 text-white border-violet-300' : 'glass-card text-violet-200 border-indigo-500/20'}">
                            <i class="fa-solid fa-check-circle"></i> ${watchedItem ? `Watched (${watchedItem.userDate})` : 'Mark Watched'}
                        </button>
                    </div>

                    ${providers.length > 0 ? `
                        <div class="glass-card p-3.5 rounded-2xl">
                            <p class="text-xs font-semibold text-indigo-300 mb-2.5">Available On (India Streaming Providers):</p>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar py-1">
                                ${providers.map(p => `
                                    <div class="flex-none w-11 h-11 rounded-2xl overflow-hidden bg-[#1A1512] border border-indigo-500/20 p-1 flex items-center justify-center shadow-lg">
                                        <img src="${IMG_URL}${p.logo_path}" title="${p.provider_name}" class="w-full h-full object-cover rounded-xl">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <div class="glass-card p-4 rounded-2xl">
                        <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider mb-1.5">Overview</h3>
                        <p class="text-xs text-stone-300 leading-relaxed">${data.overview || 'No overview available.'}</p>
                    </div>

                    ${type === 'tv' && validSeasons.length > 0 ? `
                        <div class="glass-card p-4 rounded-2xl space-y-4">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Seasons & Episodes</h3>
                                <span class="text-[10px] text-stone-400">${validSeasons.length} Seasons</span>
                            </div>

                            <div class="flex gap-2 overflow-x-auto no-scrollbar py-1">
                                ${validSeasons.map((s, idx) => `
                                    <button onclick="loadSeasonEpisodes(${id}, ${s.season_number}, this)" class="season-btn ${idx === 0 ? 'bg-indigo-500 text-white border-indigo-300 font-bold' : 'bg-stone-800/80 text-stone-300 border-indigo-500/20'} px-3.5 py-1.5 rounded-xl text-xs font-semibold border whitespace-nowrap transition">
                                        ${s.name}
                                    </button>
                                `).join('')}
                            </div>

                            <div id="episodes-container" class="space-y-3 pt-2"></div>
                        </div>
                    ` : ''}

                    ${cast.length > 0 ? `
                        <div>
                            <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider mb-3">Top Cast (Click to View)</h3>
                            <div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                                ${cast.map(c => {
                                    const photo = c.profile_path ? `${IMG_URL}${c.profile_path}` : 'https://via.placeholder.com/150?text=No+Photo';
                                    return `
                                        <div onclick="openActorModal(${c.id})" class="flex-none w-24 glass-card p-2 rounded-2xl text-center flex flex-col items-center cursor-pointer hover:border-indigo-400 transition">
                                            <img src="${photo}" class="w-14 h-14 rounded-full object-cover border border-indigo-500/30 mb-2 shadow-md">
                                            <p class="text-[11px] font-semibold text-stone-100 truncate w-full">${c.name}</p>
                                            <p class="text-[9px] text-stone-400 truncate w-full mt-0.5">${c.character || ''}</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;

            if (type === 'tv' && validSeasons.length > 0) {
                loadSeasonEpisodes(id, validSeasons[0].season_number, document.querySelector('.season-btn'));
            }
        }

        async function openActorModal(personId) {
            const modal = document.getElementById('actor-modal');
            const content = document.getElementById('actor-modal-content');
            modal.classList.remove('hidden');

            content.innerHTML = `<div class="p-8 text-center text-indigo-300/60"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-indigo-400 mb-2"></i><p class="text-xs">Loading Actor Profile...</p></div>`;

            const data = await fetchTMDB(`/person/${personId}`, '&append_to_response=combined_credits');
            if (!data) return;

            const photo = data.profile_path ? `${IMG_URL}${data.profile_path}` : 'https://via.placeholder.com/300?text=No+Photo';
            const topWorks = data.combined_credits?.cast?.slice(0, 6) || [];

            content.innerHTML = `
                <div class="flex items-center gap-4 mb-4">
                    <img src="${photo}" class="w-20 h-20 rounded-2xl object-cover border border-indigo-500/30 shadow-lg">
                    <div>
                        <h2 class="text-base font-bold text-white">${data.name}</h2>
                        <p class="text-[11px] text-indigo-400">${data.known_for_department || 'Acting'}</p>
                        <p class="text-[10px] text-stone-400 mt-1"><i class="fa-solid fa-cake-candles mr-1"></i>${data.birthday || 'N/A'}</p>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider">Biography</h3>
                    <p class="text-xs text-stone-300 leading-relaxed max-h-32 overflow-y-auto no-scrollbar">${data.biography || 'No biography available.'}</p>
                    
                    <h3 class="text-xs font-bold text-indigo-300 uppercase tracking-wider pt-2">Known For</h3>
                    <div class="grid grid-cols-3 gap-2">
                        ${topWorks.map(w => `
                            <div onclick="closeActorModal(); openDetails('${w.media_type}', ${w.id})" class="glass-card p-1.5 rounded-xl cursor-pointer text-center">
                                <img src="${w.poster_path ? IMG_URL + w.poster_path : 'https://via.placeholder.com/150'}" class="w-full aspect-[2/3] object-cover rounded-lg mb-1">
                                <p class="text-[10px] font-semibold text-white truncate">${w.title || w.name}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function closeActorModal() {
            document.getElementById('actor-modal').classList.add('hidden');
        }

        async function loadSeasonEpisodes(tvId, seasonNumber, btnEl) {
            if (btnEl) {
                document.querySelectorAll('.season-btn').forEach(b => {
                    b.className = "season-btn bg-stone-800/80 text-stone-300 border border-indigo-500/20 px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition";
                });
                btnEl.className = "season-btn bg-indigo-500 text-white border border-indigo-300 font-bold px-3.5 py-1.5 rounded-xl text-xs whitespace-nowrap transition";
            }

            const container = document.getElementById('episodes-container');
            container.innerHTML = `<div class="py-6 text-center text-indigo-300/60 text-xs"><i class="fa-solid fa-circle-notch fa-spin text-lg text-indigo-400 mb-1"></i><p>Loading episodes...</p></div>`;

            const data = await fetchTMDB(`/tv/${tvId}/season/${seasonNumber}`);

            if (!data || !data.episodes || data.episodes.length === 0) {
                container.innerHTML = `<p class="text-center text-stone-400 py-4 text-xs">No episodes found.</p>`;
                return;
            }

            container.innerHTML = data.episodes.map(ep => {
                const thumbnail = ep.still_path ? `${IMG_URL}${ep.still_path}` : 'https://via.placeholder.com/300x170?text=No+Thumbnail';
                const rating = ep.vote_average ? ep.vote_average.toFixed(1) : 'N/A';
                const airDate = ep.air_date || 'N/A';

                return `
                    <div class="glass-card p-2.5 rounded-2xl flex gap-3 items-center border border-indigo-500/10">
                        <div class="relative w-28 aspect-video rounded-xl overflow-hidden bg-[#1A1512] flex-shrink-0">
                            <img src="${thumbnail}" class="w-full h-full object-cover">
                            <span class="absolute bottom-1 right-1 bg-black/80 text-amber-400 font-bold text-[9px] px-1.5 py-0.5 rounded backdrop-blur-sm flex items-center gap-0.5">
                                <i class="fa-solid fa-star text-[7px]"></i> ${rating}
                            </span>
                        </div>
                        <div class="flex-grow min-w-0 space-y-1">
                            <h4 class="text-xs font-bold text-stone-100 truncate">E${ep.episode_number}. ${ep.name}</h4>
                            <p class="text-[10px] text-stone-400 flex items-center gap-1">
                                <i class="fa-regular fa-calendar text-[9px]"></i> ${airDate}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function closeModalManual() {
            window.history.back();
        }

        function closeModalDOM() {
            document.getElementById('details-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
            window.history.pushState({ modalOpen: false, tab: currentTab }, '', window.location.pathname);
        }

        function showGridSkeleton(targetId) {
            document.getElementById(targetId).innerHTML = Array(10).fill(0).map(() => `
                <div class="skeleton rounded-2xl aspect-[2/3] border border-indigo-500/10"></div>
            `).join('');
        }
    </script>
</body>
</html>
