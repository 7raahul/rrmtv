<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Shows & Movies</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #ffffff;
      padding-bottom: 70px; /* Space for fixed bottom nav */
    }

    /* Main Container */
    .container {
      padding: 20px;
    }

    /* Card Layout */
    .card {
      background: #161b22;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    /* Modal / Pop-up Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none; /* Initially Hidden */
      justify-content: center;
      align-items: center;
      z-index: 500; /* Lower than Bottom Nav */
      padding: 20px;
      overflow-y: auto;
    }

    /* Active Modal */
    .modal-overlay.active {
      display: flex;
    }

    /* Modal Content Box */
    .modal-content {
      background: #161b22;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      position: relative;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      margin-bottom: 60px; /* Bottom Nav blockage prevention */
    }

    /* Close (X) Button */
    .close-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Bottom Navigation Bar - FIX APPLIED HERE */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: #161b22;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #30363d;
      z-index: 1000; /* HIGHEST Z-INDEX SO BUTTONS ARE ALWAYS CLICKABLE */
    }

    .nav-item {
      color: #8b949e;
      text-decoration: none;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <!-- Content Section -->
  <div class="container">
    <h2>TV Shows</h2>
    <div class="card" onclick="openModal('Silo', 'In a ruined and toxic future, thousands live in a giant silo deep underground.')">
      <h3>SILO</h3>
      <p>Rating: 8.2 | Click for details</p>
    </div>
  </div>

  <!-- Modal / Pop-up Window -->
  <div class="modal-overlay" id="detailModal" onclick="closeModalOnOutsideClick(event)">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle">Show Title</h2>
      <p id="modalOverview" style="margin-top: 10px; color: #c9d1d9;"></p>
    </div>
  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="handleNavClick('Home')">
      <span>🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item" onclick="handleNavClick('Search')">
      <span>🔍</span>
      <span>Search</span>
    </button>
    <button class="nav-item" onclick="handleNavClick('Random')">
      <span>🎲</span>
      <span>Random</span>
    </button>
    <button class="nav-item" onclick="handleNavClick('My List')">
      <span>📅</span>
      <span>My List</span>
    </button>
  </nav>

  <script>
    const modal = document.getElementById('detailModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalOverview = document.getElementById('modalOverview');

    // Function to Open Modal
    function openModal(title, overview) {
      modalTitle.innerText = title;
      modalOverview.innerText = overview;
      modal.classList.add('active');
    }

    // Function to Close Modal
    function closeModal() {
      modal.classList.remove('active');
    }

    // Close Modal if user clicks outside content box
    function closeModalOnOutsideClick(event) {
      if (event.target === modal) {
        closeModal();
      }
    }

    // Navigation Click Handler (Closes Modal automatically & Handles Nav)
    function handleNavClick(tabName) {
      // Step 1: Close modal if open
      closeModal();

      // Step 2: Handle Navigation Action
      console.log("Navigated to: " + tabName);
      
      // Update Active Tab UI
      const navItems = document.querySelectorAll('.nav-item');
      navItems.forEach(item => item.classList.remove('active'));
      event.currentTarget.classList.add('active');
    }
  </script>

</body>
</html>
