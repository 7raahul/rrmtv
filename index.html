<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamPulse - Ultimate Streaming Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#050505',
                            card: '#0f1015',
                            border: '#1f222e',
                            gold: '#fbbf24',
                            goldBorder: '#855316',
                            goldBg: '#1e160a',
                            navBg: '#1c1d24'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #050505;
            color: #e2e8f0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
        }
        .glass-pill {
            background: rgba(28, 29, 36, 0.90);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.8);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .skeleton {
            background: linear-gradient(90deg, #0f1015 25%, #1d212e 50%, #0f1015 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

    <!-- 1. MAIN APP VIEW -->
    <div id="app-view" class="max-w-md w-full mx-auto px-4 pt-4 space-y-5 min-h-screen">
        
        <!-- Clean Header (Top Search Icon Removed) -->
        <div class="flex items-center justify-between">
            <h1 class="text-xl font-extrabold text-white flex items-center gap-2">
                <i class="fa-solid fa-play-circle text-amber-500"></i> StreamPulse
            </h1>
        </div>

        <!-- Inline Search Field (Triggered via Bottom Nav) -->
        <div id="search-box" class="hidden">
            <input type="text" id="search-input" onkeyup="handleSearch(event)" placeholder="Search movies, tv shows..." 
                   class="w-full bg-brand-card border border-brand-border text-xs px-4 py-3 rounded-2xl outline-none focus:border-amber-500 text-white">
        </div>

        <!-- 16:9 HERO BANNER SECTION WITH AUTO SLIDER -->
        <div id="hero-section" class="relative aspect-video w-full rounded-2xl overflow-hidden border border-brand-border shadow-2xl">
            <div id="hero-bg" class="absolute inset-0 bg-cover bg-center transition-all duration-1000"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-bg via-transparent to-black/40"></div>
            
            <div class="absolute bottom-3 left-3 right-3 flex items-end justify-between z-10">
                <div class="space-y-0.5 max-w-[80%]">
                    <span id="hero-type" class="text-[9px] font-black uppercase tracking-widest text-amber-400 bg-black/60 px-2 py-0.5 rounded">FEATURED</span>
                    <h2 id="hero-title" class="text-base font-extrabold text-white truncate drop-shadow-md">Loading...</h2>
                </div>
                <button id="hero-btn" class="bg-amber-500 hover:bg-amber-600 text-black px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1">
                    Details <i class="fa-solid fa-chevron-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- Category Title -->
        <h2 id="grid-title" class="text-xs font-black text-gray-400 uppercase tracking-wider">Trending Now</h2>

        <!-- Movie/TV Cards Grid -->
        <div id="content-grid" class="grid grid-cols-2 gap-3">
            <!-- Dynamic Content Cards -->
        </div>

        <!-- Infinite Scroll Loader -->
        <div id="infinite-loader" class="py-6 flex justify-center hidden">
            <div class="w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
        </div>
    </div>

    <!-- 2. DETAILS VIEW -->
    <div id="details-view" class="hidden max-w-md w-full mx-auto relative min-h-screen">
        
        <!-- TOP 16:9 BACKDROP SECTION WITH AUTO SLIDER -->
        <section class="relative aspect-video w-full overflow-hidden">
            <div id="details-backdrop" class="absolute inset-0 bg-cover bg-center transition-all duration-1000"></div>
            
            <div class="absolute inset-0 bg-gradient-to-b from-black/60 via-transparent to-brand-bg"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-bg via-brand-bg/40 to-transparent"></div>

            <!-- Top Rating Badge -->
            <div class="absolute top-4 right-4 z-10">
                <div class="bg-black/60 backdrop-blur-md border border-amber-500/30 text-amber-400 font-extrabold text-xs px-2.5 py-1 rounded-lg flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-star text-[11px] text-amber-400"></i>
                    <span id="rating-val">0.0</span>
                </div>
            </div>

            <!-- Title & Type Overlay -->
            <div class="absolute bottom-3 left-4 right-4 z-10 space-y-0.5">
                <span id="media-type" class="text-[10px] font-black uppercase tracking-widest text-amber-400">MOVIE</span>
                <h1 id="media-title" class="text-2xl font-black text-white leading-tight drop-shadow-md">Loading...</h1>
            </div>
        </section>

        <!-- GOLDEN GENRE CHIPS -->
        <section class="px-4 py-2">
            <div id="genre-container" class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
                <!-- Dynamic Chips -->
            </div>
        </section>

        <!-- 2x2 METADATA CARDS GRID -->
        <section class="px-4 py-3 grid grid-cols-2 gap-2.5">
            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">RELEASE</span>
                <span id="meta-release" class="text-xs font-extrabold text-white block">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">RUNTIME</span>
                <span id="meta-runtime" class="text-xs font-extrabold text-white block">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">LANGUAGE</span>
                <span id="meta-lang" class="text-xs font-extrabold text-white block">-</span>
            </div>

            <div class="bg-brand-card/90 border border-brand-border/80 p-3 rounded-2xl space-y-0.5">
                <span class="text-[9px] font-bold text-gray-500 uppercase tracking-wider block">AGE RATING</span>
                <span id="meta-age" class="text-xs font-extrabold text-white block">U/A 13+</span>
            </div>
        </section>

        <!-- NAVIGATION TABS -->
        <section class="px-4 pt-2">
            <div class="flex items-center gap-6 border-b border-brand-border/60 text-xs font-bold pb-2">
                <button onclick="switchTab('overview')" id="tab-overview-btn" class="text-white relative pb-2 transition">
                    Overview
                    <span id="tab-indicator" class="absolute bottom-0 left-0 right-0 h-0.5 bg-amber-500 rounded-full"></span>
                </button>
                <button onclick="switchTab('cast')" id="tab-cast-btn" class="text-gray-400 hover:text-white transition pb-2">
                    Cast & More
                </button>
                <button onclick="switchTab('media')" id="tab-media-btn" class="text-gray-400 hover:text-white transition pb-2">
                    Media
                </button>
            </div>
        </section>

        <!-- TAB CONTENT AREAS -->
        <section class="px-4 py-4 space-y-4">
            
            <!-- OVERVIEW TAB -->
            <div id="tab-overview" class="space-y-4">
                <div class="bg-brand-card/90 border border-brand-border/80 p-4 rounded-3xl space-y-2">
                    <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">OVERVIEW</h3>
                    <p id="overview-text" class="text-xs text-gray-300 leading-relaxed font-normal"></p>
                </div>
            </div>

            <!-- CAST TAB -->
            <div id="tab-cast" class="hidden space-y-3">
                <h3 class="text-xs font-black text-gray-400 uppercase tracking-wider">TOP CAST</h3>
                <div id="cast-grid" class="grid grid-cols-2 gap-3"></div>
            </div>

            <!-- MEDIA TAB (Backdrops, Posters, Logos) -->
            <div id="tab-media" class="hidden space-y-5">
                
                <!-- Backdrops -->
                <div class="space-y-2">
                    <h3 class="text-xs font-black text-amber-400 uppercase tracking-wider">Backdrops</h3>
                    <div id="media-backdrops" class="flex gap-3 overflow-x-auto hide-scrollbar pb-1"></div>
                </div>

                <!-- Posters -->
                <div class="space-y-2">
                    <h3 class="text-xs font-black text-amber-400 uppercase tracking-wider">Posters</h3>
                    <div id="media-posters" class="flex gap-3 overflow-x-auto hide-scrollbar pb-1"></div>
                </div>

                <!-- Logos -->
                <div class="space-y-2">
                    <h3 class="text-xs font-black text-amber-400 uppercase tracking-wider">Logos</h3>
                    <div id="media-logos" class="flex gap-3 overflow-x-auto hide-scrollbar pb-1 bg-brand-card/60 p-3 rounded-2xl border border-brand-border"></div>
                </div>

            </div>

        </section>
    </div>

    <!-- FLOATING PILL BOTTOM NAVIGATION -->
    <div class="fixed bottom-4 left-0 right-0 z-50 flex justify-center px-4">
        <div class="glass-pill rounded-full p-1.5 flex items-center justify-between w-full max-w-xs transition-all duration-300">
            <!-- Home -->
            <button onclick="navigateToTab('home')" id="nav-home" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-white bg-white/10 transition">
                <i class="fa-solid fa-house text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Home</span>
            </button>

            <!-- Movies -->
            <button onclick="navigateToTab('movie')" id="nav-movie" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-clapperboard text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Movies</span>
            </button>

            <!-- TV Shows -->
            <button onclick="navigateToTab('tv')" id="nav-tv" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-tv text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">TV Shows</span>
            </button>

            <!-- Search -->
            <button onclick="toggleSearchInput()" id="nav-search" class="flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
                <span class="text-[10px] font-semibold mt-0.5">Search</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        const TMDB_API_KEY = '0d516ae53b334d92b86cfc7c958d192f';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const ORIGINAL_IMG = 'https://image.tmdb.org/t/p/original';

        let currentTab = 'home';
        let currentPage = 1;
        let isLoading = false;
        let hasMorePages = true;

        // Unique IDs tracker to fix duplicate titles
        const loadedMediaIds = new Set();

        // Auto Slider Timers
        let heroSliderInterval = null;
        let detailsSliderInterval = null;

        window.addEventListener('DOMContentLoaded', () => {
            handleHashChange();
            setupInfiniteScroll();
            fetchHeroContent();
        });

        window.addEventListener('hashchange', handleHashChange);

        function handleHashChange() {
            // Clear existing timers on route change
            clearInterval(detailsSliderInterval);

            const hash = window.location.hash.replace('#', '');
            
            if (hash.startsWith('details?')) {
                const params = new URLSearchParams(hash.split('?')[1]);
                const id = params.get('id');
                const type = params.get('type') || 'movie';
                if (id) renderDetailsPage(id, type);
            } else {
                const targetTab = ['home', 'movie', 'tv'].includes(hash) ? hash : 'home';
                switchMainTab(targetTab);
            }
        }

        function navigateToTab(tab) {
            window.location.hash = tab;
        }

        function switchMainTab(tab) {
            currentTab = tab;
            currentPage = 1;
            hasMorePages = true;
            loadedMediaIds.clear(); // Reset duplicate tracking

            document.getElementById('search-box').classList.add('hidden');
            document.getElementById('details-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');

            ['home', 'movie', 'tv'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex-1 py-2 rounded-full flex flex-col items-center justify-center text-white bg-white/10 transition";
                } else {
                    btn.className = "flex-1 py-2 rounded-full flex flex-col items-center justify-center text-gray-400 hover:text-white transition";
                }
            });

            const title = document.getElementById('grid-title');
            document.getElementById('content-grid').innerHTML = '';

            if (tab === 'movie') {
                title.textContent = "Popular Movies";
            } else if (tab === 'tv') {
                title.textContent = "Popular TV Shows";
            } else {
                title.textContent = "Trending Now";
            }

            fetchGridContent();
        }

        // 1. HOME HERO BANNER SLIDER (Every 3 Seconds)
        async function fetchHeroContent() {
            try {
                const res = await fetch(`${BASE_URL}/trending/all/day?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                const heroItems = (data.results || []).filter(item => item.backdrop_path).slice(0, 5);

                if (heroItems.length === 0) return;

                let currentIndex = 0;
                
                const updateHero = (index) => {
                    const item = heroItems[index];
                    document.getElementById('hero-bg').style.backgroundImage = `url('${ORIGINAL_IMG}${item.backdrop_path}')`;
                    document.getElementById('hero-title').textContent = item.title || item.name;
                    document.getElementById('hero-type').textContent = (item.media_type || 'movie').toUpperCase();
                    document.getElementById('hero-btn').onclick = () => {
                        window.location.hash = `details?id=${item.id}&type=${item.media_type || 'movie'}`;
                    };
                };

                updateHero(0);

                clearInterval(heroSliderInterval);
                heroSliderInterval = setInterval(() => {
                    currentIndex = (currentIndex + 1) % heroItems.length;
                    updateHero(currentIndex);
                }, 3000);

            } catch (e) {
                console.error("Hero fetch error:", e);
            }
        }

        // 2. INFINITE SCROLL & DUPLICATE FIX
        async function fetchGridContent() {
            if (isLoading || !hasMorePages) return;
            isLoading = true;

            const loader = document.getElementById('infinite-loader');
            loader.classList.remove('hidden');

            let endpoint = '';
            if (currentTab === 'movie') endpoint = `movie/popular?page=${currentPage}`;
            else if (currentTab === 'tv') endpoint = `tv/popular?page=${currentPage}`;
            else endpoint = `trending/all/day?page=${currentPage}`;

            try {
                const res = await fetch(`${BASE_URL}/${endpoint}&api_key=${TMDB_API_KEY}`);
                const data = await res.json();

                if (currentPage >= data.total_pages) hasMorePages = false;

                renderGridItems(data.results || []);
                currentPage++;
            } catch (e) {
                console.error(e);
            } finally {
                isLoading = false;
                loader.classList.add('hidden');
            }
        }

        function renderGridItems(items) {
            const grid = document.getElementById('content-grid');

            items.forEach(item => {
                if (!item.backdrop_path && !item.poster_path) return;
                
                // Duplicate Title Prevention
                if (loadedMediaIds.has(item.id)) return;
                loadedMediaIds.add(item.id);

                const type = item.media_type || (currentTab === 'tv' ? 'tv' : 'movie');
                const card = document.createElement('div');
                card.className = "bg-brand-card border border-brand-border rounded-2xl overflow-hidden cursor-pointer group";
                card.onclick = () => {
                    window.location.hash = `details?id=${item.id}&type=${type}`;
                };

                card.innerHTML = `
                    <div class="relative aspect-[2/3] bg-brand-bg">
                        <img src="${IMG_URL}${item.poster_path || item.backdrop_path}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                        <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-1.5 py-0.5 rounded text-[10px] font-bold text-amber-400 border border-amber-500/20">
                            ★ ${item.vote_average?.toFixed(1) || 'N/A'}
                        </div>
                    </div>
                    <div class="p-2.5">
                        <h4 class="text-xs font-bold text-white truncate">${item.title || item.name}</h4>
                        <p class="text-[10px] text-gray-500 mt-0.5 uppercase">${type}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (document.getElementById('app-view').classList.contains('hidden')) return;
                
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    fetchGridContent();
                }
            });
        }

        // 3. DETAILS PAGE RENDER & BACKDROP AUTO SLIDER (Every 3 Seconds)
        async function renderDetailsPage(id, type = 'movie') {
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('details-view').classList.remove('hidden');
            window.scrollTo(0, 0);

            try {
                const res = await fetch(`${BASE_URL}/${type}/${id}?api_key=${TMDB_API_KEY}&append_to_response=credits,images&include_image_language=en,null`);
                const data = await res.json();

                document.getElementById('media-title').textContent = data.title || data.name;
                document.getElementById('media-type').textContent = type.toUpperCase();
                document.getElementById('rating-val').textContent = data.vote_average ? data.vote_average.toFixed(1) : 'N/A';
                document.getElementById('overview-text').textContent = data.overview || 'No overview available.';

                // Backdrop Auto-Slider Implementation
                const backdrops = data.images?.backdrops || [];
                const bgElement = document.getElementById('details-backdrop');

                if (backdrops.length > 0) {
                    let backdropIdx = 0;
                    bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${backdrops[0].file_path}')`;

                    clearInterval(detailsSliderInterval);
                    if (backdrops.length > 1) {
                        detailsSliderInterval = setInterval(() => {
                            backdropIdx = (backdropIdx + 1) % Math.min(backdrops.length, 5);
                            bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${backdrops[backdropIdx].file_path}')`;
                        }, 3000);
                    }
                } else if (data.backdrop_path) {
                    bgElement.style.backgroundImage = `url('${ORIGINAL_IMG}${data.backdrop_path}')`;
                }

                // Metadata
                document.getElementById('meta-release').textContent = data.release_date || data.first_air_date || 'N/A';
                document.getElementById('meta-runtime').textContent = data.runtime ? `${data.runtime} min` : (data.episode_run_time?.[0] ? `${data.episode_run_time[0]} min` : 'N/A');
                document.getElementById('meta-lang').textContent = data.spoken_languages?.[0]?.english_name || 'English';

                // Golden Genres
                const genreContainer = document.getElementById('genre-container');
                genreContainer.innerHTML = (data.genres || []).map(g => `
                    <span class="bg-brand-goldBg border border-brand-goldBorder/60 text-amber-400 text-xs font-semibold px-3.5 py-1.5 rounded-xl flex-shrink-0">${g.name}</span>
                `).join('');

                // Cast
                const castGrid = document.getElementById('cast-grid');
                castGrid.innerHTML = (data.credits?.cast || []).slice(0, 6).map(c => `
                    <div class="bg-brand-card border border-brand-border p-2.5 rounded-2xl flex items-center gap-3">
                        <img src="${c.profile_path ? IMG_URL + c.profile_path : 'https://via.placeholder.com/100'}" class="w-10 h-10 rounded-full object-cover">
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-bold text-white truncate">${c.name}</h4>
                            <p class="text-[10px] text-gray-400 truncate">${c.character || 'Actor'}</p>
                        </div>
                    </div>
                `).join('');

                // MEDIA TAB: Backdrops, Posters, Logos
                document.getElementById('media-backdrops').innerHTML = (data.images?.backdrops || []).slice(0, 6).map(img => `
                    <img src="${IMG_URL}${img.file_path}" class="w-48 aspect-video object-cover rounded-xl border border-brand-border flex-shrink-0">
                `).join('') || `<p class="text-xs text-gray-500">No backdrops found.</p>`;

                document.getElementById('media-posters').innerHTML = (data.images?.posters || []).slice(0, 6).map(img => `
                    <img src="${IMG_URL}${img.file_path}" class="w-24 aspect-[2/3] object-cover rounded-xl border border-brand-border flex-shrink-0">
                `).join('') || `<p class="text-xs text-gray-500">No posters found.</p>`;

                document.getElementById('media-logos').innerHTML = (data.images?.logos || []).slice(0, 6).map(img => `
                    <div class="w-24 h-12 flex items-center justify-center p-1 flex-shrink-0">
                        <img src="${IMG_URL}${img.file_path}" class="max-h-full max-w-full object-contain">
                    </div>
                `).join('') || `<p class="text-xs text-gray-500">No logos found.</p>`;

            } catch (e) {
                console.error(e);
            }
        }

        function switchTab(tab) {
            ['overview', 'cast', 'media'].forEach(t => {
                const btn = document.getElementById(`tab-${t}-btn`);
                const content = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "text-white relative pb-2 transition font-bold";
                    content.classList.remove('hidden');
                } else {
                    btn.className = "text-gray-400 hover:text-white transition pb-2";
                    content.classList.add('hidden');
                }
            });

            const activeBtn = document.getElementById(`tab-${tab}-btn`);
            const indicator = document.getElementById('tab-indicator');
            activeBtn.appendChild(indicator);
        }

        // SEARCH TRIGGER VIA BOTTOM NAV
        function toggleSearchInput() {
            if (!document.getElementById('details-view').classList.contains('hidden')) {
                window.location.hash = 'home';
            }
            const box = document.getElementById('search-box');
            box.classList.toggle('hidden');
            if (!box.classList.contains('hidden')) {
                document.getElementById('search-input').focus();
            }
        }

        async function handleSearch(e) {
            const query = e.target.value.trim();
            if (query.length > 2) {
                loadedMediaIds.clear(); // Reset duplicates for search
                document.getElementById('grid-title').textContent = `Results for "${query}"`;
                document.getElementById('content-grid').innerHTML = '';
                const res = await fetch(`${BASE_URL}/search/multi?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();
                renderGridItems(data.results || []);
            }
        }
    </script>
</body>
</html>
